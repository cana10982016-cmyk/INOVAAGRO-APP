/* INOVAAGRO — identidade visual tirada do logo (setas #5E8145, "Inova" #87B44B, "Agro" #B1D243, texto #201E1E).
   Layout: menu lateral fixo + barra superior com o título da tela; cada tela ocupa o restante. */
:root {
  /* Marca: setas #5E8145, "Inova" #87B44B, "Agro" #B1D243. Interface neutra, verde só onde importa. */
  --brand: #4f7a3a; --brand-2: #6f9a4f; --lime: #b1d243; --ink: #18181b;
  --bg: #fafaf9; --surface: #ffffff; --surface-2: #f5f5f3; --line: #e7e7e3; --line-2: #efefeb;
  --fg: #18181b; --muted: #6b6b72; --subtle: #a1a1a8;
  --accent: #4f7a3a; --accent-fg: #ffffff; --accent-soft: #f1f6ec;
  --nav-bg: #f7f7f5; --nav-fg: #3f3f46; --nav-active: #ffffff; --nav-hover: #efefec;
  --danger: #dc2626; --map-ground: #26302a; --row-hover: #fafaf8; --th-bg: #fafaf9;
  --ok: #16a34a; --warn: #d97706; --bad: #dc2626; --info: #2563eb; --serious: #ea580c;
  --font-display: "Inter", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", "Segoe UI", system-ui, sans-serif;
  --radius: 10px; --topbar-h: 52px; --nav-w: 240px;
  --shadow: 0 1px 2px rgba(20,24,16,.04), 0 1px 1px rgba(20,24,16,.02);
  --shadow-2: 0 8px 24px -6px rgba(20,24,16,.10), 0 2px 6px rgba(20,24,16,.04);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f110e; --surface: #171a15; --surface-2: #1f231c; --line: #2b3027; --line-2: #22261f; --subtle: #6f7369;
    --fg: #ececea; --muted: #9c9f95; --accent: #87b44b; --accent-fg: #10140c; --accent-soft: #223019; --brand: #87b44b;
    --nav-bg: #131611; --nav-fg: #c9ccc2; --nav-active: #1f231c; --nav-hover: #1b1f18;
    --danger: #ef7c72; --map-ground: #101411; --row-hover: #1b1f18; --th-bg: #141712;
    --ok: #3cc13c; --warn: #fab219; --bad: #e66767; --info: #5b9cf0; --serious: #ec835a;
    --shadow: 0 1px 2px rgba(0,0,0,.35); --shadow-2: 0 12px 32px -8px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
    --bg: #0f110e; --surface: #171a15; --surface-2: #1f231c; --line: #2b3027; --line-2: #22261f; --subtle: #6f7369;
    --fg: #ececea; --muted: #9c9f95; --accent: #87b44b; --accent-fg: #10140c; --accent-soft: #223019; --brand: #87b44b;
    --nav-bg: #131611; --nav-fg: #c9ccc2; --nav-active: #1f231c; --nav-hover: #1b1f18;
    --danger: #ef7c72; --map-ground: #101411; --row-hover: #1b1f18; --th-bg: #141712;
    --ok: #3cc13c; --warn: #fab219; --bad: #e66767; --info: #5b9cf0; --serious: #ec835a;
    --shadow: 0 1px 2px rgba(0,0,0,.35); --shadow-2: 0 12px 32px -8px rgba(0,0,0,.6);
    color-scheme: dark;
}
/* Logo: versão com texto escuro no tema claro, versão com texto branco no escuro */
.logo-escuro { display: none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .logo-claro { display: none; } :root:not([data-theme="light"]) .logo-escuro { display: block; } }
:root[data-theme="dark"] .logo-claro { display: none; }
:root[data-theme="dark"] .logo-escuro { display: block; }

html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 2000; background: var(--surface); }
* { box-sizing: border-box; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brand-2); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }

/* Menu lateral */
.nav { position: fixed; top: env(safe-area-inset-top, 0px); bottom: 0; left: 0; width: var(--nav-w); z-index: 1100; background: var(--nav-bg); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding-left: env(safe-area-inset-left, 0px); }
.nav-brand { height: var(--topbar-h); display: flex; align-items: center; padding: 0 18px; border-bottom: 1px solid var(--line); }
.nav-brand .logo { height: 30px; width: auto; max-width: 100%; }
.nav-links { flex: 1; overflow: auto; padding: 10px 10px; display: grid; gap: 2px; align-content: start; }
.nav-links .grp { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 14px 10px 4px; font-weight: 600; }
.nav-links a { display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: 8px; color: var(--nav-fg); text-decoration: none; font-weight: 500; position: relative; }
.nav-links a svg { width: 19px; height: 19px; flex: none; opacity: .85; }
.nav-links a:hover { background: var(--surface-2); color: var(--fg); }
.nav-links a[aria-current="page"] { background: var(--nav-active); color: var(--fg); font-weight: 600; }
.nav-links a[aria-current="page"]::before { content: ""; position: absolute; left: -10px; top: 8px; bottom: 8px; width: 4px; border-radius: 0 4px 4px 0; background: var(--brand); }
.nav-links a[aria-current="page"] svg { color: var(--brand); opacity: 1; }
.nav-links .badge { margin-left: auto; font-size: 11px; font-weight: 700; background: var(--bad); color: #fff; border-radius: 99px; padding: 1px 7px; }
.nav-foot { border-top: 1px solid var(--line); padding: 12px 14px calc(12px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; }
.nav-foot .who { display: grid; gap: 2px; min-width: 0; }
.nav-foot .who b { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-foot .who span { font-size: 12px; color: var(--muted); }
.nav-foot-btns { display: flex; gap: 6px; flex-wrap: wrap; }
.nav-scrim { display: none; }

/* Barra superior */
.topbar { position: fixed; top: env(safe-area-inset-top, 0px); left: var(--nav-w); right: 0; height: var(--topbar-h); z-index: 1000;
  display: flex; align-items: center; gap: 14px; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: 22px; padding-right: max(18px, env(safe-area-inset-right, 0px)); }
.topbar h1 { font-size: 19px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: -0.01em; }
.icon-btn { border: 0; background: none; padding: 6px; border-radius: 8px; cursor: pointer; color: var(--fg); display: inline-grid; place-items: center; }
.icon-btn:hover { background: var(--surface-2); }
.icon-btn.menu-btn { display: none; }
.sync { font-size: 12px; color: var(--muted); white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); display: inline-block; }
.sync[data-mode="nuvem"] i { background: var(--ok); }

main { position: fixed; top: calc(env(safe-area-inset-top, 0px) + var(--topbar-h)); left: var(--nav-w); right: 0; bottom: env(safe-area-inset-bottom, 0px); }
.view { position: absolute; inset: 0; overflow: auto; }

/* Botões e campos */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 7px 13px; border-radius: 8px; cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.1); }
.btn.danger { color: var(--danger); }
.btn.small { padding: 4px 10px; font-size: 13px; }
.btn.big { padding: 10px 14px; }
.btn.ghost { background: transparent; }
.btn[disabled] { opacity: .55; cursor: progress; }
.btn svg { width: 16px; height: 16px; }
input[type="search"], input[type="text"], input[type="email"], input[type="password"], input[type="number"], input[type="date"], select, textarea {
  width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
textarea { min-height: 72px; resize: vertical; }
label.field { display: grid; gap: 4px; font-size: 13px; font-weight: 500; color: var(--muted); }
label.field > span b { color: var(--danger); font-weight: 600; }

/* Papéis: quem só consulta não vê botões de cadastrar/editar */
body[data-papel="leitura"] [data-new], body[data-papel="leitura"] [data-save], body[data-papel="leitura"] [data-del],
body[data-papel="leitura"] .so-edita, body:not([data-papel="admin"]) [data-papel-min="admin"] { display: none !important; }

/* Mapa */
.map-layout { position: absolute; inset: 0; display: grid; grid-template-columns: 310px 1fr; }
.side { border-right: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; min-height: 0; }
.side-head { padding: 14px 16px; display: grid; gap: 10px; border-bottom: 1px solid var(--line); }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.kpi { display: grid; gap: 2px; }
.kpi b { font-family: var(--font-display); font-size: 17px; font-variant-numeric: tabular-nums; }
.kpi span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.tree { overflow: auto; flex: 1; min-height: 0; padding: 6px 0 16px; }
.tree details > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 7px 16px; }
.tree details > summary::-webkit-details-marker { display: none; }
.tree summary:hover, .tree .t:hover { background: var(--surface-2); }
.tree .p > summary { font-weight: 600; }
.tree .f > summary { padding-left: 34px; font-size: 13px; }
.tree .t { display: flex; justify-content: space-between; gap: 8px; padding: 5px 16px 5px 52px; cursor: pointer; font-size: 13px; color: var(--muted); }
.tree .t.sel, .tree summary.sel { background: var(--accent-soft); color: var(--fg); }
.tree .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 10px; height: 10px; border-radius: 3px; flex: none; display: inline-block; }
.chev { transition: transform .15s; color: var(--muted); flex: none; }
details[open] > summary .chev { transform: rotate(90deg); }
.map-wrap { position: relative; min-width: 0; }
#map { position: absolute; inset: 0; background: var(--map-ground); }
.leaflet-container { font-family: var(--font-body); }
.map-panel { position: absolute; left: 12px; top: 12px; z-index: 500; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 10px; display: grid; gap: 10px; width: 250px; max-height: calc(100% - 24px); overflow: auto; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { flex: 1; border: 0; background: var(--surface); padding: 6px 4px; font-size: 12px; cursor: pointer; color: var(--muted); font-weight: 500; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); font-weight: 600; }
.color-by { display: grid; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 500; }
.color-by select { padding: 6px 8px; font-size: 13px; }
.legend { font-size: 12px; display: grid; gap: 3px; }
.legend .li { display: flex; align-items: center; gap: 7px; }
.legend .li .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.legend .li .num { color: var(--muted); }
.map-tools { position: absolute; top: 12px; right: 12px; z-index: 500; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.map-tools .btn { box-shadow: var(--shadow); }
.map-note { position: absolute; left: 12px; bottom: 34px; z-index: 500; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 12px; color: var(--muted); max-width: min(360px, calc(100% - 24px)); }
.leaflet-tooltip.lbl { background: var(--surface); color: var(--fg); border: 1px solid var(--line); box-shadow: none; font-weight: 600; }
.tal-lbl { color: #fff; font-weight: 700; font-size: 11px; text-shadow: 0 0 3px #000, 0 0 2px #000; white-space: nowrap; text-align: center; pointer-events: none; transform: translate(-50%, -50%); }

/* Ficha do talhão */
.sheet { position: absolute; top: 12px; right: 12px; bottom: 12px; width: 350px; max-width: calc(100% - 24px); z-index: 900; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 8px 28px rgba(0,0,0,.22); display: flex; flex-direction: column; min-height: 0; }
.sheet header { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); display: grid; gap: 4px; }
.sheet header .row { display: flex; justify-content: space-between; align-items: start; gap: 8px; }
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.sheet .body { overflow: auto; padding: 12px 16px 16px; display: grid; gap: 16px; align-content: start; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
.sec-title { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-family: var(--font-display); font-size: 14px; font-weight: 700; }
.mini { display: grid; gap: 6px; }
.mini .it { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: grid; gap: 2px; font-size: 13px; cursor: pointer; }
.mini .it:hover { border-color: var(--brand-2); }
.mini .it .top { display: flex; justify-content: space-between; gap: 8px; }
.empty { color: var(--muted); font-size: 13px; margin: 0; }
.x { border: 0; background: none; cursor: pointer; color: var(--muted); font-size: 20px; line-height: 1; padding: 2px 6px; }

/* Páginas */
.page { padding-block: 22px 48px; padding-left: max(22px, env(safe-area-inset-left, 0px)); padding-right: max(22px, env(safe-area-inset-right, 0px)); max-width: 1280px; margin: 0 auto; display: grid; gap: 16px; align-content: start; }
.page-head { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; }
.page-head h2 { font-size: 22px; letter-spacing: -0.01em; }
.page-head p { margin: 4px 0 0; color: var(--muted); }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.toolbar input, .toolbar select { width: auto; min-width: 0; flex: 1 1 200px; }
.page-head .toolbar { flex: 0 1 520px; }
.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; background: var(--surface-2); position: sticky; top: 0; }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; }
td.wrap { white-space: normal; min-width: 200px; }
tbody tr[data-row] { cursor: pointer; }
tbody tr[data-row]:hover { background: var(--surface-2); }
tbody tr:last-child td { border-bottom: 0; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 99px; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.pill.ok { color: color-mix(in srgb, var(--ok) 75%, var(--fg)); background: color-mix(in srgb, var(--ok) 14%, transparent); }
.pill.warn { color: color-mix(in srgb, var(--warn) 75%, var(--fg)); background: color-mix(in srgb, var(--warn) 18%, transparent); }
.pill.bad { color: color-mix(in srgb, var(--bad) 80%, var(--fg)); background: color-mix(in srgb, var(--bad) 14%, transparent); }
.pill.info { color: color-mix(in srgb, var(--info) 80%, var(--fg)); background: color-mix(in srgb, var(--info) 14%, transparent); }
.count { color: var(--muted); font-size: 13px; }

/* Cartões do painel */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 4px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
.tile::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--brand-2); }
.tile.alert::after { background: var(--bad); }
.tile .lbl { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
.tile .val { font-family: var(--font-display); font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; line-height: 1.1; }
.tile .sub { font-size: 12px; color: var(--muted); }
.grid2 { columns: 3 340px; column-gap: 12px; }
.grid2 > * { break-inside: avoid; margin-bottom: 12px; }
a { color: var(--accent); }
.card-box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px 16px; display: grid; gap: 12px; min-width: 0; }
.card-box h3 { font-size: 15px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.card-box h3 small { font-family: var(--font-body); font-weight: 500; font-size: 12px; color: var(--muted); }
.bars { display: grid; gap: 9px; }
.bar { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 10px; font-size: 13px; }
.bar .track { grid-column: 1 / -1; grid-row: 2; }
.bar .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; gap: 6px; align-items: center; }
.bar .track { height: 12px; border-radius: 0 4px 4px 0; background: transparent; position: relative; }
.bar .fill { position: absolute; inset: 0 auto 0 0; border-radius: 0 4px 4px 0; background: var(--brand); min-width: 2px; }
.bar .v { font-variant-numeric: tabular-nums; color: var(--muted); text-align: right; min-width: 70px; }
.bar.click { cursor: pointer; border-radius: 6px; }
.bar.click:hover .name { text-decoration: underline; }
.list { display: grid; }
.list .row { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 9px 0; border-bottom: 1px solid var(--line); cursor: pointer; font-size: 13px; }
.list .row:last-child { border-bottom: 0; }
.list .row:hover b { text-decoration: underline; }
.list .row small { color: var(--muted); grid-column: 1; }

/* Ordens: colunas por status */
.board { display: grid; grid-template-columns: repeat(4, minmax(220px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 6px; }
.col { background: var(--surface-2); border-radius: var(--radius); padding: 10px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.col h3 { font-size: 13px; display: flex; justify-content: space-between; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: grid; gap: 4px; cursor: pointer; }
.card:hover { border-color: var(--brand-2); }
.card b { font-size: 14px; }
.card small { color: var(--muted); }
.card.late { border-left: 4px solid var(--bad); }

/* Relatórios */
.rep-controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; align-items: end; }
.rep-checks { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; }
.rep-checks label { display: flex; gap: 6px; align-items: center; }
.rep-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.report { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 26px 28px; display: grid; gap: 18px; box-shadow: var(--shadow); }
.report .rep-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; border-bottom: 3px solid var(--brand); padding-bottom: 12px; flex-wrap: wrap; }
.report .rep-head img { height: 40px; }
.report .rep-head .t { text-align: right; }
.report .rep-head .t b { font-family: var(--font-display); font-size: 18px; display: block; }
.report h3 { font-size: 16px; color: var(--accent); }
.report h4 { font-family: var(--font-display); font-size: 13px; margin: 6px 0 0; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.report table { font-size: 12px; }
.report th, .report td { padding: 6px 8px; }
.report .faz { display: grid; gap: 8px; break-inside: avoid-page; }
.report .rep-sum { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.report .rep-sum div { background: var(--surface-2); border-radius: 8px; padding: 8px 12px; display: grid; }
.report .rep-sum b { font-family: var(--font-display); font-size: 18px; font-variant-numeric: tabular-nums; }
.report .rep-sum span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }

/* Equipe */
.note { background: var(--accent-soft); border-radius: var(--radius); padding: 12px 14px; font-size: 13px; line-height: 1.5; }
.note ol { margin: 6px 0 0; padding-left: 20px; }
.note code { background: var(--surface); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
.team-add { display: grid; grid-template-columns: 2fr 2fr 1.3fr auto; gap: 10px; align-items: end; }
.team-nome { width: 100%; min-width: 150px; height: 34px; padding: 0 10px; border: 1px solid transparent; border-radius: 8px; background: transparent; font: inherit; color: inherit; }
.team-nome:hover { border-color: var(--line, #e1e0d9); }
.team-nome:focus { border-color: var(--brand, #3f7d2c); background: var(--surface, #fff); outline: none; }
.roles { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.roles div { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 13px; display: grid; gap: 4px; background: var(--surface); }
td select { width: auto; padding: 4px 8px; }

/* Modal */
.modal-bg { position: fixed; inset: 0; background: rgba(10, 14, 8, .5); z-index: 3000; display: grid; place-items: center; padding: 16px; }
.modal { background: var(--surface); border-radius: 12px; width: min(620px, 100%); max-height: calc(100% - 32px); display: flex; flex-direction: column; overflow: auto; box-shadow: 0 20px 50px rgba(0,0,0,.3); }
.modal header { padding: 16px 18px 8px; display: flex; justify-content: space-between; align-items: center; border-top: 4px solid var(--brand); border-radius: 12px 12px 0 0; }
.modal header h2 { font-size: 18px; }
.modal form { padding: 8px 18px 4px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.modal form .full { grid-column: 1 / -1; }
.modal footer { padding: 14px 18px 18px; display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; }
.modal footer .right { display: flex; gap: 8px; margin-left: auto; }
body[data-papel="leitura"] .modal form { pointer-events: none; }
.checks { max-height: 180px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; display: grid; gap: 4px; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
.checks label { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--fg); font-weight: 400; }
.toast { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 8px; z-index: 4000; font-weight: 500; max-width: calc(100% - 32px); }

/* Login e carregamento */
.login-bg { position: fixed; inset: 0; z-index: 2500; background: linear-gradient(160deg, var(--accent-soft), var(--bg) 60%); display: grid; place-items: center; padding: 16px; }
.login-card { width: min(400px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 28px 26px; display: grid; gap: 12px; box-shadow: 0 16px 40px rgba(32,30,30,.12); border-top: 5px solid var(--brand); }
.login-logo { width: 100%; max-width: 280px; height: auto; margin: 0 auto 8px; }
.login-card h2 { font-size: 20px; }
.loading { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 14px; background: var(--bg); z-index: 1500; }
.loading img { width: 220px; height: auto; }

@media (max-width: 1100px) { :root { --nav-w: 208px; } .map-layout { grid-template-columns: 270px 1fr; } }
@media (max-width: 860px) {
  :root { --nav-w: 0px; }
  .nav { width: 264px; transform: translateX(-105%); transition: transform .2s; box-shadow: 0 0 40px rgba(0,0,0,.3); }
  body.nav-open .nav { transform: none; }
  body.nav-open .nav-scrim { display: block; position: fixed; inset: 0; background: rgba(10,14,8,.45); z-index: 1050; }
  .icon-btn.menu-btn { display: inline-grid; margin-left: -6px; }
  .topbar { padding-left: max(12px, env(safe-area-inset-left, 0px)); gap: 8px; }
  .sync span { display: none; }
  .map-layout { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) 36%; }
  .map-wrap { grid-row: 1; }
  .side { grid-row: 2; border-right: 0; border-top: 1px solid var(--line); }
  .map-panel { width: auto; right: auto; max-width: calc(100% - 120px); padding: 8px; gap: 6px; }
  .map-panel .legend { display: none; }
  .map-panel .color-by > span { display: none; }
  .map-tools { top: auto; bottom: 30px; right: 56px; }
  .map-note { bottom: auto; top: 140px; }
  .map-panel.open .legend { display: grid; }
  .sheet { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; max-width: none; max-height: 62%; }
  .modal form { grid-template-columns: 1fr; }
  .board { grid-template-columns: repeat(4, 78vw); }
  .team-add { grid-template-columns: 1fr; }
  .page { padding-left: 16px; padding-right: 16px; }
  .report { padding: 16px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* Impressão: só o relatório */
@media print {
  @page { size: A4 landscape; margin: 12mm; }
  body { overflow: visible; background: #fff; color: #000; }
  .nav, .topbar, .nav-scrim, .no-print, .toast, #loading { display: none !important; }
  main, .view { position: static; overflow: visible; }
  .view:not(#v-relatorios) { display: none !important; }
  .page { padding: 0; max-width: none; }
  .report { border: 0; box-shadow: none; padding: 0; }
  th { position: static; }
}

/* Módulos novos */
.prev { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
.prev .dia { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: grid; gap: 2px; font-size: 12px; }
.prev .dia b { text-transform: capitalize; font-size: 13px; }
.prev .dia .mm { font-family: var(--font-display); font-size: 18px; font-weight: 700; color: var(--info); font-variant-numeric: tabular-nums; }
.hist { display: flex; align-items: flex-end; gap: 2px; height: 90px; border-bottom: 1px solid var(--line); }
.hist span { flex: 1; background: var(--info); border-radius: 3px 3px 0 0; min-width: 3px; }
.fotos { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.fotos figure { margin: 0; display: grid; gap: 4px; font-size: 12px; }
.fotos img, .fotos .semfoto { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 8px; background: var(--surface-2); display: grid; place-items: center; color: var(--muted); }
.modal.wide { width: min(900px, 100%); }
.tg { display: flex; gap: 6px; align-items: center; font-size: 12px; }
.pin-foto { width: 22px; height: 22px; border-radius: 50%; background: #fab219; color: #201e1e; border: 2px solid #fff; display: grid; place-items: center; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
.pop { display: grid; gap: 6px; font-size: 12px; }
.pop img { width: 100%; border-radius: 6px; }
.pop p { margin: 0; }
.page, .card-box, .toolbar > select { min-width: 0; }
.card-box .table-wrap { max-width: 100%; overflow-x: auto; }
.card-box > * { min-width: 0; }

/* ---------- Fase 1: Início, Feed, Notificações, Histórico, Planejamento ---------- */
.bell { position: relative; color: var(--muted); text-decoration: none; }
.bell .badge { position: absolute; top: 0; right: -2px; font-size: 10px; font-weight: 700; background: var(--bad); color: #fff; border-radius: 99px; padding: 1px 5px; line-height: 1.3; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 13px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 3px 11px; font-size: 12px; font-weight: 600; color: var(--muted); cursor: pointer; display: inline-block; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
dd .chip { cursor: default; }
.cards4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; }
.c4 { min-height: 168px; align-content: start; }
.c4 h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.c4-body { display: flex; gap: 16px; align-items: center; }
.c4-body > div:last-child, .c4-big { display: grid; gap: 2px; }
.c4-body b { font-family: var(--font-display); font-size: 20px; }
.c4-big b { font-family: var(--font-display); font-size: 34px; font-weight: 700; line-height: 1.1; }
.c4-list { display: grid; gap: 4px; justify-items: start; }
.ring { --p: 0; width: 84px; height: 84px; border-radius: 50%; background: conic-gradient(var(--c) calc(var(--p) * 1%), var(--surface-2) 0); display: grid; place-items: center; flex: none; }
.ring span { width: 64px; height: 64px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; }
.vazio { display: grid; justify-items: center; gap: 8px; text-align: center; color: var(--muted); padding: 10px 0; font-size: 13px; }
.vazio svg { color: var(--info); }
.vazio.ok svg { color: var(--ok); }
.lnk { border: 0; background: none; padding: 2px 0; color: var(--fg); cursor: pointer; text-align: left; font: inherit; display: inline-flex; align-items: center; gap: 6px; }
.lnk:hover { color: var(--accent); text-decoration: underline; }
a.tile { color: inherit; text-decoration: none; }
a.tile:hover { border-color: var(--brand-2); }
.pn-map-wrap { position: relative; height: min(520px, 62vh); border-radius: 8px; overflow: hidden; background: var(--map-ground); }
#pn-map { position: absolute; inset: 0; }
.pn-filtros { position: absolute; left: 10px; bottom: 10px; z-index: 500; background: var(--surface); border-radius: 10px; padding: 10px 12px; display: grid; gap: 4px; font-size: 12px; box-shadow: var(--shadow); max-width: calc(100% - 20px); }
.pf { display: grid; grid-template-columns: auto auto 1fr auto; gap: 6px; align-items: center; cursor: pointer; }
.cluster { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: #fff; color: #201e1e; font-weight: 700; font-size: 13px; box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 55%, transparent), 0 2px 6px rgba(0,0,0,.35); }
.legend .li { cursor: pointer; border-radius: 4px; }
.legend .li.off { opacity: .4; text-decoration: line-through; }
.tags { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.tag { --tag: #9a9a8a; display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 99px; color: var(--fg); background: color-mix(in srgb, var(--tag) 18%, transparent); border: 1px solid color-mix(in srgb, var(--tag) 45%, transparent); }
.tagpick { display: flex; flex-wrap: wrap; gap: 6px; }
.tagpick .tag { font-size: 12px; padding: 3px 10px; cursor: pointer; }
.tabs { display: flex; gap: 18px; border-bottom: 1px solid var(--line); }
.tabs [role="tab"] { border: 0; background: none; padding: 8px 2px; font: inherit; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px; }
.tabs [aria-selected="true"] { color: var(--fg); border-bottom-color: var(--brand); }
.filtros > summary { list-style: none; display: flex; justify-content: space-between; align-items: center; cursor: pointer; color: var(--muted); }
.filtros > summary::-webkit-details-marker { display: none; }
.fgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.feed-page { max-width: 1040px; }
.feed { display: grid; gap: 14px; }
.post { gap: 14px; padding: 16px 18px; }
.post-h { display: flex; gap: 10px; align-items: center; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
.post-h > div { display: grid; }
.avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--brand); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 13px; flex: none; }
.avatar.sm { width: 28px; height: 28px; font-size: 11px; }
.post-b { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 20px; }
.carrossel { position: relative; aspect-ratio: 4 / 3; max-width: 100%; border-radius: 10px; overflow: hidden; background: var(--surface-2); }
.carrossel img { width: 100%; height: 100%; object-fit: cover; cursor: zoom-in; display: block; }
.carrossel .semfoto { height: 100%; display: grid; place-content: center; justify-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
.nav-f { position: absolute; top: 50%; transform: translateY(-50%); border: 0; width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,.85); color: #201e1e; font-size: 22px; line-height: 1; cursor: pointer; }
.nav-f.prev { left: 8px; } .nav-f.next { right: 8px; }
.dots { position: absolute; bottom: 8px; left: 0; right: 0; display: flex; justify-content: center; gap: 5px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.55); }
.dots i.on { background: #fff; }
.post-info { display: grid; gap: 12px; align-content: start; }
.post-t { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.post-t h3 { font-size: 20px; } .post-t h3 span { font-family: var(--font-body); font-weight: 500; font-size: 15px; }
.sem { width: 20px; height: 20px; border-radius: 50%; background: var(--c); flex: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 25%, transparent); }
.post-f { display: flex; gap: 18px; justify-content: center; border-top: 1px solid var(--line); padding-top: 10px; }
.react { border: 0; background: none; display: inline-flex; gap: 6px; align-items: center; color: var(--muted); cursor: pointer; font: inherit; padding: 4px 8px; border-radius: 6px; }
.react:hover { background: var(--surface-2); color: var(--fg); }
.react.on { color: var(--accent); }
.cmts { display: grid; gap: 8px; }
.cmt { display: flex; gap: 8px; } .cmt p { margin: 2px 0 0; }
.cmt-new { display: flex; gap: 6px; } .cmt-new input { flex: 1; min-width: 0; }
.foto-bg { place-items: center; }
.foto-full { margin: 0; display: grid; gap: 8px; max-width: min(1100px, 100%); }
.foto-full img { max-height: 80vh; width: auto; max-width: 100%; border-radius: 8px; justify-self: center; }
.foto-full figcaption { color: #fff; text-align: center; font-size: 13px; }
.foto-full a, .foto-full .lnk { color: #fff; }
.notifs { display: grid; gap: 6px; }
.notif { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 14px; cursor: pointer; font: inherit; color: inherit; }
.notif span { display: grid; gap: 2px; min-width: 0; }
.notif.nova { border-left: 4px solid var(--brand); background: color-mix(in srgb, var(--accent-soft) 50%, var(--surface)); }
.tl { padding: 4px 18px 18px; display: grid; gap: 4px; }
.tl-g { margin: 12px 0 4px; font-family: var(--font-display); font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.tl-it { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; text-align: left; border: 0; border-left: 2px solid var(--line); margin-left: 15px; padding: 6px 8px 6px 0; background: none; font: inherit; color: inherit; cursor: pointer; }
.tl-it:hover { background: var(--surface-2); }
.tl-it > span:nth-child(2) { display: grid; min-width: 0; }
.tl-ic { width: 30px; height: 30px; margin-left: -16px; border-radius: 50%; background: var(--surface); border: 2px solid var(--c); color: var(--c); display: grid; place-items: center; }
.tl-ic svg { width: 16px; height: 16px; }
.pl-grid { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 14px; align-items: start; }
.pl-tree { max-height: 520px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
.pl-tree summary { display: flex; justify-content: space-between; gap: 8px; padding: 5px 0; cursor: pointer; }
.pl-tree details.f { margin-left: 18px; }
.pl-tal { display: grid; margin-left: 22px; gap: 2px; padding-bottom: 4px; }
.ck { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; cursor: pointer; }
.pl-res { display: grid; gap: 2px; background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; font-size: 13px; }
.btn.big { padding: 10px 16px; font-size: 15px; justify-content: center; }
.mini-tiles .tile .val { font-size: 22px; }
.chk { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; }
@media (max-width: 860px) {
  .post-b, .pl-grid { grid-template-columns: 1fr; }
  .pn-filtros { position: static; box-shadow: none; border-top: 1px solid var(--line); border-radius: 0; }
  .pn-map-wrap { height: auto; display: grid; grid-template-rows: 340px auto; background: var(--surface); }
  #pn-map { position: relative; height: 340px; }
  .bell { margin-left: auto; }
}

/* ---------- Fase 1b: análise, relatórios do sistema, produtos da ordem ---------- */
.an-body { display: grid; gap: 14px; }
.an-body .span2, .grid2 > .span2 { grid-column: 1 / -1; }
.svg-wrap { overflow-x: auto; max-width: 100%; }
.svg-wrap svg { display: block; }
.svg-wrap text { font-size: 11px; fill: var(--muted); font-family: inherit; }
.rs-grid { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 14px; align-items: start; }
.rs-main { display: grid; gap: 14px; min-width: 0; }
.rs-list { padding: 8px; gap: 2px; position: sticky; top: 12px; }
.rs-it { text-align: left; border: 0; background: none; font: inherit; padding: 9px 10px; border-radius: 8px; cursor: pointer; color: var(--fg); }
.rs-it:hover { background: var(--hover, rgba(94,129,69,.08)); }
.rs-it[aria-current="true"] { background: var(--brand); color: #fff; font-weight: 600; }
.rs-cols summary { cursor: pointer; font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
.rs-cols summary svg { width: 16px; height: 16px; }
.rep-checks { display: flex; flex-wrap: wrap; gap: 6px 14px; padding-top: 8px; font-size: 13px; }
.prod-ed { display: grid; gap: 6px; }
.prod-t { font-size: 13px; min-width: 560px; }
.prod-t td { padding: 4px; vertical-align: middle; }
.prod-t input, .prod-t select { width: 100%; min-width: 0; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--fg); font: inherit; }
.prod-t input.r { text-align: right; }
.prod-t .ord-n { width: 26px; color: var(--muted); text-align: center; font-weight: 600; }
.prod-t .nowrap { white-space: nowrap; }
.prod-t .btn.small { padding: 3px 7px; margin-left: 2px; }
.modal footer [data-receita] svg { width: 16px; height: 16px; }
@media (max-width: 760px) { .rs-grid { grid-template-columns: 1fr; } .rs-list { position: static; display: flex; overflow-x: auto; } .rs-it { white-space: nowrap; flex: 0 0 auto; } }
.prod-t th:nth-child(3), .prod-t th:nth-child(5) { width: 120px; }
.prod-t th:nth-child(4) { width: 120px; }
.prod-t th:nth-child(6) { width: 112px; }
.prod-t .p-prod { min-width: 160px; }
/* Controles com cálculo */
.ctrl-ed { display: grid; gap: 8px; }
.ctrl-par { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
.ctrl-t { min-width: 420px; }
.ctrl-t th:last-child { width: 40px; }
.ctrl-res { display: flex; gap: 14px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
#ctrl-out { text-align: right; font-size: 13px; }
#ctrl-out b { font-size: 16px; }
.alertas { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; margin-bottom: 10px; }
.alertas .pill { font-size: 12.5px; padding: 3px 9px; }
.fz-list { max-height: 52vh; overflow: auto; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
.fz-list details { padding: 4px 0; border-bottom: 1px solid var(--line); }
.fz-list details:last-child { border-bottom: 0; }
.fz-list summary { cursor: pointer; padding: 4px 0; }
.fz-it { display: flex; gap: 8px; align-items: center; padding: 3px 0 3px 26px; font-size: 13.5px; }
.head-acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.exec-ed { display: grid; gap: 6px; }
.exec-t { min-width: 520px; }
.exec-t tfoot td { padding: 6px 4px; border-top: 1px solid var(--line); }
.sec-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.silo-t { min-width: 720px; }
.silo-t th:nth-child(1) { width: 140px; } .silo-t th:nth-child(2) { width: 150px; } .silo-t th:nth-child(3), .silo-t th:nth-child(4), .silo-t th:nth-child(5) { width: 95px; } .silo-t th:last-child { width: 40px; }
tr.click { cursor: pointer; }
tr.click:hover td { background: rgba(94,129,69,.06); }
.page-head .head-acts { flex: 0 1 auto; justify-content: flex-end; }
.head-acts select { width: auto; min-width: 170px; max-width: 260px; }
@media (max-width: 760px) { .page-head .head-acts { justify-content: flex-start; } .head-acts select { flex: 1 1 150px; max-width: none; } }
/* Imagens satelitais */
.sat-grid { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 14px; align-items: start; }
#sat-map { height: 62vh; min-height: 380px; border-radius: 8px; }
.cenas { display: grid; gap: 6px; max-height: 56vh; overflow: auto; }
.cena { display: flex; justify-content: space-between; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; font: inherit; cursor: pointer; color: var(--fg); }
.cena[aria-pressed="true"] { border-color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; width: max-content; }
.seg button { border: 0; background: var(--surface); padding: 6px 14px; font: inherit; cursor: pointer; color: var(--fg); }
.seg button[aria-pressed="true"] { background: var(--brand); color: #fff; font-weight: 600; }
.ndvi-leg { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.ndvi-leg i { flex: 1; height: 10px; border-radius: 5px; background: linear-gradient(90deg, #a50026, #f46d43, #fee08b, #a6d96a, #1a9850, #006837); }
@media (max-width: 760px) { .sat-grid { grid-template-columns: 1fr; } #sat-map { height: 50vh; } .cenas { max-height: 30vh; } }


/* =====================================================================
   Design system InovaAgro (v2): neutro, linhas finas, verde da marca só
   no que importa (item ativo, ação principal, dados). Inter 13px.
   ===================================================================== */
body { font-size: 13px; line-height: 1.45; -webkit-font-smoothing: antialiased; font-feature-settings: "cv11", "ss01"; }
h1, h2, h3 { font-family: var(--font-body); letter-spacing: -0.01em; }
:focus-visible { outline: 2px solid color-mix(in srgb, var(--brand) 55%, transparent); outline-offset: 1px; }
a { color: var(--brand); text-decoration-color: color-mix(in srgb, var(--brand) 35%, transparent); text-underline-offset: 2px; }

/* Menu lateral */
.nav { background: var(--nav-bg); border-right: 1px solid var(--line); }
.nav-brand { height: auto; padding: 14px 14px 10px; border-bottom: 0; gap: 10px; }
.ws-ic { width: 30px; height: 30px; border-radius: 8px; object-fit: contain; background: #fff; border: 1px solid var(--line); padding: 3px; flex: none; }
.ws-t { display: grid; min-width: 0; line-height: 1.3; }
.ws-t b { font-size: 13.5px; font-weight: 600; letter-spacing: -.01em; }
.ws-t span { font-size: 11.5px; color: var(--muted); }
.nav-search { margin: 4px 12px 6px; display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px 0 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--subtle); box-shadow: var(--shadow); cursor: text; }
.nav-search svg { width: 15px; height: 15px; stroke: currentColor; stroke-width: 1.75; fill: none; stroke-linecap: round; flex: none; }
.nav-search input[type="search"] { border: 0; padding: 0; background: none; height: 100%; min-width: 0; flex: 1; box-shadow: none !important; font-size: 13px; color: var(--fg); }
.nav-search input::placeholder { color: var(--subtle); }
.nav-search kbd { font: 500 10.5px var(--font-body); color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; background: var(--surface-2); white-space: nowrap; }
.nav-links { padding: 2px 8px 12px; gap: 1px; }
.nav-links .grp { font-size: 11px; font-weight: 500; text-transform: none; letter-spacing: .01em; color: var(--subtle); padding: 14px 10px 4px; }
.nav-links a { gap: 10px; padding: 6px 10px; border-radius: 7px; color: var(--nav-fg); border: 1px solid transparent; font-weight: 500; }
.nav-links a svg { width: 16px; height: 16px; opacity: 1; color: #7a7a82; }
.nav-links a > span:first-of-type { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-links a:hover { background: var(--nav-hover); color: var(--fg); }
.nav-links a[aria-current="page"] { background: var(--nav-active); border-color: var(--line); box-shadow: var(--shadow); color: var(--fg); font-weight: 500; }
.nav-links a[aria-current="page"]::before { display: none; }
.nav-links a[aria-current="page"] svg { color: var(--brand); }
.nav-links .ct { margin-left: auto; font-size: 11px; color: var(--muted); font-weight: 500; }
.nav-links .badge { margin-left: auto; font-size: 10.5px; font-weight: 600; padding: 0 6px; line-height: 17px; }
.nav-links .ct + .badge { margin-left: 6px; }
.nav-foot { padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px)); gap: 8px; }
.nav-me { display: flex; gap: 10px; align-items: center; min-width: 0; }
.nav-foot .who b { font-size: 12.5px; font-weight: 600; }
.nav-foot .who span { font-size: 11.5px; }
.nav-foot-btns .btn { height: 26px; font-size: 12px; }
.avatar { background: linear-gradient(135deg, var(--brand-2), var(--lime)); font-weight: 600; letter-spacing: .02em; }

/* Barra superior */
.topbar { height: var(--topbar-h); gap: 10px; padding-left: 24px; background: color-mix(in srgb, var(--surface) 82%, transparent); backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid var(--line); }
.crumb { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; color: var(--muted); font-weight: 500; }
.crumb > span { white-space: nowrap; }
.crumb svg { width: 14px; height: 14px; stroke: var(--subtle); stroke-width: 1.75; fill: none; stroke-linecap: round; flex: none; }
.topbar h1 { font-size: 13px; font-weight: 600; color: var(--fg); letter-spacing: 0; flex: 1; }
.icon-btn { width: 30px; height: 30px; padding: 0; border-radius: 7px; color: var(--muted); }
.icon-btn svg { width: 18px; height: 18px; }
.bell .badge { top: 1px; right: 0; font-size: 9.5px; padding: 0 4px; line-height: 14px; box-shadow: 0 0 0 2px var(--surface); }
.sync { height: 26px; padding: 0 9px; border: 1px solid var(--line); border-radius: 99px; background: var(--surface); font-weight: 500; color: var(--muted); }
.sync i { width: 7px; height: 7px; }

/* Botões e campos */

input[type="search"], input[type="text"], input[type="email"], input[type="password"], input[type="number"], input[type="date"], select, textarea {
  padding: 0 10px; height: 32px; border-radius: 7px; border-color: var(--line); font-size: 13px; box-shadow: var(--shadow); }
textarea { height: auto; padding: 8px 10px; }

label.field { gap: 5px; font-size: 12.5px; font-weight: 500; color: var(--fg); }

/* Páginas */

/* Cartões */
.card-box, .tile, .table-wrap, .report, .sheet, .map-panel { border-color: var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.card-box { padding: 14px 16px 16px; gap: 12px; }

/* Barras e listas */

/* Filtros: chips viram controle segmentado */
.chips { gap: 4px; }

.chip { height: 26px; padding: 0 10px; border-radius: 7px; font-size: 12px; font-weight: 500; border-color: var(--line); color: var(--muted); background: var(--surface); display: inline-flex; align-items: center; }

.seg { display: inline-flex; padding: 2px; gap: 2px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; overflow: visible; width: max-content; max-width: 100%; }

:root[data-theme="dark"] .pill, :root[data-theme="dark"] .pill.ok, :root[data-theme="dark"] .pill.warn, :root[data-theme="dark"] .pill.bad, :root[data-theme="dark"] .pill.info { background: var(--surface-2); border-color: var(--line); color: var(--fg); }

.cp-lnk { border: 0; background: none; font-weight: 700; text-decoration: underline; padding: 6px; }
/* Faixa de pendências */
.cp-faixa { position: absolute; z-index: 700; left: 0; right: 0; bottom: var(--cp-tab-h); min-height: 42px; background: var(--lime); color: #1d2a12; display: flex; align-items: center; gap: 6px; padding: 0 4px 0 14px; font-size: 14px; font-weight: 600; }
.cp-faixa span { flex: 1; }
.cp-faixa-on .cp-fab { bottom: 58px; }
.cp-faixa-on .cp-card { bottom: 52px; }
.cp-faixa-on .cp-leg { bottom: 58px; }
/* Barra inferior */
.cp-tabs { position: absolute; z-index: 800; left: 0; right: 0; bottom: 0; height: var(--cp-tab-h); padding-bottom: env(safe-area-inset-bottom, 0px); background: var(--surface); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(4, 1fr); }
.cp-tabs button { border: 0; background: none; display: grid; justify-items: center; align-content: center; gap: 3px; font-size: 12px; color: var(--muted); position: relative; }
.cp-tabs button[aria-current] { color: var(--brand); font-weight: 700; }
.cp-tabs .ic { width: 26px; height: 26px; }
.cp-badge { position: absolute; top: 6px; left: calc(50% + 6px); min-width: 18px; height: 18px; border-radius: 9px; background: var(--bad); color: #fff; font-size: 11px; display: grid; place-items: center; padding: 0 4px; }
/* Menu lateral */
.cp-scrim { position: absolute; inset: 0; z-index: 900; background: rgba(0,0,0,.45); opacity: 0; pointer-events: none; transition: opacity .2s; }
.cp-drawer { position: absolute; z-index: 901; top: 0; bottom: 0; left: 0; width: min(88vw, 360px); background: var(--surface); transform: translateX(-102%); transition: transform .22s ease; overflow: auto; display: flex; flex-direction: column; }
.cp-menu-on .cp-scrim { opacity: 1; pointer-events: auto; }
.cp-menu-on .cp-drawer { transform: none; }
.cp-perfil { display: flex; align-items: center; gap: 12px; padding: calc(var(--cp-top) + 22px) 12px 18px 18px; }
.cp-perfil > div:nth-child(2) { flex: 1; min-width: 0; }
.cp-perfil b { display: block; font-size: 16px; overflow: hidden; text-overflow: ellipsis; }
.cp-perfil span { color: var(--muted); font-size: 13px; }
.cp-av { width: 56px; height: 56px; border-radius: 50%; background: var(--brand); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 20px; border: 3px solid var(--lime); }
.cp-syncbox { background: var(--cp-dark); color: #fff; padding: 18px; display: grid; gap: 10px; border-radius: 22px 22px 0 0; }
.cp-syncbox h2 { margin: 0; font-size: 19px; }
.cp-syncbox p { margin: 0; font-size: 14px; }
.cp-warn { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--warn); color: #1d1d1d; font-size: 13px; margin-right: 4px; }
.cp-btn-sync { background: #fff; color: var(--cp-dark); border: 0; border-radius: 24px; height: 48px; }
.cp-btn-sync .ic { color: var(--brand-2, #6f9a4f); }
.cp-lnk-inv { color: #fff; text-align: left; padding: 0; }
.cp-mut2 { opacity: .8; font-size: 13px !important; }
.cp-aviso { background: rgba(255,255,255,.12); border-radius: 10px; padding: 10px; font-size: 13px !important; }
.cp-mlinks { display: grid; padding: 8px 0; }
.cp-mlinks button { display: flex; align-items: center; gap: 14px; padding: 14px 20px; border: 0; background: none; font-size: 16px; text-align: left; }
.cp-mlinks button:active { background: var(--surface-2); }
/* Folhas */
.cp-sheet-bg { position: absolute; inset: 0; z-index: 1200; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; }
.cp-sheet { width: 100%; max-height: 88%; overflow: auto; background: var(--surface); border-radius: 18px 18px 0 0; padding: 6px 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px; animation: cp-sobe .18s ease; }
.cp-sheet.alto { height: 82%; grid-template-rows: auto auto auto auto 1fr; }
@keyframes cp-sobe { from { transform: translateY(30px); opacity: .5; } }
.cp-grip { width: 40px; height: 4px; border-radius: 2px; background: var(--line); justify-self: center; }
.cp-sh-h { display: flex; align-items: center; justify-content: space-between; }
.cp-sh-h h2 { margin: 0; font-size: 18px; }
.cp-seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface-2); border-radius: 12px; padding: 4px; }
.cp-seg button { border: 0; background: none; height: 38px; border-radius: 9px; font-weight: 600; }
.cp-seg button[aria-pressed="true"] { background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.15); }
.cp-busca { height: 44px; border-radius: 12px; border: 1px solid var(--line); padding: 0 14px; font: inherit; background: var(--surface); color: var(--fg); width: 100%; box-sizing: border-box; }
.cp-plist, .cp-hist, .cp-mini, .cp-pts { list-style: none; margin: 0; padding: 0; overflow: auto; }
.cp-plist li > button { width: 100%; text-align: left; border: 0; background: none; padding: 11px 6px; border-bottom: 1px solid var(--line-2, var(--line)); display: grid; gap: 2px; }
.cp-plist li > button[aria-current] { background: var(--accent-soft); border-radius: 8px; }
.cp-plist small, .cp-hist small, .cp-mini small, .cp-pts small { color: var(--muted); font-size: 12.5px; }
.cp-pgrp { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 700; padding: 14px 6px 4px; }
.cp-vazio { color: var(--muted); padding: 22px 6px; text-align: center; }
.cp-bases { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.cp-bases button { border: 2px solid transparent; background: none; border-radius: 12px; padding: 4px; display: grid; gap: 6px; font-size: 13px; font-weight: 600; }
.cp-bases button[aria-pressed="true"] { border-color: var(--brand); }
.cp-bthumb { height: 64px; border-radius: 9px; display: block; }
.cp-b-sat { background: linear-gradient(135deg, #3c5a2b, #7a6a3d 50%, #2f4a2a); }
.cp-b-hib { background: linear-gradient(135deg, #3c5a2b, #7a6a3d 50%, #2f4a2a); box-shadow: inset 0 0 0 2px rgba(255,255,255,.4); }
.cp-b-ruas { background: linear-gradient(135deg, #eef0e6, #dfe7d3 50%, #f6f1e2); }
.cp-tg { display: grid; }
.cp-tg label { display: flex; justify-content: space-between; align-items: center; padding: 12px 2px; border-bottom: 1px solid var(--line); font-size: 15px; }
.cp-tg input { width: 22px; height: 22px; accent-color: var(--brand); }
/* Barras de topo das telas */
.cp-bar { position: sticky; top: 0; z-index: 5; display: grid; grid-template-columns: 48px 1fr 48px; align-items: center; min-height: 56px; padding-top: var(--cp-top); background: var(--cp-dark); color: #fff; }
.cp-bar h1 { margin: 0; text-align: center; font-size: 18px; font-weight: 700; color: #fff; }
.cp-bar .cp-ib { color: #fff; margin-left: 4px; }
/* Telas empilhadas (Atividades, Visita) */
.cp-screens { position: absolute; inset: 0; z-index: 1000; pointer-events: none; }
.cp-tela { position: absolute; inset: 0; background: var(--bg); overflow: auto; pointer-events: auto; animation: cp-entra .18s ease; }
@keyframes cp-entra { from { transform: translateX(24px); opacity: .6; } }
.cp-ctx { padding: 12px 18px; background: var(--surface); border-bottom: 1px solid var(--line); font-size: 14px; }
.cp-ativ { padding: 6px 12px 30px; }
.cp-ativ details { border-bottom: 1px solid var(--line); }
.cp-ativ summary { list-style: none; display: flex; align-items: center; justify-content: space-between; padding: 16px 6px 10px; font-size: 13px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.cp-ativ summary::-webkit-details-marker { display: none; }
.cp-ativ details[open] summary .ic { transform: rotate(180deg); }
.cp-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding-bottom: 14px; }
.cp-grid button { border: 0; background: none; display: grid; justify-items: center; gap: 8px; padding: 6px 2px; font-size: 13px; line-height: 1.25; text-align: center; }
.cp-grid i { width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--brand); border: 1.5px solid color-mix(in srgb, var(--brand) 35%, transparent); }
.cp-grid i .ic { width: 34px; height: 34px; stroke-width: 1.5; }
.cp-grid button:active i { background: var(--brand); color: #fff; }
/* Histórico */
.cp-chips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 14px 4px; scrollbar-width: none; }
.cp-chip { flex: none; height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 600; }
.cp-chip[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: #fff; }
.cp-escopo { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 16px; font-size: 13px; }
.cp-escopo label { display: flex; align-items: center; gap: 6px; }
.cp-hist { padding: 0 10px 20px; }
.cp-hist li > button { width: 100%; display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; align-items: center; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; margin-bottom: 8px; }
.cp-hi { width: 40px; height: 40px; border-radius: 50%; background: var(--accent-soft); color: var(--brand); display: grid; place-items: center; }
.cp-ht { min-width: 0; display: grid; }
.cp-ht b, .cp-ht small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cp-hd { font-size: 12px; color: var(--muted); display: grid; justify-items: end; gap: 3px; }
.cp-pend { font-style: normal; font-size: 11px; font-weight: 700; color: #7a5200; background: #fde7a8; border-radius: 6px; padding: 1px 6px; }
/* Seções do site exibidas no modo campo */
.cp-host > .view, .cp-host-in > .view { position: static !important; display: block; overflow: visible; }
.cp-host .page { padding: 14px 12px 24px; }
/* Visita */
.cp-visita { display: flex; flex-direction: column; }
.cp-vmap { position: relative; height: 38vh; min-height: 220px; flex: none; transition: height .2s; }
.cp-vmap-grande .cp-vmap { height: 72vh; }
#cp-vmap { position: absolute; inset: 0; background: var(--map-ground); }
.cp-vtools { top: 12px; }
.cp-vbody { flex: 1; background: var(--bg); border-radius: 18px 18px 0 0; margin-top: -16px; position: relative; z-index: 2; padding: 0 0 30px; display: grid; gap: 12px; align-content: start; }
.cp-vhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--surface); border-radius: 18px 18px 0 0; padding: 18px 16px 14px; }
.cp-vhead b { display: block; font-size: 22px; font-weight: 800; }
.cp-vhead span, .cp-vhead small { display: block; color: var(--muted); font-size: 13px; }
.cp-vhead .cp-btn { border-radius: 24px; height: 48px; padding: 0 18px; }
.cp-gpsinfo { margin: -6px 16px 0; font-size: 12.5px; color: var(--muted); }
.cp-gpsinfo[data-ok="1"]::before { content: "● "; color: var(--ok); }
.cp-gpsinfo[data-ok="0"]::before { content: "● "; color: var(--warn); }
.cp-h3 { margin: 4px 16px 0; font-size: 16px; }
.cp-wps { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; padding: 2px 12px 4px; }
.cp-wps button { min-width: 0; border: 0; background: none; display: grid; justify-items: center; gap: 6px; font-size: 12.5px; padding: 0; }
.cp-wps i { width: min(56px, 15vw); height: min(56px, 15vw); border-radius: 50%; background: var(--cp-dark); color: #fff; display: grid; place-items: center; }
.cp-wps i .ic { width: 28px; height: 28px; }
.cp-wps button:active i { background: var(--brand); }
.cp-box { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; margin: 0 14px; padding: 12px 14px; display: grid; gap: 10px; }
.cp-row { display: flex; justify-content: space-between; align-items: center; font-size: 16px; }
.cp-num { min-width: 70px; text-align: center; background: var(--surface-2); border-radius: 8px; padding: 8px 10px; font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.cp-box summary { list-style: none; display: flex; justify-content: flex-end; align-items: center; gap: 4px; color: var(--brand); font-weight: 700; font-size: 14px; }
.cp-box summary::-webkit-details-marker { display: none; }
.cp-mini li, .cp-pts li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.cp-mini li > span, .cp-pts li > span:not(.cp-th) { flex: 1; min-width: 0; display: grid; font-size: 14px; }
.cp-niv { font-style: normal; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 6px; background: var(--surface-2); }
.cp-niv.Baixo { color: var(--ok); } .cp-niv.Médio { color: var(--warn); } .cp-niv.Alto { color: var(--bad); }
.cp-tab { width: 100%; border-collapse: collapse; font-size: 14px; }
.cp-tab th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 4px 4px; border-bottom: 1px solid var(--line); }
.cp-tab td { padding: 7px 4px; border-bottom: 1px solid var(--line-2, var(--line)); }
.cp-tab .r { text-align: right; }
.cp-th { width: 52px; height: 52px; border-radius: 10px; overflow: hidden; background: var(--surface-2); flex: none; display: grid; place-items: center; color: var(--brand); }
.cp-th img { width: 100%; height: 100%; object-fit: cover; }
.cp-sem { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.cp-sem button, .cp-sem label { height: 42px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: 14px; }
.cp-sem button i { width: 14px; height: 14px; border-radius: 50%; }
.cp-sem button[aria-pressed="true"] { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); }
.cp-sem label { position: relative; }
.cp-sem label input { position: absolute; inset: 0; opacity: 0; margin: 0; }
.cp-sem label:has(input:checked) { border-color: var(--brand); background: var(--accent-soft); }
.cp-fs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cp-f { display: grid; gap: 4px; font-size: 13px; color: var(--muted); min-width: 0; }
.cp-f input, .cp-f select, .cp-f textarea { font: inherit; font-size: 16px; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px; min-height: 44px; box-sizing: border-box; width: 100%; }
.cp-full { grid-column: 1 / -1; }
.cp-acts { display: flex; gap: 8px; justify-content: flex-end; }
.cp-acts .cp-btn { flex: 1; }
.cp-concluir { margin: 6px 14px 0; height: 52px; border-radius: 26px; font-size: 16px; }
.cp-prev { width: 100%; max-height: 40vh; object-fit: contain; border-radius: 12px; background: #000; }
.cp-rec { display: grid; justify-items: center; gap: 14px; padding: 16px 0 10px; }
.cp-rec b { font-size: 34px; font-variant-numeric: tabular-nums; }
.cp-recb { width: 76px; height: 76px; border-radius: 50%; border: 4px solid var(--bad); background: none; display: grid; place-items: center; }
.cp-recb i { width: 28px; height: 28px; border-radius: 6px; background: var(--bad); }
.cp-ajuda details { border-bottom: 1px solid var(--line); padding: 12px 2px; }
.cp-ajuda summary { font-weight: 700; font-size: 15px; }
.cp-ajuda p { color: var(--muted); line-height: 1.5; margin: 8px 0 0; }
/* Mapa: rótulos, pluviômetros e pontos */
.cp-lbl span { display: inline-block; transform: translate(-50%, -50%); color: #fff; font-size: 11px; font-weight: 700; text-shadow: 0 0 3px #000, 0 0 2px #000; white-space: nowrap; }
.cp-pluv { width: 30px !important; height: 30px !important; border-radius: 50%; background: #fff; color: var(--info); display: grid !important; place-items: center; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
.cp-pluv .ic { width: 18px; height: 18px; }
.cp-wpm span { width: 24px; height: 24px; border-radius: 50%; background: #fab219; color: #201e1e; border: 2px solid #fff; display: grid; place-items: center; font-size: 11px; font-weight: 800; box-shadow: 0 1px 4px rgba(0,0,0,.4); box-sizing: border-box; }
@media (min-width: 761px) {
  .cp-sheet { max-width: 520px; margin: 0 auto; }
  .cp-card { left: auto; width: 420px; }
}
body.campo-on .toast { bottom: calc(76px + env(safe-area-inset-bottom, 0px)); max-width: calc(100% - 40px); }

/* ---------- Levantamento da cana ---------- */
.cp-cl { font-style: normal; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.cp-cl.c0 { background: #22c55e22; color: #15803d; }
.cp-cl.c1 { background: #f59e0b26; color: #b45309; }
.cp-cl.c2 { background: #ef444426; color: #b91c1c; }
.cp-meds { list-style: none; margin: 0; padding: 0; }
.cp-meds li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0 10px 10px; border-bottom: 1px solid var(--line); border-left: 4px solid var(--line); }
.cp-meds li.c0 { border-left-color: #22c55e; } .cp-meds li.c1 { border-left-color: #f59e0b; } .cp-meds li.c2 { border-left-color: #ef4444; }
.cp-meds li > span:first-child { display: grid; gap: 2px; min-width: 0; }
.cp-meds small { color: var(--muted); font-size: 12px; }
.cp-medv { display: grid; justify-items: end; gap: 4px; }
.cp-medv b { font-size: 18px; }
.cp-semnota { margin: 8px 0 0; font-size: 13px; color: var(--muted); }
.cp-cat { padding: 0 0 16px; }
.cp-cat h4 { margin: 14px 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.cp-catl { display: grid; gap: 6px; }
.cp-catl button { display: grid; gap: 2px; text-align: left; padding: 11px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); font-size: 15px; }
.cp-catl button:active { background: var(--surface-2); }
.cp-catl small, .cp-cath small { color: var(--muted); font-size: 12px; }
.cp-outro { width: 100%; margin-top: 14px; }
.cp-cath { display: grid; gap: 2px; }
.cp-cath b { font-size: 18px; }
.cp-prot { margin: 10px 0 0; border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; background: var(--surface-2); }
.cp-prot summary { display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 14px; list-style: none; cursor: pointer; }
.cp-prot summary .ic { width: 18px; height: 18px; }
.cp-prot p { margin: 6px 0 2px; font-size: 14px; }
.cp-cnt { display: grid; grid-template-columns: 56px 1fr 56px; gap: 10px; align-items: center; }
.cp-cnt .cp-round { width: 56px; height: 56px; font-size: 28px; font-weight: 700; }
.cp-cnt input, .cp-pct input { height: 56px; font-size: 26px; font-weight: 700; text-align: center; }
.cp-pct { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
.cp-pct b { font-size: 22px; }
.cp-rng { width: 100%; margin-top: 10px; accent-color: var(--brand); }
.cp-sem2 { grid-template-columns: 1fr 1fr; }
.cp-amcl { min-height: 24px; }
.cp-amcl .cp-cl { font-size: 14px; padding: 5px 12px; }
.cp-nivtxt .cp-lnk { padding: 0; }
.cp-h3s { margin: 16px 0 6px; }
.cp-leg { position: absolute; z-index: 500; left: 12px; bottom: 12px; display: grid; gap: 2px; text-align: left; padding: 8px 10px; border: 0; border-radius: 12px; background: var(--surface); box-shadow: 0 2px 10px #0003; font-size: 12px; max-width: 60%; }
.cp-leg small { color: var(--muted); }
.cp-leg span { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.cp-leg i { width: 10px; height: 10px; border-radius: 3px; margin-left: 4px; }
.cp-leg i:first-child { margin-left: 0; }

.cp-niv-l { padding: 0 0 24px; }
.cp-niv-l ul { list-style: none; margin: 6px 0 0; padding: 0 16px; }
.cp-niv-l li { display: grid; grid-template-columns: 1fr 78px 78px; gap: 8px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.cp-niv-l li > span { display: grid; gap: 2px; min-width: 0; }
.cp-niv-l li small { color: var(--muted); font-size: 12px; }
.cp-niv-l li.cp-mud b::after { content: ' · ajustado'; color: var(--brand); font-weight: 600; font-size: 12px; }
.cp-niv-l li em { grid-column: span 2; font-size: 12px; text-align: right; }
.cp-niv-l label { display: grid; gap: 2px; }
.cp-niv-l input { width: 100%; height: 40px; text-align: center; font-size: 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--fg); }
.cp-niv-a { position: sticky; bottom: 0; padding: 12px 16px; background: var(--surface); border-top: 1px solid var(--line); }

/* ---------- Cotesia e rota do dia ---------- */
.cp-pad { padding: 16px; }
.cp-lst { display: grid; gap: 8px; padding: 12px 16px; }
.cp-cot { display: flex; justify-content: space-between; align-items: center; gap: 10px; text-align: left; padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
.cp-cot > span { display: grid; gap: 3px; min-width: 0; }
.cp-cot small { color: var(--muted); font-size: 12.5px; }
.cp-cot small b { color: var(--fg); }
.cp-rf { display: grid; grid-template-columns: 1fr; gap: 10px; padding: 12px 16px 0; }
.cp-rtg { display: flex; align-items: center; gap: 10px; font-size: 15px; }
.cp-rtg input { width: 22px; height: 22px; accent-color: var(--brand); }
.cp-rsum { display: grid; gap: 2px; padding: 14px 16px 0; }
.cp-rsum b { font-size: 18px; }
.cp-rsum span { color: var(--muted); font-size: 13px; }
.cp-racts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px 16px 4px; }
.cp-rl { list-style: none; margin: 0; padding: 8px 16px 24px; display: grid; gap: 8px; }
.cp-rl li { display: grid; grid-template-columns: 32px 1fr auto; gap: 10px; align-items: start; padding: 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }

.cp-rn { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-weight: 700; font-size: 14px; background: var(--surface-2); color: var(--fg); border: 2px solid var(--line); }

.cp-rb { display: grid; gap: 4px; }
.cp-rmk span { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: #fff; color: #1f2a1c; font-weight: 800; font-size: 13px; border: 2px solid #1f2a1c; box-shadow: 0 2px 6px #0005; }
.cp-rmk.c2 span { background: #ef4444; color: #fff; border-color: #fff; }
.cp-rmk.c1 span { background: #f59e0b; color: #fff; border-color: #fff; }
.cp-rbar { position: absolute; z-index: 550; left: 12px; right: 76px; top: calc(var(--cp-top) + 72px); display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 12px; background: var(--surface); border-radius: 14px; box-shadow: 0 2px 10px #0003; font-size: 14px; }
.cp-rbar > span { flex: 1; display: flex; align-items: center; gap: 6px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cp-rbar .ic { width: 18px; height: 18px; flex: none; }

/* Fluidez no celular: toque sem atraso, rolagem presa à tela certa e camadas próprias para o que anima */
#v-campo button, #v-campo a, #v-campo label, #v-campo summary, #v-campo [data-cp] { touch-action: manipulation; }
#v-campo .cp-tela, #v-campo .cp-sheet, #v-campo .cp-drawer, #v-campo .cp-pane { overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
#v-campo .cp-drawer, #v-campo .cp-sheet { will-change: transform; }
#v-campo .cp-hist li { content-visibility: auto; contain-intrinsic-size: auto 64px; }
#v-campo .feed > .post { content-visibility: auto; contain-intrinsic-size: auto 360px; }
#v-campo .leaflet-container { touch-action: none; }
#v-campo .cp-lbl { pointer-events: none; }
.cp-prop { display: grid; gap: 12px; }
.cp-propr { display: flex; align-items: baseline; justify-content: space-between; padding: 12px 14px; border-radius: 12px; background: var(--surface-2); }
.cp-propr span { color: var(--muted); font-weight: 600; } .cp-propr b { font-size: 28px; font-variant-numeric: tabular-nums; }
.cp-pv { display: grid; gap: 10px; padding: 14px; margin: 0 12px 10px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
.cp-pv > div:first-child { display: grid; gap: 3px; } .cp-pv small { color: var(--muted); font-size: 13px; }
.cp-pv-b { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.cp-pv-b .cp-btn { min-height: 42px; padding: 0 8px; gap: 6px; font-size: 14px; } .cp-pv-b svg { width: 18px; height: 18px; flex: none; }
.cp-btn-del { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 35%, transparent); }

/* INOVAAGRO — Financeiro (despesas e veículos). Cores das categorias: ordem fixa validada para daltonismo. */
:root { --fin-c1: #2a78d6; --fin-c2: #eb6834; --fin-c3: #1baf7a; --fin-c4: #eda100; --fin-c5: #e87ba4; --fin-c6: #6250d6; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --fin-c1: #3987e5; --fin-c2: #d95926; --fin-c3: #199e70; --fin-c4: #c98500; --fin-c5: #d55181; --fin-c6: #9085e9; } }
:root[data-theme="dark"] { --fin-c1: #3987e5; --fin-c2: #d95926; --fin-c3: #199e70; --fin-c4: #c98500; --fin-c5: #d55181; --fin-c6: #9085e9; }
.fin .fk1, .fin-modal .fk1 { --c: var(--fin-c1); } .fin .fk2, .fin-modal .fk2 { --c: var(--fin-c2); }
.fin .fk3, .fin-modal .fk3 { --c: var(--fin-c3); } .fin .fk5, .fin-modal .fk5 { --c: var(--fin-c5); } .fin .fk6, .fin-modal .fk6 { --c: var(--fin-c6); } .fin .fk4, .fin-modal .fk4 { --c: var(--fin-c4); }
.fin { position: relative; }
.fin .sw { display: inline-block; width: 9px; height: 9px; border-radius: 3px; background: var(--c, var(--muted)); flex: none; }
.fin .head-acts .btn svg { width: 15px; height: 15px; }

/* Lançamento rápido */
.fin-quick { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
.fin-quick button { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); cursor: pointer; font-weight: 500; font-size: 13.5px; color: var(--fg); text-align: left; transition: border-color .15s, transform .15s; }
.fin-quick button:hover { border-color: color-mix(in srgb, var(--c, var(--brand)) 45%, var(--line)); }
.fin-quick button:active { transform: scale(.98); }
.fin-quick button:has(.fk1) { --c: var(--fin-c1); } .fin-quick button:has(.fk2) { --c: var(--fin-c2); } .fin-quick button:has(.fk3) { --c: var(--fin-c3); } .fin-quick button:has(.fk4) { --c: var(--fin-c4); } .fin-quick button:has(.fk5) { --c: var(--fin-c5); } .fin-quick button:has(.fk6) { --c: var(--fin-c6); }
.fin-qi { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 9px; background: color-mix(in srgb, var(--c) 13%, transparent); color: var(--c); flex: none; }
.fin-qi svg { width: 18px; height: 18px; }

/* Filtros */
.fin-filtros { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.fin-filtros select, .fin-filtros input { width: auto; flex: 0 1 190px; min-width: 0; }
.fin-pend { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 12px 9px 14px; border-radius: var(--radius); background: color-mix(in srgb, var(--warn) 10%, var(--surface)); border: 1px solid color-mix(in srgb, var(--warn) 30%, var(--line)); font-size: 13px; }
.fin .tabs .ct { font-size: 11px; color: var(--muted); font-weight: 500; margin-left: 3px; }
.fin-body { display: grid; gap: 14px; }

/* Números */
.fin-tiles { grid-template-columns: repeat(auto-fit, minmax(165px, 1fr)); }
.fin-tiles .tile .val { font-size: 22px; }


/* Gráficos */
.fin-leg { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); }
.fin-leg span { display: inline-flex; align-items: center; gap: 6px; }
.fin-cols { position: relative; display: grid; grid-template-columns: repeat(12, 1fr); gap: 6px; height: 210px; padding: 6px 0 22px 58px; }
.fin-grid { position: absolute; left: 58px; right: 0; top: 6px; bottom: 22px; pointer-events: none; }
.fin-grid span { position: absolute; left: 0; right: 0; border-top: 1px solid var(--line-2); }
.fin-grid span:last-child { border-top-color: var(--line); }
.fin-grid em { position: absolute; right: calc(100% + 8px); top: -7px; font-style: normal; font-size: 11px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.fin-col { position: relative; display: flex; align-items: flex-end; justify-content: center; height: 100%; cursor: default; border-radius: 6px; }
.fin-col:hover { background: color-mix(in srgb, var(--fg) 4%, transparent); }
.fin-col .st { width: min(30px, 70%); display: flex; flex-direction: column-reverse; gap: 2px; min-height: 0; }
.fin-col .st i { display: block; background: var(--c); min-height: 2px; flex-grow: 0; flex-shrink: 0; }
.fin-col .st i:last-child { border-radius: 4px 4px 0 0; }
.fin-col .lb { position: absolute; bottom: -20px; left: 0; right: 0; text-align: center; font-size: 11px; color: var(--muted); text-transform: capitalize; }
.fin-col.sel .lb { color: var(--fg); font-weight: 600; }
.fin-cols:has(.fin-col.sel) .fin-col:not(.sel) .st { opacity: .45; }
.fin-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 14px; align-items: start; }
.fin-bars { display: grid; gap: 4px; }
.fin-bar { display: grid; grid-template-columns: minmax(90px, 36%) 1fr auto; gap: 10px; align-items: center; padding: 5px 6px; margin: 0 -6px; border-radius: 6px; font-size: 13px; }
.fin-bar.click { cursor: pointer; }
.fin-bar:hover { background: var(--row-hover); }
.fin-bar .nm { display: grid; min-width: 0; font-weight: 500; }
.fin-bar .nm, .fin-bar .nm small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fin-bar .nm small { color: var(--muted); font-weight: 400; font-size: 11.5px; }
.fin-bar .tr { display: block; height: 12px; }
.fin-bar .st { display: flex; height: 100%; gap: 2px; min-width: 3px; }
.fin-bar .st i { display: block; height: 100%; background: var(--c); flex-grow: 0; flex-shrink: 0; min-width: 2px; }
.fin-bar .st i:last-child { border-radius: 0 4px 4px 0; }
.fin-bar .v { font-size: 12.5px; font-weight: 600; min-width: 70px; text-align: right; }
.fin-tip { position: absolute; z-index: 20; pointer-events: none; min-width: 190px; padding: 9px 11px; display: grid; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow-2); font-size: 12.5px; }
.fin-tip b { font-size: 12.5px; margin-bottom: 2px; text-transform: capitalize; }
.fin-tip span { display: flex; align-items: center; gap: 7px; color: var(--muted); }
.fin-tip em { margin-left: auto; padding-left: 14px; font-style: normal; color: var(--fg); font-variant-numeric: tabular-nums; }
.fin-tip span.t { border-top: 1px solid var(--line); padding-top: 4px; margin-top: 2px; color: var(--fg); font-weight: 600; }

/* Lançamentos */
.fin-tipo { display: inline-flex; align-items: center; gap: 7px; }
.fin-tab td.ds { white-space: normal; min-width: 180px; }
.fin-tab td.ds small { display: block; color: var(--muted); font-size: 11.5px; }
.fin-tab th.ck, .fin-tab td.ck { width: 34px; padding-right: 0; }
.fin-tab tfoot td { font-weight: 500; color: var(--muted); background: var(--surface-2); border-bottom: 0; }
.fin-tab tbody tr.click { cursor: pointer; }
.fin-tab tbody tr.click:hover { background: var(--row-hover); }
.fin-tab td.cp { width: 40px; padding: 4px 8px; }
.fin-clip { position: relative; }
.fin-clip .dotp { position: absolute; top: 4px; right: 4px; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }
.placa { display: inline-block; padding: 1px 7px; border: 1.5px solid color-mix(in srgb, var(--fg) 70%, transparent); border-top-width: 4px; border-top-color: #2f5fb3; border-radius: 4px; font: 600 12px/1.4 ui-monospace, "SFMono-Regular", Menlo, monospace; letter-spacing: .04em; background: var(--surface); }
.placa.big { font-size: 15px; padding: 3px 10px; }
.fin-bulk { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 12px; border-radius: var(--radius); background: var(--accent-soft); font-size: 13px; }

/* Veículos */
.fin-vh { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; font-size: 13px; }
.fin-veics { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.fin-vc { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 14px 16px; display: grid; gap: 12px; }
.fin-vc.off { opacity: .65; }
.fin-vc header { display: flex; align-items: center; gap: 12px; }
.fin-vc header > div { display: grid; min-width: 0; flex: 1; }
.fin-vc header small { color: var(--muted); font-size: 12px; }
.fin-vc dl { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 12px; margin: 0; padding: 12px 0; border-top: 1px solid var(--line-2); border-bottom: 1px solid var(--line-2); }
.fin-vc dt { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
.fin-vc dd { margin: 2px 0 0; font-weight: 600; font-size: 15px; }
.fin-vc footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.fin-vb { display: flex; gap: 6px; }
.fin-vazio { grid-column: 1 / -1; display: grid; justify-items: center; gap: 10px; text-align: center; padding: 34px 16px; background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; color: var(--muted); }
.fin-vazio svg { width: 40px; height: 40px; color: var(--brand); }
.fin-vazio p { margin: 0; max-width: 420px; }
.fin-vazio b { color: var(--fg); }

/* Formulário */
.fin-modal { width: min(640px, 100%); }
.fin-seg { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; padding: 4px 18px 6px; }
.fin-seg button { display: grid; justify-items: center; gap: 4px; padding: 8px 4px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); cursor: pointer; font-size: 12.5px; font-weight: 500; color: var(--muted); }
.fin-seg button[aria-checked="true"] { border-color: var(--c); color: var(--fg); background: color-mix(in srgb, var(--c) 8%, var(--surface)); box-shadow: 0 0 0 1px var(--c) inset; }
.fin-seg button:has(.fk1) { --c: var(--fin-c1); } .fin-seg button:has(.fk2) { --c: var(--fin-c2); } .fin-seg button:has(.fk3) { --c: var(--fin-c3); } .fin-seg button:has(.fk4) { --c: var(--fin-c4); } .fin-seg button:has(.fk5) { --c: var(--fin-c5); } .fin-seg button:has(.fk6) { --c: var(--fin-c6); }
.fin-seg .fin-qi { width: 28px; height: 28px; }
.fin-modal .fin-valor input { font-weight: 600; font-variant-numeric: tabular-nums; }
.fin-cheio { font-size: 13px; color: var(--fg); }
.fin-calc { font-size: 12.5px; color: var(--muted); line-height: 1.6; }
.fin-calc:empty { display: none; }
.fin-calc b { color: var(--fg); }
.fin-calc .sep { margin: 0 6px; color: var(--subtle); }
.fin-calc .warn { color: var(--warn); font-weight: 600; } .fin-calc .bad { color: var(--bad); font-weight: 600; }
.fin-comp { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.fin-thumb { display: inline-flex; align-items: center; gap: 10px; padding: 6px 10px 6px 6px; border: 1px solid var(--line); border-radius: 10px; font-size: 12.5px; color: var(--fg); font-weight: 400; }
.fin-thumb img { width: 44px; height: 44px; object-fit: cover; border-radius: 6px; }
.fin-thumb > svg { width: 22px; height: 22px; margin: 0 4px; }
.fin-up { cursor: pointer; }
.fin-lock { margin: 4px 18px 0; padding: 9px 12px; border-radius: 8px; background: var(--surface-2); font-size: 13px; }
.fin-lock.bad { background: color-mix(in srgb, var(--bad) 10%, var(--surface)); }
.fin-foto { place-items: center; }
.fin-foto figure { margin: 0; display: grid; gap: 10px; justify-items: center; max-width: 100%; max-height: 100%; }
.fin-foto img { max-width: min(900px, 100%); max-height: calc(100vh - 110px); border-radius: 8px; background: #fff; }
.fin-foto figcaption { display: flex; gap: 8px; }

/* Celular */
.fin-cel { position: fixed; inset: 0; z-index: 2500; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: env(safe-area-inset-bottom, 0px); }
.fin-cel-h { position: sticky; top: 0; z-index: 5; display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; padding: calc(env(safe-area-inset-top, 0px) + 8px) 10px 8px; background: var(--surface); border-bottom: 1px solid var(--line); }
.fin-cel-h h1 { font-size: 16px; text-align: center; margin: 0; }
.fin-cel .icon-btn { width: 38px; height: 38px; }
.fin-cel .view { display: block; }
@media (max-width: 760px) {
  .fin .page-head h2 { font-size: 19px; }
  .fin .page-head .head-acts .btn.primary { display: none; }
  .fin-quick { grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .fin-quick button { padding: 12px; font-size: 14px; }
  .fin-filtros { display: grid; grid-template-columns: 1fr 1fr; }
  .fin-filtros select, .fin-filtros input { width: 100%; }
  .fin-tiles { grid-template-columns: 1fr 1fr; gap: 8px; }
  .fin-tiles .tile { padding: 11px 12px; }
  .fin-tiles .tile .val { font-size: 18px; }
  .fin-tiles .tile .lbl { font-size: 10.5px; }
  .fin-cols { gap: 3px; padding-left: 46px; height: 180px; }
  .fin-grid { left: 46px; }
  .fin-grid em { font-size: 10px; }
  .fin-col .lb { font-size: 10px; }
  .fin-2 { grid-template-columns: 1fr; }
  .fin-bar { grid-template-columns: minmax(80px, 40%) 1fr auto; }
  /* Lançamentos viram cartões */
  .fin-tab { background: none; border: 0; box-shadow: none; overflow: visible; }
  .fin-tab table, .fin-tab tbody { display: block; }
  .fin-tab thead { display: none; }
  .fin-tab tbody tr { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; padding: 11px 12px; margin-bottom: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
  .fin-tab td { border: 0; padding: 0; height: auto; white-space: normal; background: none !important; }
  .fin-tab td.ck { order: 0; width: auto; }
  .fin-tab td.tp { order: 1; flex: 1; font-weight: 600; }
  .fin-tab td.vl { order: 2; font-size: 15px; }
  .fin-tab td.ds { order: 3; flex-basis: 100%; min-width: 0; font-size: 13px; }
  .fin-tab td.dt, .fin-tab td.vc, .fin-tab td.fz, .fin-tab td.fu { order: 4; line-height: 1.6; font-size: 12px; color: var(--muted); }
  .fin-tab td.vc:has(.muted), .fin-tab td.fz:has(.muted) { display: none; }
  .fin-tab td.sx { order: 5; margin-left: auto; }
  .fin-tab td.cp { order: 6; width: auto; padding: 0; }
  .fin-tab td.cp:empty { display: none; }
  .fin-tab tbody tr:has(td.empty) { display: block; }
  .fin-tab tfoot { display: block; }
  .fin-tab tfoot tr { display: flex; justify-content: space-between; padding: 10px 12px; background: var(--surface-2); border-radius: 10px; }
  .fin-tab tfoot td { background: none; padding: 0; }
  .fin-veics { grid-template-columns: 1fr; }
  .fin-seg { padding: 4px 14px 6px; gap: 5px; }
  .fin-seg button { font-size: 11.5px; }
  .fin-cel .page { padding-top: 14px; }
  .fin-cel .page-head > div:first-child { display: none; }
  .fin-cel .page-head .head-acts { width: 100%; }
  .fin-cel .page-head .head-acts .btn { flex: 1; }
}
@media print { .fin-quick, .fin-filtros .lnk, .fin .head-acts { display: none; } }
.fin-t .lbl::before { background: var(--c) !important; }
.fin-t::after { display: none; }
.fin-modal form > * { min-width: 0; }
.fin-modal form input:not([type=checkbox]):not([type=file]), .fin-modal form select, .fin-modal form textarea { width: 100%; max-width: 100%; box-sizing: border-box; }
.fin-cheio { display: flex; flex-wrap: wrap; white-space: normal; }
@media (max-width: 760px) { .fin-modal .fin-seg button { min-width: 0; overflow: hidden; text-overflow: ellipsis; } }

/* Melhorias: orçamento, avisos, reembolsos, contas, lucro, rateio, leitura da foto */
@media (max-width: 1250px) { .fin-quick { grid-template-columns: repeat(3, 1fr); } }
.fin-quick button span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fin-seg2 { grid-template-columns: 1fr 1fr; }
.fin-p { margin: 0; font-size: 12.5px; line-height: 1.5; }
.fin-neg { color: var(--bad); } .fin-bad { color: var(--bad); font-weight: 600; }
.fin-h4 { margin: 6px 0 -4px; font-weight: 600; font-size: 13px; color: var(--fg); }
.fin-val-s { font-size: 17px !important; line-height: 1.3 !important; } .fin-val-s small { font-size: 12px; color: var(--muted); font-weight: 500; }
.fin-t.ok .lbl::before { background: var(--ok) !important; } .fin-t.bad .lbl::before { background: var(--bad) !important; }
.fin-orc-l { display: grid; gap: 8px; }
.fin-orc-i { display: grid; grid-template-columns: minmax(120px, 200px) 1fr auto 120px; gap: 12px; align-items: center; font-size: 13px; }
.fin-orc-i .nm { display: inline-flex; align-items: center; gap: 7px; font-weight: 500; }
.fin-orc-i .tr { height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; box-shadow: inset 0 0 0 1px var(--line-2); }
.fin-orc-i .tr i { display: block; height: 100%; border-radius: 99px; background: var(--ok); }
.fin-orc-i.warn .tr i { background: var(--warn); } .fin-orc-i.bad .tr i { background: var(--bad); }

<script>
/* INOVAAGRO offline: guarda uma cópia dos dados no aparelho (IndexedDB) e uma fila
   de alterações feitas sem internet, que é enviada ao Supabase quando a conexão volta. */
window.GlebaOffline = (function () {
  'use strict';
  const NOME = 'inovaagro-offline', VERSAO = 2;
  let aberto = null;
  function abrir() {
    if (!aberto) aberto = new Promise((ok, falha) => {
      const r = indexedDB.open(NOME, VERSAO);
      r.onupgradeneeded = () => { const d = r.result; for (const n of ['copia', 'fila', 'midia']) if (!d.objectStoreNames.contains(n)) d.createObjectStore(n); };
      r.onsuccess = () => ok(r.result);
      r.onerror = () => falha(r.error);
    });
    return aberto;
  }
  async function op(loja, modo, fn) {
    const d = await abrir();
    return new Promise((ok, falha) => {
      const t = d.transaction(loja, modo), s = t.objectStore(loja);
      let res; const req = fn(s);
      if (req) req.onsuccess = () => { res = req.result; };
      t.oncomplete = () => ok(res);
      t.onerror = t.onabort = () => falha(t.error);
    });
  }
  const chave = (k, id) => k + ':' + String(id);
  return {
    // Cópia completa dos dados (usada para abrir o app sem internet)
    salvarCopia: (base, email) => op('copia', 'readwrite', s => s.put({ base, email, em: new Date().toISOString() }, 'dados')),
    lerCopia: () => op('copia', 'readonly', s => s.get('dados')).catch(() => null),
    // Fila: uma entrada por registro (a última alteração vale)
    enfileirar: (k, obj) => op('fila', 'readwrite', s => s.put({ k, id: String(obj.id), obj, del: !!obj._del, em: obj.atualizado_em || new Date().toISOString() }, chave(k, obj.id))),
    fila: () => op('fila', 'readonly', s => s.getAll()).then(l => l || []).catch(() => []),
    // Só tira da fila se ninguém alterou o registro de novo enquanto ele era enviado
    tirar: async it => {
      const atual = await op('fila', 'readonly', s => s.get(chave(it.k, it.id)));
      if (atual && atual.em === it.em) await op('fila', 'readwrite', s => s.delete(chave(it.k, it.id)));
    },
    limpar: () => Promise.all(['copia', 'fila', 'midia'].map(n => op(n, 'readwrite', s => s.clear()))),
    // Fotos, vídeos, áudios e anexos feitos no campo, esperando envio ao armazenamento
    guardarMidia: (id, blob, meta) => op('midia', 'readwrite', s => s.put(Object.assign({ id, blob, em: new Date().toISOString() }, meta), id)),
    lerMidia: id => op('midia', 'readonly', s => s.get(id)).catch(() => null),
    listarMidia: () => op('midia', 'readonly', s => s.getAll()).then(l => l || []).catch(() => []),
    tirarMidia: id => op('midia', 'readwrite', s => s.delete(id)),
    // Aplica a fila em cima dos dados carregados
    aplicar(base, fila) {
      for (const it of fila) {
        const lista = base[it.k]; if (!lista) continue;
        const i = lista.findIndex(r => String(r.id) === it.id);
        if (it.del) { if (i >= 0) lista.splice(i, 1); }
        else if (i >= 0) lista[i] = it.obj; else lista.push(it.obj);
      }
    },
    erroDeRede: e => !navigator.onLine || /fetch|network|load failed|timed? ?out|conex/i.test(String((e && (e.message || e.details)) || e)),
  };
})();

// Instala o service worker (só no site publicado; precisa de https ou localhost)
if ('serviceWorker' in navigator && /^https:|^http:\/\/(localhost|127\.0\.0\.1)/.test(location.href) && document.querySelector('link[rel=manifest]')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').then(r => r.update().catch(() => {})).catch(e => console.warn('sw', e)));
  // Versão nova do app instalada: recarrega uma vez sozinho, para ninguém precisar fechar e abrir de novo.
  // Se houver um formulário aberto, deixa para a próxima abertura.
  const tinhaControle = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!tinhaControle || document.querySelector('.modal-bg, .fin-modal')) return;
    try { if (sessionStorage.getItem('inovaagro.sw.recarregou')) return; sessionStorage.setItem('inovaagro.sw.recarregou', '1'); } catch (e) { }
    location.reload();
  });
}

  function rebuild() {
    for (const k of KINDS) {
      const m = new Map();
      for (const r of S.base[k]) m.set(key(r.id), r);
      for (const [id, r] of Object.entries(S.over[k])) {
        if (r._del) m.delete(id); else m.set(id, Object.assign({}, m.get(id) || {}, r));
      }
      S.data[k] = [...m.values()];
      S.idx[k] = m;
    }
    const by = (arr, f) => { const m = new Map(); for (const r of arr) { const v = key(r[f]); if (!m.has(v)) m.set(v, []); m.get(v).push(r); } return m; };
    S.fazPorProd = by(S.data.fazendas, 'produtor_id');
    S.talPorFaz = by(S.data.talhoes, 'fazenda_id');
    S.safPorTal = by(S.data.safras, 'talhao_id');
    S.monPorTal = by(S.data.monitoramentos, 'talhao_id');
    S.ordPorFaz = by(S.data.ordens, 'fazenda_id');
    S.ordPorTal = new Map();
    for (const o of S.data.ordens) for (const id of (o.talhao_ids || [])) { const k = key(id); if (!S.ordPorTal.has(k)) S.ordPorTal.set(k, []); S.ordPorTal.get(k).push(o); }
    for (const t of S.data.talhoes) { const f = get('fazendas', t.fazenda_id); t._prod = f ? f.produtor_id : t.produtor_id; }
    S.data.produtores.sort((a, b) => (a.nome || '').localeCompare(b.nome || '', 'pt-BR'));
    S.colors = new Map(S.data.produtores.map((p, i) => [key(p.id), i < SERIES.length ? SERIES[i] : OUTROS]));
    // variedades: cor pela ordem de área (maior primeiro)
    const va = new Map();
    for (const t of S.data.talhoes) { const c = culturaAtual(t); if (c && c.variedade) va.set(c.variedade, (va.get(c.variedade) || 0) + num(t.area_ha)); }
    S.varColors = new Map([...va.entries()].sort((a, b) => b[1] - a[1]).map(([v], i) => [v, i < SERIES.length - 1 ? SERIES[i] : OUTROS]));
    updateBadges();
    document.dispatchEvent(new Event('inova:dados'));
  }
  const get = (k, id) => id == null ? null : S.idx[k]?.get(key(id)) || null;

    const s = (S.safPorTal.get(key(t.id)) || []).filter(x => !safra || x.safra === safra).sort((a, b) => (b.safra || '').localeCompare(a.safra || '') || (b.data_plantio || '').localeCompare(a.data_plantio || ''));
    return s[0] || null;
  };

  const atrasada = o => pendente(o) && o.data_prevista && o.data_prevista < today();

    const ords = (S.ordPorTal.get(key(t.id)) || []).filter(pendente);

    if (ords.length) return 'programada';
    if (!culturaAtual(t)) return 'semplantio';
    return 'emdia';

  const LS = 'gleba.alteracoes.v1';
  const Store = {
    mode: 'local', db: null,
    async init() {
      if (SB.on) { this.mode = 'supabase'; setSync(); return; }
      try {
        if (window.claude && window.claude.use) {
          const db = await Promise.race([window.claude.use('db'), new Promise(r => setTimeout(() => r(null), 8000))]);
          if (db) { this.db = db; this.mode = 'nuvem'; this.subscribe(); }
        }
      } catch (e) { this.db = null; }
      if (!this.db) {
        try { const o = JSON.parse(localStorage.getItem(LS) || 'null'); if (o) for (const k of KINDS) S.over[k] = o[k] || {}; } catch (e) { }
      }
      setSync();
    },
    subscribe() {
      for (const k of KINDS) {
        this.db.collection(k).onSnapshot(snap => {
          const m = {}; for (const d of snap.docs) m[d.id] = d.data();
          S.over[k] = m; rebuild(); refresh();
        }, err => { console.warn('db', k, err); });
      }
    },
    async save(k, obj) {
      if (!podeEditar()) { toast('Seu acesso é só de consulta.'); throw new Error('somente leitura'); }
      S.version = (S.version || 0) + 1;
      obj = Object.assign({}, obj, { atualizado_em: new Date().toISOString() });
      if (!obj.criado_por && !obj._del && !get(k, obj.id)) { obj.criado_por = SB.user ? SB.user.email : 'local'; obj.criado_em = obj.atualizado_em; }
      delete obj._prod;
      if (this.mode === 'supabase') {
        // Grava primeiro no aparelho (fila) e depois tenta enviar; sem internet fica na fila.
        await Off.enfileirar(k, obj);
        if (obj._del) S.base[k] = S.base[k].filter(r => key(r.id) !== key(obj.id));
        else { const i = S.base[k].findIndex(r => key(r.id) === key(obj.id)); if (i >= 0) S.base[k][i] = obj; else S.base[k].push(obj); }
        rebuild(); refresh(); sincronizar(true); return;
      }
      S.over[k][key(obj.id)] = obj; rebuild(); refresh();
      if (this.db) {
        try { await this.db.collection(k).doc(key(obj.id)).set(obj); }
        catch (e) { toast(e.code === 'invalid_argument' ? 'Você não tem permissão para alterar estes dados.' : 'Não foi possível salvar. Tente de novo.'); throw e; }
      } else this.persist();
    },
    async remove(k, id) { return this.save(k, { id, _del: true }); },
    persist() { try { localStorage.setItem(LS, JSON.stringify(S.over)); } catch (e) { toast('O navegador não deixou salvar os dados localmente.'); } },

  function setSync() {

  async function carregarNomes() {
    if (!SB.cli || !SB.user) return;
    let l = null;

  const ESRI = 'https://server.arcgisonline.com/ArcGIS/rest/services/';
  function initMap() {
    if (mapReady || !window.L) return;
    mapReady = true;
    map = L.map('map', { zoomControl: false, preferCanvas: true, attributionControl: true });
    L.control.zoom({ position: 'bottomright' }).addTo(map);
    L.control.scale({ position: 'bottomleft', imperial: false }).addTo(map);
    const img = L.tileLayer(ESRI + 'World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: 'Imagem: Esri, Maxar' });
    const nomes = L.tileLayer(ESRI + 'Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 });
    const ruas = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' });
    baseLayers = { sat: [img], hib: [img, nomes], ruas: [ruas] };
    let tileErrors = 0, tileOk = 0;
    img.on('tileerror', () => {
      if (!navigator.onLine) { const n = $('#mapnote'); n.textContent = 'Sem internet: a imagem de satélite aparece só nas áreas guardadas com "Salvar mapa offline". Os contornos dos talhões aparecem sempre.'; n.hidden = false; return; }
      if (++tileErrors > 3 && !tileOk) $('#mapnote').hidden = false;
    });
    img.on('tileload', () => { tileOk++; $('#mapnote').hidden = true; });
    setBase(S.base_map);
    window.addEventListener('online', () => { $('#mapnote').hidden = true; });
    layerTal = L.featureGroup().addTo(map);
    layerFaz = L.featureGroup().addTo(map);
    layerLbl = L.layerGroup().addTo(map);
    layerPts = L.layerGroup();
    layerPluv = L.layerGroup().addTo(map);
    map.on('zoomend', syncFazMarkers);
    map.on('moveend', syncLabels);
    map.on('click', () => { if (S.sel.talhao) { S.sel.talhao = null; drawSheet(); styleAll(); renderTree(); } });
    $('#color-by').value = S.colorBy;
    $('#tg-pontos').addEventListener('change', e => { if (e.target.checked) layerPts.addTo(map); else map.removeLayer(layerPts); });
  }
  function setBase(b) {
    S.base_map = b;
    for (const ls of Object.values(baseLayers)) for (const l of ls) if (map.hasLayer(l)) map.removeLayer(l);
    for (const l of baseLayers[b]) { l.addTo(map); l.bringToBack && l.bringToBack(); }
    if (b === 'hib') baseLayers.hib[1].bringToFront();
    document.querySelectorAll('[data-base]').forEach(x => x.setAttribute('aria-pressed', x.dataset.base === b));
  }
  function drawLayers() {
    layerTal.clearLayers(); layerFaz.clearLayers(); layersById.clear();
    for (const t of S.data.talhoes) {
      if (!t.geometry) continue;
      const lyr = L.geoJSON(t.geometry, { style: () => styleFor(t) });
      lyr.on('click', e => { L.DomEvent.stopPropagation(e); selectTalhao(t.id, false); });
      lyr.bindTooltip(() => `<b>${esc(nomeTal(t))}</b> · ${fmtHa(t.area_ha)} ha<br><span style="font-weight:400">${esc(grupoTal(t)[0])}</span>`, { sticky: true, className: 'lbl' });
      lyr.addTo(layerTal); layersById.set(key(t.id), lyr);
    }
    for (const f of S.data.fazendas) {
      const c = fazCenter(f); if (!c) continue;
      const ts = S.talPorFaz.get(key(f.id)) || [], g = new Map();
      for (const t of ts) { const [n, cor] = grupoTal(t); g.set(cor, (g.get(cor) || 0) + (num(t.area_ha) || 1)); }
      // fazenda ganha a cor do grupo com mais área (por situação: a pior situação presente)
      let cor = S.colors.get(key(f.produtor_id)) || OUTROS;
      if (S.colorBy === 'situacao') { for (const k of Object.keys(SIT)) if (g.has(SIT[k].c)) { cor = SIT[k].c; break; } }
      else if (S.colorBy === 'atividade') { for (const k of Object.keys(ATV)) if (g.has(ATV[k].c)) { cor = ATV[k].c; break; } }
      else if (S.colorBy !== 'produtor' && g.size) cor = [...g.entries()].sort((a, b) => b[1] - a[1])[0][0];
      L.circleMarker(c, { radius: 7, color: '#fff', weight: 2, fillColor: cor, fillOpacity: 1 })
        .bindTooltip(esc(f.nome) + ' · ' + fmtHa0(areaTal(ts)) + ' ha', { className: 'lbl' })
        .on('click', () => selectFazenda(f.id, true)).addTo(layerFaz);
    }
    syncFazMarkers(); syncLabels();
    drawPontos();
    drawLegend();
  }
  const ICO_FOTO = L => L.divIcon({ className: '', iconSize: [22, 22], iconAnchor: [11, 11], html: '<div class="pin-foto" aria-hidden="true"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.2"/></svg></div>' });
  function drawPontos() {
    if (!layerPts) return;
    layerPts.clearLayers(); layerPluv.clearLayers();
    const ico = ICO_FOTO(L);
    for (const m of S.data.monitoramentos) for (const p of m.pontos || []) {
      if (p.lat == null) continue;
      const t = get('talhoes', m.talhao_id);
      L.marker([p.lat, p.lng], { icon: ico, keyboard: false }).bindPopup(`<div class="pop"><b>${esc(fmtDate(m.data))} · ${esc(nomeTal(t))}</b>${p.foto ? `<a href="${esc(p.foto)}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(p.foto)}" alt=""></a>` : ''}${p.obs ? `<p>${esc(p.obs)}</p>` : ''}<button class="btn small" data-edit="monitoramentos:${esc(m.id)}">Abrir monitoramento</button></div>`, { maxWidth: 260 }).addTo(layerPts);
    }
    for (const pv of S.data.pluviometros) {
      if (pv.lat == null) continue;
      const ch = S.data.chuvas.filter(c => key(c.pluviometro_id) === key(pv.id)).sort((a, b) => (b.data || '').localeCompare(a.data || ''));
      L.circleMarker([pv.lat, pv.lng], { radius: 8, color: '#fff', weight: 2, fillColor: '#2a78d6', fillOpacity: 1 }).bindTooltip(`Pluviômetro ${esc(pv.nome)}${ch[0] ? ` · última chuva ${fmtDate(ch[0].data)}: ${esc(ch[0].mm)} mm` : ''}`, { className: 'lbl' }).addTo(layerPluv);
    }
    const n = layerPts.getLayers().length; const b = $('#tg-pontos'); if (b) b.closest('label').hidden = !n;
  }
  function fazCenter(f) {
    const b = boundsOf(S.talPorFaz.get(key(f.id)) || []);
    if (b) return b.getCenter();
    return f.lat != null && f.lng != null ? L.latLng(f.lat, f.lng) : null;
  }
  function boundsOf(ts) {
    let b = null;
    for (const t of ts) { const l = layersById.get(key(t.id)); if (l) { const lb = l.getBounds(); b = b ? b.extend(lb) : L.latLngBounds(lb.getSouthWest(), lb.getNorthEast()); } }
    return b;
  }
  function syncFazMarkers() { if (!map || !map._loaded) return; const show = map.getZoom() < 12; if (show && !map.hasLayer(layerFaz)) map.addLayer(layerFaz); if (!show && map.hasLayer(layerFaz)) map.removeLayer(layerFaz); }
  function syncLabels() {
    if (!map || !layerLbl || !map._loaded) return;
    layerLbl.clearLayers();
    if (map.getZoom() < 15) return;
    const vb = map.getBounds(); let n = 0;
    for (const t of S.data.talhoes) {
      const l = layersById.get(key(t.id)); if (!l) continue;
      const c = l.getBounds().getCenter(); if (!vb.contains(c)) continue;
      if (++n > 250) break;
      L.marker(c, { interactive: false, keyboard: false, icon: L.divIcon({ className: '', iconSize: null, html: `<div class="tal-lbl">${esc(t.nome)}</div>` }) }).addTo(layerLbl);
    }
  }
  function inSel(t) {
    if (S.sel.fazenda) return key(t.fazenda_id) === key(S.sel.fazenda);
    if (S.sel.produtor) return key(t._prod) === key(S.sel.produtor);
    return true;
  }
  function styleFor(t) {
    const sel = key(t.id) === key(S.sel.talhao), on = inSel(t), [gn, c] = grupoTal(t);
    if (S.ocultos.has(gn) && !sel) return { opacity: 0, fillOpacity: 0, weight: 0 };
    return { color: sel ? '#ffffff' : c, weight: sel ? 3 : 1.5, fillColor: c, fillOpacity: sel ? 0.6 : on ? 0.38 : 0.08, opacity: on ? 1 : 0.35 };
  }
  function styleAll() { for (const t of S.data.talhoes) { const l = layersById.get(key(t.id)); if (l) l.setStyle(styleFor(t)); } }
  function fitSel() {
    let ts = S.data.talhoes.filter(inSel);
    if (S.sel.talhao) ts = [get('talhoes', S.sel.talhao)].filter(Boolean);
    const b = boundsOf(ts);
    if (b) map.fitBounds(b, { padding: [30, 30], maxZoom: 17 });
  }
  function drawLegend() {
    const g = new Map();
    for (const t of S.data.talhoes) { if (!inSel(t)) continue; const [n, c] = grupoTal(t); const x = g.get(n) || { c, n: 0, a: 0 }; x.n++; x.a += num(t.area_ha); g.set(n, x); }
    let items = [...g.entries()];
    if (S.colorBy === 'atividade') items.sort((a, b) => Object.values(ATV).findIndex(s => s.l === a[0]) - Object.values(ATV).findIndex(s => s.l === b[0]));
    else if (S.colorBy === 'situacao') items.sort((a, b) => Object.values(SIT).findIndex(s => s.l === a[0]) - Object.values(SIT).findIndex(s => s.l === b[0]));
    else if (S.colorBy === 'condicao') { const ord = [...Object.keys(COND), 'Sem monitoramento']; items.sort((a, b) => ord.indexOf(a[0]) - ord.indexOf(b[0])); }
    else if (S.colorBy === 'produtor') items.sort((a, b) => a[0].localeCompare(b[0], 'pt-BR'));
    else items.sort((a, b) => (a[1].c === OUTROS) - (b[1].c === OUTROS) || b[1].a - a[1].a);
    $('#legend').innerHTML = items.map(([n, x]) => `<div class="li ${S.ocultos.has(n) ? 'off' : ''}" role="button" tabindex="0" data-leg="${esc(n)}" aria-pressed="${!S.ocultos.has(n)}" title="Clique para mostrar ou esconder · ${esc(n)}: ${fmtInt(x.n)} talhões, ${fmtHa(x.a)} ha"><i class="dot" style="background:${x.c}"></i><span class="grow">${esc(n)}</span><span class="num">${fmtHa0(x.a)} ha</span></div>`).join('') || '<span class="muted">Nenhum talhão.</span>';
  }

  function selectProdutor(id) { S.sel = { produtor: id, fazenda: null, talhao: null }; afterSel(true); }
  function selectFazenda(id, fit) { const f = get('fazendas', id); S.sel = { produtor: f ? f.produtor_id : null, fazenda: id, talhao: null }; afterSel(fit); }
  function selectTalhao(id, fit) { const t = get('talhoes', id); if (!t) return; S.sel = { produtor: t._prod, fazenda: t.fazenda_id, talhao: id }; afterSel(fit); }
  function afterSel(fit) {
    if (location.hash !== '#mapa') { location.hash = 'mapa'; setTimeout(() => { styleAll(); drawLegend(); fitSel(); }, 50); }
    styleAll(); drawLegend(); renderTree(); drawSheet(); if (fit) fitSel();
  }

  function renderKpis() {
    const area = S.data.talhoes.reduce((s, t) => s + num(t.area_ha), 0);
    $('#kpis').innerHTML = [[S.data.produtores.length, 'Produtores'], [S.data.fazendas.length, 'Fazendas'], [S.data.talhoes.length, 'Talhões'], [Math.round(area), 'Hectares']]
      .map(([n, l]) => `<div class="kpi"><b>${fmtInt(n)}</b><span>${l}</span></div>`).join('');
  }
  const CHEV = '<svg class="chev" width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M3 1l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>';
  function renderTree() {
    const q = ($('#q-mapa').value || '').trim().toLowerCase();
    const m = s => !q || String(s || '').toLowerCase().includes(q);
    let html = '';
    for (const p of S.data.produtores) {
      const fz = (S.fazPorProd.get(key(p.id)) || []).slice().sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
      const pOpen = q || key(S.sel.produtor) === key(p.id);
      let inner = '', any = m(p.nome);
      for (const f of fz) {
        const ts = (S.talPorFaz.get(key(f.id)) || []).slice().sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR', { numeric: true }));
        const fm = m(f.nome) || m(f.codigo);
        const tsShow = q && !fm && !m(p.nome) ? ts.filter(t => m(t.nome)) : ts;
        if (q && !fm && !m(p.nome) && !tsShow.length) continue;
        any = true;
        const area = ts.reduce((s, t) => s + num(t.area_ha), 0);
        const fOpen = (q && tsShow.length && !fm) || key(S.sel.fazenda) === key(f.id);
        inner += `<details class="f" ${fOpen ? 'open' : ''}><summary data-f="${esc(f.id)}" class="${key(S.sel.fazenda) === key(f.id) && !S.sel.talhao ? 'sel' : ''}">${CHEV}<span class="grow">${esc(f.nome)}</span><span class="muted num">${fmtHa(area)} ha</span></summary>`
          + tsShow.map(t => `<div class="t ${key(S.sel.talhao) === key(t.id) ? 'sel' : ''}" data-t="${esc(t.id)}"><i class="dot" style="background:${corTal(t)}"></i><span class="grow">${esc(nomeTal(t))}</span><span class="num">${fmtHa(t.area_ha)}</span></div>`).join('')
          + '</details>';
      }
      if (!any) continue;
      html += `<details class="p" ${pOpen ? 'open' : ''}><summary data-p="${esc(p.id)}" class="${key(S.sel.produtor) === key(p.id) && !S.sel.fazenda ? 'sel' : ''}">${CHEV}<i class="dot" style="background:${S.colors.get(key(p.id))}"></i><span class="grow">${esc(p.nome)}</span><span class="muted num">${fz.length}</span></summary>${inner}</details>`;
    }

  }
  function drawSheet() {

    const mon = (S.monPorTal.get(key(t.id)) || []).slice().sort((a, b) => (b.data || '').localeCompare(a.data || '')).slice(0, 6);
    const ords = (S.ordPorTal.get(key(t.id)) || []).slice().sort((a, b) => (b.data_prevista || '').localeCompare(a.data_prevista || '')).slice(0, 6);

    el.innerHTML = `<header><div class="row"><div><div class="eyebrow">${esc(f ? f.nome : '')}</div><h2>${esc(nomeTal(t))}</h2></div><button class="x" data-act="close" aria-label="Fechar">×</button></div>
        <div><span class="pill ${sit.cls}"><i class="dot" style="background:${sit.c}"></i>${esc(sit.l)}</span></div></header>
      <div class="body">
        <dl class="facts"><dt>Área</dt><dd class="num">${fmtHa(t.area_ha)} ha</dd><dt>Produtor</dt><dd>${esc(p ? p.nome : '—')}</dd>
        <dt>Cultura atual</dt><dd>${saf[0] ? esc(saf[0].cultura + (saf[0].variedade ? ' · ' + saf[0].variedade : '') + ' · ' + saf[0].safra) : '<span class="muted">Sem plantio cadastrado</span>'}</dd>

  function viewMapa(entering) {

  // ---------- Tabelas ----------
  function tablePage(id, opts) {
    const root = $('#v-' + id);

      root.dataset.ready = 1;
      root.innerHTML = `<div class="page"><div class="page-head"><div><h2>${opts.title}</h2><p>${opts.sub}</p></div><div class="head-acts">${opts.extra || ''}<button class="btn primary" data-new="${opts.kind}">+ ${NOVA[opts.kind] ? 'Nova' : 'Novo'} ${esc(NOME[opts.kind])}</button></div></div>
        ${KINDS_NOVOS.includes(opts.kind) && S.faltaTabela ? avisoBanco() : ''}
        <div class="toolbar"><input type="search" id="q-${id}" placeholder="Buscar…" aria-label="Buscar">${opts.filter ? `<select id="f-${id}" aria-label="Filtrar">${opts.filter()}</select>` : ''}<span class="count" id="c-${id}"></span></div>
        <div class="table-wrap"><table><thead><tr>${opts.cols.map(c => `<th class="${c.r ? 'r' : ''}">${c.l}</th>`).join('')}</tr></thead><tbody id="tb-${id}"></tbody></table></div></div>`;
      $('#q-' + id, root).addEventListener('input', () => fill());
      if (opts.filter) $('#f-' + id, root).addEventListener('change', () => fill());
    } else if (opts.filter) {
      const s = $('#f-' + id, root), v = s.value; s.innerHTML = opts.filter(); s.value = v;
    }
    function fill() {
      const q = $('#q-' + id, root).value.trim().toLowerCase();
      const fv = opts.filter ? $('#f-' + id, root).value : '';
      let rows = opts.rows().filter(r => (!q || opts.text(r).toLowerCase().includes(q)) && (!fv || opts.match(r, fv)));
      $('#c-' + id, root).textContent = fmtInt(rows.length) + ' ' + (rows.length === 1 ? 'registro' : 'registros');
      const lim = rows.slice(0, 500);
      $('#tb-' + id, root).innerHTML = lim.map(r => `<tr data-row="${esc(r.id)}">${opts.cols.map(c => `<td class="${c.r ? 'r' : ''}">${c.v(r)}</td>`).join('')}</tr>`).join('')
        + (rows.length > 500 ? `<tr><td colspan="${opts.cols.length}" class="muted">Mostrando 500 de ${fmtInt(rows.length)}. Use a busca para refinar.</td></tr>` : '')
        + (rows.length ? '' : `<tr><td colspan="${opts.cols.length}" class="muted">Nenhum registro.</td></tr>`);
      $('#tb-' + id, root).onclick = e => { const tr = e.target.closest('tr[data-row]'); if (tr && !e.target.closest('button')) opts.click(tr.dataset.row); };
    }
    fill();
  }
  const prodOpts = () => '<option value="">Todos os produtores</option>' + S.data.produtores.map(p => `<option value="${esc(p.id)}">${esc(p.nome)}</option>`).join('');
  const areaTal = ts => ts.reduce((s, t) => s + num(t.area_ha), 0);

  function viewProdutores() {
    tablePage('produtores', {
      kind: 'produtores', title: 'Produtores', sub: 'Clientes e proprietários das fazendas.',
      rows: () => S.data.produtores, text: r => r.nome + ' ' + (r.documento || ''),
      cols: [
        { l: 'Nome', v: r => `<i class="dot" style="background:${S.colors.get(key(r.id))};margin-right:6px"></i>${esc(r.nome)}` },

        { l: 'Fazendas', r: 1, v: r => fmtInt((S.fazPorProd.get(key(r.id)) || []).length) },
        { l: 'Talhões', r: 1, v: r => fmtInt((S.fazPorProd.get(key(r.id)) || []).reduce((s, f) => s + (S.talPorFaz.get(key(f.id)) || []).length, 0)) },
        { l: 'Área (ha)', r: 1, v: r => fmtHa((S.fazPorProd.get(key(r.id)) || []).reduce((s, f) => s + areaTal(S.talPorFaz.get(key(f.id)) || []), 0)) },
      ],
      click: id => openForm('produtores', get('produtores', id)),

  }

  // ---------- Equipe e permissões ----------
  const SQL_EQUIPE = "-- INOVAAGRO: atualização do banco (rodar no editor SQL do Supabase; pode rodar de novo sem problema)\n-- 1) equipe e permissões  2) tabelas dos módulos novos (insumos, máquinas, chuvas, silobolsas etc.)\n-- Papéis: admin (tudo + equipe), editor (cadastra e edita), leitura (só consulta).\n\nalter table membros add column if not exists nome text;\nalter table membros add column if not exists ativo boolean not null default true;\nupdate membros set papel = 'editor' where papel is null or papel not in ('admin', 'editor', 'leitura');\nalter table membros alter column papel set default 'editor';\nalter table membros drop constraint if exists membros_papel_ok;\nalter table membros add constraint membros_papel_ok check (papel in ('admin', 'editor', 'leitura'));\n-- o primeiro cadastrado vira administrador se ainda não houver nenhum\nupdate membros set papel = 'admin'\n where email = (select email from membros order by criado_em nulls last, email limit 1)\n   and not exists (select 1 from membros where papel = 'admin');\n\ncreate or replace function meu_papel() returns text language sql stable security definer set search_path = public as $$\n  select papel from membros where lower(email) = lower(auth.jwt() ->> 'email') and ativo limit 1;\n$$;\ncreate or replace function sou_membro() returns boolean language sql stable security definer set search_path = public as $$\n  select exists (select 1 from membros where lower(email) = lower(auth.jwt() ->> 'email') and ativo);\n$$;\ncreate or replace function posso_editar() returns boolean language sql stable security definer set search_path = public as $$\n  select coalesce(meu_papel() in ('admin', 'editor'), false);\n$$;\ncreate or replace function sou_admin() returns boolean language sql stable security definer set search_path = public as $$\n  select coalesce(meu_papel() = 'admin', false);\n$$;\ngrant execute on function meu_papel(), sou_membro(), posso_editar(), sou_admin() to authenticated;\n\n-- Dados: todos da equipe leem; só admin e técnico gravam.\ndo $$\ndeclare t text;\nbegin\n  foreach t in array array['produtores','fazendas','talhoes','safras','monitoramentos','ordens',\n                           'insumos','maquinas','aplicadores','depositos','silobolsas','avancos','controles','armadilhas','pluviometros','chuvas','etiquetas','config','tipos_trabalho'] loop\n    execute format('create table if not exists %I (id text primary key, dados jsonb not null, atualizado_em timestamptz not null default now(), atualizado_por uuid default auth.uid())', t);\n    execute format('alter table %I enable row level security', t);\n    execute format('grant select, insert, update, delete on %I to authenticated', t);\n    execute format('drop policy if exists membros_tudo on %I', t);\n    execute format('drop policy if exists equipe_ler on %I', t);\n    execute format('drop policy if exists equipe_incluir on %I', t);\n    execute format('drop policy if exists equipe_alterar on %I', t);\n    execute format('drop policy if exists equipe_excluir on %I', t);\n    execute format('create policy equipe_ler on %I for select to authenticated using (sou_membro())', t);\n    execute format('create policy equipe_incluir on %I for insert to authenticated with check (posso_editar())', t);\n    execute format('create policy equipe_alterar on %I for update to authenticated using (posso_editar()) with check (posso_editar())', t);\n    execute format('create policy equipe_excluir on %I for delete to authenticated using (posso_editar())', t);\n  end loop;\nend $$;\n\n-- Membros: a equipe vê a lista; só administrador inclui, altera e remove.\nalter table membros enable row level security;\ndrop policy if exists membros_ler on membros;\ndrop policy if exists membros_admin_incluir on membros;\ndrop policy if exists membros_admin_alterar on membros;\ndrop policy if exists membros_admin_excluir on membros;\ncreate policy membros_ler on membros for select to authenticated using (sou_membro());\ncreate policy membros_admin_incluir on membros for insert to authenticated with check (sou_admin());\ncreate policy membros_admin_alterar on membros for update to authenticated using (sou_admin()) with check (sou_admin());\ncreate policy membros_admin_excluir on membros for delete to authenticated using (sou_admin());\ngrant select, insert, update, delete on membros to authenticated;\n\n-- Segurança: nunca deixar o sistema sem um administrador ativo.\ncreate or replace function membros_manter_admin() returns trigger language plpgsql security definer set search_path = public as $$\nbegin\n  if not exists (select 1 from membros where papel = 'admin' and ativo) then\n    raise exception 'Precisa existir pelo menos um administrador ativo (ultimo admin)';\n  end if;\n  return null;\nend $$;\ndrop trigger if exists membros_manter_admin on membros;\ncreate constraint trigger membros_manter_admin after update or delete on membros\n  deferrable initially deferred for each row execute function membros_manter_admin();\n\n-- Permissões por fazenda: se a lista \"fazendas\" do membro estiver vazia, ele vê todas.\n-- Administrador sempre vê tudo.\nalter table membros add column if not exists fazendas text[];\ncreate or replace function minhas_fazendas() returns text[] language sql stable security definer set search_path = public as $$\n  select case when m.papel = 'admin' or m.fazendas is null or cardinality(m.fazendas) = 0 then null else m.fazendas end\n    from membros m where lower(m.email) = lower(auth.jwt() ->> 'email') and m.ativo limit 1;\n$$;\ncreate or replace function pode_ver(t text, rid text, d jsonb) returns boolean language plpgsql stable security definer set search_path = public as $$\ndeclare f text[] := minhas_fazendas();\nbegin\n  if f is null then return true; end if;\n  if t = 'fazendas' then return rid = any(f); end if;\n  if t = 'produtores' then return exists (select 1 from fazendas z where z.dados ->> 'produtor_id' = rid and z.id = any(f)); end if;\n  if d ->> 'fazenda_id' is not null then return d ->> 'fazenda_id' = any(f); end if;\n  if d ->> 'talhao_id' is not null then return exists (select 1 from talhoes x where x.id = d ->> 'talhao_id' and x.dados ->> 'fazenda_id' = any(f)); end if;\n  if t = 'chuvas' and d ->> 'pluviometro_id' is not null then\n    return exists (select 1 from pluviometros p where p.id = d ->> 'pluviometro_id' and (p.dados ->> 'fazenda_id' is null or p.dados ->> 'fazenda_id' = any(f)));\n  end if;\n  return t in ('insumos', 'maquinas', 'aplicadores', 'etiquetas', 'config', 'tipos_trabalho', 'depositos', 'pluviometros', 'chuvas', 'silobolsas', 'armadilhas');\nend $$;\ngrant execute on function minhas_fazendas(), pode_ver(text, text, jsonb) to authenticated;\ndo $$\ndeclare t text;\nbegin\n  foreach t in array array['produtores','fazendas','talhoes','safras','monitoramentos','ordens',\n                           'insumos','maquinas','aplicadores','depositos','silobolsas','avancos','controles','armadilhas','pluviometros','chuvas','etiquetas','config','tipos_trabalho'] loop\n    execute format('drop policy if exists equipe_ler on %I', t);\n    execute format('drop policy if exists equipe_incluir on %I', t);\n    execute format('drop policy if exists equipe_alterar on %I', t);\n    execute format('drop policy if exists equipe_excluir on %I', t);\n    execute format('create policy equipe_ler on %I for select to authenticated using (sou_membro() and pode_ver(%L, id, dados))', t, t);\n    execute format('create policy equipe_incluir on %I for insert to authenticated with check (posso_editar() and pode_ver(%L, id, dados))', t, t);\n    execute format('create policy equipe_alterar on %I for update to authenticated using (posso_editar() and pode_ver(%L, id, dados)) with check (posso_editar() and pode_ver(%L, id, dados))', t, t, t);\n    execute format('create policy equipe_excluir on %I for delete to authenticated using (posso_editar() and pode_ver(%L, id, dados))', t, t);\n  end loop;\nend $$;\n";

  function detalhes(kind, r) {

    if (!rows.length) return fotos;
    return fotos + `<div style="padding:12px 18px 0;display:grid;gap:8px"><div class="sec-title">Detalhes importados do SIMA</div><dl class="facts" style="font-size:13px">${rows.map(([a, b]) => `<dt>${a}</dt><dd>${b}</dd>`).join('')}</dl></div>`;

  function openForm(kind, rec, defaults, ov) {

      if (e.target.closest('[data-receita]')) { const o = Object.assign({}, rec); if (podeEditar()) o.produtos = lerProdutos(bg, rec.produtos); receitaPDF(o); return; }

  // ---------- Harvest: previsão de colheita ----------
  const CANA_CORTE = [120, 100, 90, 82, 76, 70]; // t/ha de referência por corte (1º ao 6º ou mais)
  const PROD_REF = { Soja: [3.6, 'sc', 60], Milho: [9, 'sc', 60], 'Milho safrinha': [6, 'sc', 60], Sorgo: [4.5, 'sc', 60], Feijão: [2.2, 'sc', 60], Trigo: [3.2, 'sc', 60], Algodão: [4.5, '@', 15], Café: [1.8, 'sc', 60] };
  const CICLO_DIAS = { Soja: 120, Milho: 140, 'Milho safrinha': 130, Sorgo: 120, Feijão: 90, Trigo: 120, Algodão: 180 };
  const addMeses = (d, m) => { const x = new Date(d + 'T12:00:00'); x.setMonth(x.getMonth() + m); return x.toISOString().slice(0, 10); };
  const addDias = (d, n) => { const x = new Date(d + 'T12:00:00'); x.setDate(x.getDate() + n); return x.toISOString().slice(0, 10); };
  function previsaoTal(t, safra) {
    const s = culturaAtual(t, safra); if (!s || s.data_colheita) return null;
    const area = num(s.area_ha) || num(t.area_ha), cult = s.cultura || '', plantio = s.data_plantio || s.data_plantio_programada || null;
    let data = s.colheita_prevista || null, prod = num(s.prod_estimada) || null, fonte = s.prod_estimada ? 'Informada' : '', corte = null, idade = null;
    if (plantio) idade = Math.max(0, Math.round(diasDesde(plantio) / 30.4));
    if (cult === 'Cana-de-açúcar') {
      const hist = (S.safPorTal.get(key(t.id)) || []).map(x => x.data_colheita).filter(Boolean).sort();
      if (plantio) corte = Math.max(1, Math.floor((diasDesde(plantio) - 30) / 365) + (diasDesde(plantio) >= 540 ? 0 : 1));
      if (!data) { let d = hist.length ? addMeses(hist[hist.length - 1], 12) : plantio ? addMeses(plantio, 18) : null; while (d && d < addMeses(today(), -6)) d = addMeses(d, 12); data = d; }
      if (!prod) { const m = (S.monPorTal.get(key(t.id)) || []).filter(x => num(x.produtividade_estimada) >= 20 && num(x.produtividade_estimada) <= 250).sort((a, b) => (b.data || '').localeCompare(a.data || ''))[0]; if (m) { prod = num(m.produtividade_estimada); fonte = 'Visita ' + fmtDate(m.data); } }
      if (!prod && num(s.produtividade_objetivo)) { prod = num(s.produtividade_objetivo); fonte = 'Objetivo da safra'; }
      if (!prod) { prod = CANA_CORTE[Math.min(CANA_CORTE.length, corte || 1) - 1]; fonte = 'Referência do ' + (corte || 1) + 'º corte'; }
    } else {
      if (!data && plantio && CICLO_DIAS[cult]) data = addDias(plantio, CICLO_DIAS[cult]);
      if (!prod && num(s.produtividade_objetivo)) { prod = num(s.produtividade_objetivo); fonte = 'Objetivo da safra'; }
      if (!prod && PROD_REF[cult]) { prod = PROD_REF[cult][0]; fonte = 'Referência da cultura'; }
    }
    return { t, s, plantio, area, cult, data, prod, fonte, corte, idade, producao: prod ? Math.round(prod * area * 10) / 10 : null };
  }

  // ---------- Contorno dos talhões: importar KML ou GeoJSON ----------
  function areaGeo(ring) {
    // área esférica aproximada em hectares (anel em [lng, lat])
    const R = 6378137, r = x => x * Math.PI / 180; let s = 0;
    for (let i = 0; i < ring.length - 1; i++) { const [x1, y1] = ring[i], [x2, y2] = ring[i + 1]; s += r(x2 - x1) * (2 + Math.sin(r(y1)) + Math.sin(r(y2))); }
    return Math.abs(s * R * R / 2) / 10000;
  }
  function lerContornos(txt, nomeArq) {
    const out = [];
    if (/\.(geo)?json$/i.test(nomeArq) || txt.trim().startsWith('{')) {
      const gj = JSON.parse(txt), fs = gj.type === 'FeatureCollection' ? gj.features : gj.type === 'Feature' ? [gj] : [{ geometry: gj, properties: {} }];
      for (const f of fs) { const g = f.geometry; if (!g || !/Polygon/.test(g.type)) continue; const p = f.properties || {}; out.push({ nome: String(p.name || p.nome || p.NAME || p.Name || p.talhao || ''), geometry: g }); }
    } else {
      const doc = new DOMParser().parseFromString(txt, 'application/xml');
      for (const pm of doc.getElementsByTagName('Placemark')) {
        const nome = pm.getElementsByTagName('name')[0]?.textContent?.trim() || '';
        const polys = [...pm.getElementsByTagName('Polygon')].map(pg => { const ob = pg.getElementsByTagName('outerBoundaryIs')[0] || pg; const c = ob.getElementsByTagName('coordinates')[0]; return c ? [c.textContent.trim().split(/\s+/).map(s => s.split(',').slice(0, 2).map(Number)).filter(x => x.length === 2 && x.every(isFinite))] : null; }).filter(p => p && p[0].length >= 4);
        if (!polys.length) continue;
        out.push({ nome, geometry: polys.length === 1 ? { type: 'Polygon', coordinates: polys[0] } : { type: 'MultiPolygon', coordinates: polys } });
      }
    }
    for (const c of out) { const rings = c.geometry.type === 'Polygon' ? [c.geometry.coordinates[0]] : c.geometry.coordinates.map(p => p[0]); c.area = Math.round(rings.reduce((a, r) => a + areaGeo(r), 0) * 100) / 100; }
    return out;
  }

  // ---------- Celular: localização, mapa offline e instalação ----------
  let gpsLayer = null, gpsWatch = null;
  function minhaLocalizacao() {

    if (gpsWatch != null) { navigator.geolocation.clearWatch(gpsWatch); gpsWatch = null; if (gpsLayer) map.removeLayer(gpsLayer); gpsLayer = null; toast('Localização desligada.'); return; }
    toast('Procurando sua localização…');

    gpsWatch = navigator.geolocation.watchPosition(p => {
      const ll = [p.coords.latitude, p.coords.longitude];
      if (!gpsLayer) gpsLayer = L.layerGroup([L.circle(ll, { radius: p.coords.accuracy, color: '#3b8ee8', weight: 1, fillOpacity: 0.12 }), L.circleMarker(ll, { radius: 7, color: '#fff', weight: 2, fillColor: '#3b8ee8', fillOpacity: 1 })]).addTo(map);
      else gpsLayer.eachLayer(l => { l.setLatLng(ll); if (l.setRadius && l instanceof L.Circle) l.setRadius(p.coords.accuracy); });
      if (primeira) { primeira = false; map.setView(ll, Math.max(map.getZoom(), 16)); const t = talhaoEm(ll); if (t) selectTalhao(t.id, false); }
    }, e => { toast(e.code === 1 ? 'Permita o acesso à localização nas configurações do celular.' : 'Não foi possível achar sua localização.'); gpsWatch = null; }, { enableHighAccuracy: true, maximumAge: 10000, timeout: 20000 });

  function talhaoEm(ll) {

    for (const t of S.data.talhoes) {
      const g = t.geometry; if (!g) continue;
      const polys = g.type === 'Polygon' ? [g.coordinates] : g.type === 'MultiPolygon' ? g.coordinates : [];

  // Baixa as imagens de satélite da área visível para usar sem internet (ficam no cache do app).
  async function baixarMapa() {
    if (!('caches' in window)) { toast('Este navegador não guarda mapas offline.'); return; }
    if (!navigator.onLine) { toast('Conecte na internet para baixar o mapa.'); return; }
    const b = map.getBounds(), z0 = Math.max(map.getZoom(), 10), urls = [];
    const tile = (lat, lng, z) => { const n = 2 ** z, x = Math.floor((lng + 180) / 360 * n), r = lat * Math.PI / 180; return [x, Math.floor((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * n)]; };

      const [x1, y1] = tile(b.getNorth(), b.getWest(), z), [x2, y2] = tile(b.getSouth(), b.getEast(), z);
      if ((x2 - x1 + 1) * (y2 - y1 + 1) + urls.length > 3000) break;
      for (let x = x1; x <= x2; x++) for (let y = y1; y <= y2; y++) urls.push(`https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${y}/${x}`);
    }
    const cache = await caches.open('inovaagro-mapa');
    let feitos = 0, erros = 0;
    toast('Baixando mapa: 0 de ' + urls.length);
    for (let i = 0; i < urls.length; i += 8) {
      await Promise.all(urls.slice(i, i + 8).map(async u => {
        try { if (!(await cache.match(u))) { const r = await fetch(u, { mode: 'no-cors' }); await cache.put(u, r); } } catch (e) { erros++; }
        feitos++;
      }));
      toast('Baixando mapa: ' + feitos + ' de ' + urls.length);
    }
    toast(erros ? 'Mapa baixado com ' + erros + ' falhas. Tente de novo para completar.' : 'Mapa desta área salvo para usar sem internet.');
  }

      ${itens.length > mostra.length ? `<p style="text-align:center"><button class="cp-lnk" data-cp="hist-mais">Mostrar mais (${itens.length - mostra.length})</button></p>` : ''}`;
  }

        <p class="cp-mut2">O app envia sozinho quando a internet volta.</p></section>

  const fecharMenu = () => root.classList.remove('cp-menu-on');

  // ---------- Folhas (bottom sheets) ----------
  function sheet(html, cls = '') {
    const s = $('#cp-sheet'); s.className = 'cp-sheet ' + cls; s.innerHTML = `<div class="cp-grip"></div>` + html;
    $('#cp-sheet-bg').hidden = false;
    return s;
  }
  function fecharSheet() { $('#cp-sheet-bg').hidden = true; $('#cp-sheet').innerHTML = ''; if (Rec.on) Rec.parar(true); }

  let pickTab = 'faz', pickCb = null;
  function picker(cb, titulo) {
    pickCb = cb || null; pickTab = pref.faz ? 'tal' : 'faz';
    sheet(`<header class="cp-sh-h"><h2>${esc(titulo || 'Fazenda e talhão')}</h2><button class="cp-ib" data-cp="fechar-sheet" aria-label="Fechar">${ic('fechar')}</button></header>
      <div class="cp-seg" role="tablist"><button data-cp="pick-tab" data-t="faz">Fazenda</button><button data-cp="pick-tab" data-t="tal">Talhões</button></div>
      <input type="search" class="cp-busca" id="cp-pick-q" placeholder="Buscar" aria-label="Buscar">
      <ul class="cp-plist" id="cp-plist"></ul>`, 'alto');
    $('#cp-pick-q').addEventListener('input', listaPick);
    listaPick();
  }
  function listaPick() {
    const S = I().S, q = norm($('#cp-pick-q')?.value || '');
    $$('[data-cp="pick-tab"]', root).forEach(b => b.setAttribute('aria-pressed', b.dataset.t === pickTab));
    const ul = $('#cp-plist'); if (!ul) return;
    if (pickTab === 'faz') {
      const linhas = [];
      for (const p of S.data.produtores) {
        const fs = (S.fazPorProd.get(String(p.id)) || []).filter(f => !q || norm(f.nome + ' ' + p.nome).includes(q)).sort((a, b) => (a.nome || '').localeCompare(b.nome || '', 'pt-BR'));
        if (!fs.length) continue;
        linhas.push(`<li class="cp-pgrp">${esc(p.nome)}</li>`);
        for (const f of fs) { const ts = S.talPorFaz.get(String(f.id)) || []; linhas.push(`<li><button data-cp="pick-faz" data-id="${esc(f.id)}" ${String(f.id) === String(pref.faz) ? 'aria-current="true"' : ''}><b>${esc(f.nome)}</b><small>${ts.length} talhões · ${I().fmtHa(ts.reduce((s, t) => s + (Number(t.area_ha) || 0), 0))} ha</small></button></li>`); }
      }
      ul.innerHTML = (pref.faz ? '<li><button data-cp="pick-faz" data-id=""><b>Todas as fazendas</b></button></li>' : '') + (linhas.join('') || '<li class="cp-vazio">Nenhuma fazenda encontrada.</li>');
    } else {
      let ts = pref.faz ? (S.talPorFaz.get(String(pref.faz)) || []) : S.data.talhoes;
      ts = ts.filter(t => !q || norm(t.nome + ' ' + (faz(t.fazenda_id)?.nome || '')).includes(q)).sort((a, b) => (a.nome || '').localeCompare(b.nome || '', 'pt-BR', { numeric: true })).slice(0, 300);
      ul.innerHTML = (pref.faz ? `<li class="cp-pgrp">${esc(fazAtual()?.nome || '')}</li>` : '<li class="cp-pgrp">Escolha uma fazenda para ver só os talhões dela</li>') +
        (ts.map(t => { const c = I().culturaAtual(t); return `<li><button data-cp="pick-tal" data-id="${esc(t.id)}" ${String(t.id) === String(selTal) ? 'aria-current="true"' : ''}><b>${esc(t.nome)}</b><small>${I().fmtHa(t.area_ha)} ha${c ? ' · ' + esc(c.cultura || '') + (c.variedade ? ' ' + esc(c.variedade) : '') : ''}${pref.faz ? '' : ' · ' + esc(faz(t.fazenda_id)?.nome || '')}</small></button></li>`; }).join('') || '<li class="cp-vazio">Nenhum talhão encontrado.</li>');
    }
  }
  const norm = t => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

  function camadas() {
    sheet(`<header class="cp-sh-h"><h2>Camadas</h2><button class="cp-ib" data-cp="fechar-sheet" aria-label="Fechar">${ic('fechar')}</button></header>
      <div class="cp-bases">${[['sat', 'Satélite'], ['hib', 'Satélite + nomes'], ['ruas', 'Mapa']].map(([k, l]) => `<button data-cp="base" data-b="${k}" aria-pressed="${pref.base === k}"><i class="cp-bthumb cp-b-${k}"></i>${l}</button>`).join('')}</div>
      <div class="cp-tg">${[['nomes', 'Nomes dos talhões'], ['pontos', 'Pontos das visitas'], ['pluv', 'Pluviômetros']].map(([k, l]) => `<label><span>${l}</span><input type="checkbox" role="switch" data-cp="tg" data-k="${k}" ${pref[k] ? 'checked' : ''}></label>`).join('')}</div>

        <label class="cp-f cp-full"><span>Período</span><select data-cp-calor="dias">${[30, 60, 90, 180, 365].map(d => `<option value="${d}" ${pref.calorDias === d ? 'selected' : ''}>Últimos ${d} dias</option>`).join('')}</select></label>
      </div>
      <p class="cp-mut">Cada talhão fica com a cor da visita mais recente do período. As bolinhas mostram cada amostra no ponto do GPS.</p>
      <button class="cp-btn" data-cp="baixar-mapa">${ic('download')}Salvar o mapa desta área para usar sem internet</button>`, 'alto');
  }

  // ---------- Telas (pilha) ----------
  const telas = [];
  function tela(html, opts = {}) {
    const el = document.createElement('section'); el.className = 'cp-tela ' + (opts.cls || ''); el.innerHTML = html;
    $('#cp-screens').appendChild(el); telas.push({ el, opts });
    root.classList.add('cp-tela-on');

  }
  function voltarTela() {
    const t = telas.pop(); if (!t) return;

    if (!telas.length) { root.classList.remove('cp-tela-on'); if (pane === 'inicio') { desenharCard(); setTimeout(() => map.invalidateSize(), 30); } if (pane === 'historico') historico(); }
  }
  function fecharTelas() { while (telas.length) voltarTela(); }

  function atividades(t) {
    const el = tela(`<header class="cp-bar"><button class="cp-ib" data-cp="voltar" aria-label="Voltar">${ic('voltar')}</button><h1>Atividades</h1><span></span></header>
      <div class="cp-ctx">${t ? `<b>${esc(t.nome)}</b> · ${esc(faz(t.fazenda_id)?.nome || '')}` : 'Escolha a atividade. Depois você escolhe o talhão.'}</div>
      <div class="cp-ativ">${ATIV.map(([g, l], gi) => `<details open><summary>${esc(g)}${ic('seta')}</summary><div class="cp-grid">${l.map(([n, i], ai) => `<button data-cp="ativ" data-g="${gi}" data-a="${ai}"><i>${ic(i)}</i><span>${esc(n)}</span></button>`).join('')}</div></details>`).join('')}</div>`);

  }
  function comTalhao(cb, titulo) {

    if (t) return cb(t);
    picker(tt => { fecharSheet(); cb(tt); }, titulo || 'Escolha o talhão');
  }
  const exigeEditar = () => { if (!I().podeEditar()) { I().toast('Seu acesso é só de consulta.'); return false; } return true; };
  function ordem(t, tipo) {
    I().openForm('ordens', null, { tipo, titulo: tipo + ' · ' + t.nome, status: 'Planejada', fazenda_id: t.fazenda_id, talhao_ids: [t.id], data_prevista: I().today(), responsavel: email(), criado_por: email(), criado_em: new Date().toISOString() });
  }
  function avanco(t, tipo) {
    const c = I().culturaAtual(t);
    I().openForm('avancos', null, { tipo, data: I().today(), talhao_id: t.id, safra: c ? c.safra : '', criado_por: email(), criado_em: new Date().toISOString() });
  }
  function controle(t, tipo) { I().openForm('controles', null, { tipo, data: I().today(), talhao_id: t.id, responsavel: email(), criado_por: email(), criado_em: new Date().toISOString() }); }
  function chuva(p) {
    if (!exigeEditar()) return;
    const S = I().S, pl = S.data.pluviometros || [];
    if (!p) {
      const ref = gps.pos ? L.latLng(gps.pos.lat, gps.pos.lng) : (selTal && centroTal(tal(selTal))) || (fazAtual() && centroFaz(fazAtual()));
      const cand = pl.filter(x => !pref.faz || !x.fazenda_id || String(x.fazenda_id) === String(pref.faz));
      if (ref) cand.sort((a, b) => dist(ref, a) - dist(ref, b));
      p = cand[0] || pl[0];
    }
    if (!p) {
      if (confirm('Nenhum pluviômetro cadastrado. Cadastrar um aqui, na sua localização?')) I().openForm('pluviometros', null, { fazenda_id: pref.faz || '', lat: gps.pos ? +gps.pos.lat.toFixed(6) : null, lng: gps.pos ? +gps.pos.lng.toFixed(6) : null });
      return;
    }
    I().openForm('chuvas', null, { data: I().today(), pluviometro_id: p.id, criado_por: email(), criado_em: new Date().toISOString() });
  }
  const dist = (ll, p) => p.lat == null ? 1e12 : ll.distanceTo([p.lat, p.lng]);

  // ---------- Liberação de Cotesia ----------
  function cotesiaNova(t) {
    I().openForm('controles', null, { tipo: I().COT, data: I().today(), talhao_id: t.id, area_ha: t.area_ha != null ? +(+t.area_ha).toFixed(2) : undefined, responsavel: email(), criado_por: email(), criado_em: new Date().toISOString() });
  }
  function cotesiaLista() {
    fecharSheet(); fecharMenu();
    const C = CN(), f0 = v => v == null ? '—' : I().fmtInt(Math.round(v));
    const rels = I().S.data.controles.filter(c => c.tipo === I().COT && (!pref.faz || String((tal(c.talhao_id) || {}).fazenda_id) === String(pref.faz)))
      .sort((a, b) => String(b.data || '').localeCompare(String(a.data || '')));
    tela(`<header class="cp-bar"><button class="cp-ib" data-cp="voltar" aria-label="Voltar">${ic('voltar')}</button><h1>Cotesia</h1><span></span></header>
      <div class="cp-ctx">${pref.faz ? `<b>${esc(fazAtual()?.nome || '')}</b> · ` : ''}Broca ≥ 1,5 cm (lagartas/ha) no levantamento antes e depois de cada liberação.</div>
      <div class="cp-lst">${rels.map(r => {
        const t = tal(r.talhao_id), e = C ? C.eficiencia(r, I().S.data.monitoramentos) : {}, vh = C ? C.vespasHa(r) : null;
        const cl = e.red == null ? '' : e.red > 0 ? 'c0' : e.red < 0 ? 'c2' : 'c1';
        return `<button class="cp-cot" data-cp="abrir-reg" data-k="controles" data-id="${esc(r.id)}"><span><b>${esc(t ? t.nome : 'Talhão')}</b><small>${esc(I().fmtDate(r.data))} · ${I().fmtHa(r.area_ha)} ha · ${r.copos == null ? '—' : I().fmtInt(r.copos)} copos${vh ? ' · ' + f0(vh) + ' vespas/ha' : ''}</small>
          <small>Antes: <b>${e.antes ? f0(e.antes.valor) : '—'}</b> · Depois: <b>${e.depois ? f0(e.depois.valor) : '—'}</b></small></span>
          ${e.red == null ? '<em class="cp-cl">Sem levantamento</em>' : `<em class="cp-cl ${cl}">${e.red > 0 ? 'Caiu' : e.red < 0 ? 'Subiu' : 'Igual'} ${I().fmtInt(Math.abs(Math.round(e.red)))}%</em>`}</button>`;
      }).join('') || '<p class="cp-mut cp-pad">Nenhuma liberação registrada. Use Atividade, "Liberação de Cotesia".</p>'}</div>
      ${I().podeEditar() ? `<button class="cp-btn pri cp-concluir" data-cp="cot-nova">${ic('mais')}Nova liberação</button>` : ''}`, { cls: 'cp-cotl' });
  }

  // ---------- Pluviômetros (cadastrar, editar e excluir) ----------
  function pluvLista() {
    fecharSheet(); fecharMenu();
    const S = I().S, pode = I().podeEditar();
    const pl = (S.data.pluviometros || []).filter(p => !pref.faz || !p.fazenda_id || String(p.fazenda_id) === String(pref.faz)).sort((a, b) => String(a.nome || '').localeCompare(String(b.nome || ''), 'pt-BR'));
    tela(`<header class="cp-bar"><button class="cp-ib" data-cp="voltar" aria-label="Voltar">${ic('voltar')}</button><h1>Pluviômetros</h1><span></span></header>
      <div class="cp-ctx">${pref.faz ? `<b>${esc(fazAtual()?.nome || '')}</b> · ` : ''}${pl.length} pluviômetro${pl.length === 1 ? '' : 's'}</div>
      <div class="cp-lst">${pl.map(p => {
        const ch = (S.data.chuvas || []).filter(c => String(c.pluviometro_id) === String(p.id)).sort((a, b) => String(b.data || '').localeCompare(String(a.data || '')));
        return `<div class="cp-pv"><div><b>${esc(p.nome || 'Pluviômetro')}</b><small>${esc(faz(p.fazenda_id)?.nome || 'Sem fazenda')}${p.lat == null ? ' · sem posição no mapa' : ''}</small>
          <small>${ch.length ? `${ch.length} chuva${ch.length > 1 ? 's' : ''} · última ${esc(I().fmtDate(ch[0].data))}: ${esc(String(ch[0].mm ?? '—').replace('.', ','))} mm` : 'Nenhuma chuva registrada'}</small></div>
          ${pode ? `<div class="cp-pv-b"><button class="cp-btn pri" data-cp="pv-chuva" data-id="${esc(p.id)}">${ic('pluv')}Chuva</button><button class="cp-btn" data-cp="pv-editar" data-id="${esc(p.id)}">${ic('editar')}Editar</button><button class="cp-btn cp-btn-del" data-cp="pv-excluir" data-id="${esc(p.id)}">${ic('lixo')}Excluir</button></div>` : ''}</div>`;
      }).join('') || '<p class="cp-mut cp-pad">Nenhum pluviômetro cadastrado.</p>'}</div>
      ${pode ? `<button class="cp-btn pri cp-concluir" data-cp="pv-novo">${ic('mais')}Novo pluviômetro aqui</button>` : ''}`, { cls: 'cp-pvl' });
  }
  function pluvNovo() {
    if (!exigeEditar()) return;
    I().openForm('pluviometros', null, { fazenda_id: pref.faz || '', lat: gps.pos ? +gps.pos.lat.toFixed(6) : null, lng: gps.pos ? +gps.pos.lng.toFixed(6) : null });
  }

  // ---------- Rota de visitas do dia ----------
  let rotaAtual = null;
  const diasDesde = d => Math.floor((Date.now() - new Date(String(d).slice(0, 10) + 'T12:00:00').getTime()) / 864e5);
  function rotaCalcular() {
    const S = I().S, dias = pref.rotaDias || 15, hoje = I().today();
    const ts = (pref.faz ? (S.talPorFaz.get(String(pref.faz)) || []) : S.data.talhoes).filter(t => t.geometry);
    const cand = [];
    for (const t of ts) {
      const v = ultimaVisita(t), c = centroTal(t); if (!c) continue;
      let m = null;
      if (v && v.data === hoje) continue; // já visitado hoje
      if (v && v.semaforo === 'Vermelho') m = { p: 0, txt: 'Vermelho', cl: 'c2' };
      else if (v && v.semaforo === 'Amarelo') m = { p: 1, txt: 'Amarelo', cl: 'c1' };
      else if (v && v.data && diasDesde(v.data) > dias) m = { p: 2, txt: `Sem visita há ${diasDesde(v.data)} dias`, cl: '' };
      else if (!v && pref.rotaNunca) m = { p: 3, txt: 'Nunca visitado', cl: '' };
      if (m) cand.push({ t, c, v, m });
    }
    // urgentes primeiro; dentro de cada grupo, sempre o talhão mais perto do anterior
    let pos = gps.pos ? L.latLng(gps.pos.lat, gps.pos.lng) : (fazAtual() && centroFaz(fazAtual())) || (cand[0] && cand[0].c);
    const ini = pos, out = [];
    for (const p of [0, 1, 2, 3]) {
      const g = cand.filter(x => x.m.p === p);
      while (g.length && out.length < 25) {
        let bi = 0; for (let i = 1; i < g.length; i++) if (pos.distanceTo(g[i].c) < pos.distanceTo(g[bi].c)) bi = i;
        const [x] = g.splice(bi, 1); x.km = pos.distanceTo(x.c) / 1000; out.push(x); pos = x.c;
      }
    }
    return { ini, paradas: out, total: cand.length, gps: !!gps.pos };
  }
  function rota() {
    fecharSheet(); fecharMenu(); ligarGps(false);
    const R = rotaAtual = rotaCalcular(), km = R.paradas.reduce((a, x) => a + x.km, 0);
    const el = tela(`<header class="cp-bar"><button class="cp-ib" data-cp="voltar" aria-label="Voltar">${ic('voltar')}</button><h1>Rota do dia</h1><span></span></header>
      <div class="cp-ctx">${pref.faz ? `<b>${esc(fazAtual()?.nome || '')}</b>` : '<b>Todas as fazendas</b> · escolha uma fazenda no mapa para uma rota menor'}<br>Talhões em vermelho primeiro, depois amarelo e depois os sem visita recente, sempre indo para o mais perto.</div>
      <div class="cp-rf">
        <label class="cp-f"><span>Sem visita há mais de</span><select data-cp-rota="dias">${[7, 15, 30, 60].map(d => `<option value="${d}" ${pref.rotaDias === d ? 'selected' : ''}>${d} dias</option>`).join('')}</select></label>
        <label class="cp-rtg"><input type="checkbox" data-cp-rota="nunca" ${pref.rotaNunca ? 'checked' : ''}><span>Incluir talhões nunca visitados</span></label>
      </div>

  // ---------- Pontos com mídia ----------
  async function ponto(tipo) {
    if (!exigeEditar()) return;
    if (tipo === 'nota') return pontoSheet({ tipo });
    if (tipo === 'audio' && window.MediaRecorder && navigator.mediaDevices) return Rec.abrir();
    const inp = $('#cp-file');
    inp.value = ''; inp.removeAttribute('capture');
    inp.accept = tipo === 'foto' ? 'image/*' : tipo === 'video' ? 'video/*' : tipo === 'audio' ? 'audio/*' : '';
    if (tipo === 'foto' || tipo === 'video') inp.setAttribute('capture', 'environment');
    inp.onchange = async () => {
      const f = inp.files[0]; if (!f) return;
      if (f.size > 50 * 1024 * 1024) { I().toast('Arquivo muito grande (máximo 50 MB).'); return; }
      let blob = f;
      if (tipo === 'foto') blob = await reduzirFoto(f).catch(() => f);
      pontoSheet({ tipo, blob, nome: f.name, mime: blob.type || f.type });
    };
    inp.click();
  }
  function pontoSheet(d) {
    const prev = d.blob && d.tipo === 'foto' ? `<img class="cp-prev" src="${URL.createObjectURL(d.blob)}" alt="">` : d.blob && d.tipo === 'video' ? `<video class="cp-prev" src="${URL.createObjectURL(d.blob)}" controls playsinline></video>` : d.blob && d.tipo === 'audio' ? `<audio src="${URL.createObjectURL(d.blob)}" controls></audio>` : d.blob ? `<p>${ic('anexo')} ${esc(d.nome || 'arquivo')}</p>` : '';
    sheet(`<header class="cp-sh-h"><h2>${esc(ROT[d.tipo])}</h2><button class="cp-ib" data-cp="fechar-sheet" aria-label="Fechar">${ic('fechar')}</button></header>

      <p class="cp-mut cp-full">${gps.pos ? `Local: ${gps.pos.lat.toFixed(5)}, ${gps.pos.lng.toFixed(5)} (±${Math.round(gps.pos.acc)} m)` : 'Sem GPS no momento: o ponto fica sem posição.'}</p>
      <div class="cp-full cp-acts"><button class="cp-btn pri" type="submit">Salvar ponto</button></div></form>`);
    $('#cp-ptf').addEventListener('submit', async e => {
      e.preventDefault();

      if (gps.pos) { p.lat = +gps.pos.lat.toFixed(7); p.lng = +gps.pos.lng.toFixed(7); p.precisao_m = Math.round(gps.pos.acc); }

      await vSalvar(); vRender(); fecharSheet();
      I().toast('Ponto salvo.');

/* INOVAAGRO — identidade visual tirada do logo (setas #5E8145, "Inova" #87B44B, "Agro" #B1D243, texto #201E1E).
   Layout: menu lateral fixo + barra superior com o título da tela; cada tela ocupa o restante. */
:root {
  --brand: #5e8145;        /* verde das setas */
  --brand-2: #87b44b;      /* verde "Inova" */
  --lime: #b1d243;         /* verde-limão "Agro" */
  --ink: #201e1e;          /* texto do logo */
  --bg: #f3f5ef;
  --surface: #ffffff;
  --surface-2: #edf1e6;
  --line: #d9dfd0;
  --fg: #201e1e;
  --muted: #5b6352;
  --accent: #4b6a37;       /* botões: versão mais escura do verde das setas (contraste AA com branco) */
  --accent-fg: #ffffff;
  --accent-soft: #e6efda;
  --nav-bg: #ffffff;
  --nav-fg: #3c4433;
  --nav-active: #e6efda;
  --danger: #b3261e;
  --map-ground: #26302a;
  --ok: #0ca30c; --warn: #b77b00; --bad: #d03b3b; --info: #2a78d6; --serious: #ec835a;
  --font-display: "Archivo", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", "Segoe UI", system-ui, sans-serif;
  --radius: 10px;
  --topbar-h: 58px;
  --nav-w: 236px;
  --shadow: 0 1px 2px rgba(32, 30, 30, .06), 0 4px 14px rgba(32, 30, 30, .06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121510; --surface: #1a1e17; --surface-2: #232920; --line: #333a2d;
    --fg: #ecefe6; --muted: #a4ad98; --accent: #87b44b; --accent-fg: #11160d; --accent-soft: #27341d;
    --nav-bg: #161a13; --nav-fg: #c9d0be; --nav-active: #27341d;
    --danger: #ef7c72; --map-ground: #101411;
    --ok: #3cc13c; --warn: #fab219; --bad: #e66767; --info: #3987e5; --serious: #ec835a;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121510; --surface: #1a1e17; --surface-2: #232920; --line: #333a2d;
  --fg: #ecefe6; --muted: #a4ad98; --accent: #87b44b; --accent-fg: #11160d; --accent-soft: #27341d;
  --nav-bg: #161a13; --nav-fg: #c9d0be; --nav-active: #27341d;
  --danger: #ef7c72; --map-ground: #101411;
  --ok: #3cc13c; --warn: #fab219; --bad: #e66767; --info: #3987e5; --serious: #ec835a;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  color-scheme: dark;
}
/* Logo: versão com texto escuro no tema claro, versão com texto branco no escuro */
.logo-escuro { display: none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .logo-claro { display: none; } :root:not([data-theme="light"]) .logo-escuro { display: block; } }
:root[data-theme="dark"] .logo-claro { display: none; }
:root[data-theme="dark"] .logo-escuro { display: block; }

html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 2000; background: var(--surface); }
* { box-sizing: border-box; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brand-2); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }

/* Menu lateral */
.nav { position: fixed; top: env(safe-area-inset-top, 0px); bottom: 0; left: 0; width: var(--nav-w); z-index: 1100; background: var(--nav-bg); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding-left: env(safe-area-inset-left, 0px); }
.nav-brand { height: var(--topbar-h); display: flex; align-items: center; padding: 0 18px; border-bottom: 1px solid var(--line); }
.nav-brand .logo { height: 30px; width: auto; max-width: 100%; }
.nav-links { flex: 1; overflow: auto; padding: 10px 10px; display: grid; gap: 2px; align-content: start; }
.nav-links .grp { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 14px 10px 4px; font-weight: 600; }
.nav-links a { display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: 8px; color: var(--nav-fg); text-decoration: none; font-weight: 500; position: relative; }
.nav-links a svg { width: 19px; height: 19px; flex: none; opacity: .85; }
.nav-links a:hover { background: var(--surface-2); color: var(--fg); }
.nav-links a[aria-current="page"] { background: var(--nav-active); color: var(--fg); font-weight: 600; }
.nav-links a[aria-current="page"]::before { content: ""; position: absolute; left: -10px; top: 8px; bottom: 8px; width: 4px; border-radius: 0 4px 4px 0; background: var(--brand); }
.nav-links a[aria-current="page"] svg { color: var(--brand); opacity: 1; }
.nav-links .badge { margin-left: auto; font-size: 11px; font-weight: 700; background: var(--bad); color: #fff; border-radius: 99px; padding: 1px 7px; }
.nav-foot { border-top: 1px solid var(--line); padding: 12px 14px calc(12px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; }
.nav-foot .who { display: grid; gap: 2px; min-width: 0; }
.nav-foot .who b { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-foot .who span { font-size: 12px; color: var(--muted); }
.nav-foot-btns { display: flex; gap: 6px; flex-wrap: wrap; }
.nav-scrim { display: none; }

/* Barra superior */
.topbar { position: fixed; top: env(safe-area-inset-top, 0px); left: var(--nav-w); right: 0; height: var(--topbar-h); z-index: 1000;
  display: flex; align-items: center; gap: 14px; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: 22px; padding-right: max(18px, env(safe-area-inset-right, 0px)); }
.topbar h1 { font-size: 19px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: -0.01em; }
.icon-btn { border: 0; background: none; padding: 6px; border-radius: 8px; cursor: pointer; color: var(--fg); display: inline-grid; place-items: center; }
.icon-btn:hover { background: var(--surface-2); }
.icon-btn.menu-btn { display: none; }
.sync { font-size: 12px; color: var(--muted); white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); display: inline-block; }
.sync[data-mode="nuvem"] i { background: var(--ok); }

main { position: fixed; top: calc(env(safe-area-inset-top, 0px) + var(--topbar-h)); left: var(--nav-w); right: 0; bottom: env(safe-area-inset-bottom, 0px); }
.view { position: absolute; inset: 0; overflow: auto; }

/* Botões e campos */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 7px 13px; border-radius: 8px; cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.1); }
.btn.danger { color: var(--danger); }
.btn.small { padding: 4px 10px; font-size: 13px; }
.btn.big { padding: 10px 14px; }
.btn.ghost { background: transparent; }
.btn[disabled] { opacity: .55; cursor: progress; }
.btn svg { width: 16px; height: 16px; }
input[type="search"], input[type="text"], input[type="email"], input[type="password"], input[type="number"], input[type="date"], select, textarea {
  width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
textarea { min-height: 72px; resize: vertical; }
label.field { display: grid; gap: 4px; font-size: 13px; font-weight: 500; color: var(--muted); }
label.field > span b { color: var(--danger); font-weight: 600; }

/* Papéis: quem só consulta não vê botões de cadastrar/editar */
body[data-papel="leitura"] [data-new], body[data-papel="leitura"] [data-save], body[data-papel="leitura"] [data-del],
body[data-papel="leitura"] .so-edita, body:not([data-papel="admin"]) [data-papel-min="admin"] { display: none !important; }

/* Mapa */
.map-layout { position: absolute; inset: 0; display: grid; grid-template-columns: 310px 1fr; }
.side { border-right: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; min-height: 0; }
.side-head { padding: 14px 16px; display: grid; gap: 10px; border-bottom: 1px solid var(--line); }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.kpi { display: grid; gap: 2px; }
.kpi b { font-family: var(--font-display); font-size: 17px; font-variant-numeric: tabular-nums; }
.kpi span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.tree { overflow: auto; flex: 1; min-height: 0; padding: 6px 0 16px; }
.tree details > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 7px 16px; }
.tree details > summary::-webkit-details-marker { display: none; }
.tree summary:hover, .tree .t:hover { background: var(--surface-2); }
.tree .p > summary { font-weight: 600; }
.tree .f > summary { padding-left: 34px; font-size: 13px; }
.tree .t { display: flex; justify-content: space-between; gap: 8px; padding: 5px 16px 5px 52px; cursor: pointer; font-size: 13px; color: var(--muted); }
.tree .t.sel, .tree summary.sel { background: var(--accent-soft); color: var(--fg); }
.tree .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 10px; height: 10px; border-radius: 3px; flex: none; display: inline-block; }
.chev { transition: transform .15s; color: var(--muted); flex: none; }
details[open] > summary .chev { transform: rotate(90deg); }
.map-wrap { position: relative; min-width: 0; }
#map { position: absolute; inset: 0; background: var(--map-ground); }
.leaflet-container { font-family: var(--font-body); }
.map-panel { position: absolute; left: 12px; top: 12px; z-index: 500; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 10px; display: grid; gap: 10px; width: 250px; max-height: calc(100% - 24px); overflow: auto; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { flex: 1; border: 0; background: var(--surface); padding: 6px 4px; font-size: 12px; cursor: pointer; color: var(--muted); font-weight: 500; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); font-weight: 600; }
.color-by { display: grid; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 500; }
.color-by select { padding: 6px 8px; font-size: 13px; }
.legend { font-size: 12px; display: grid; gap: 3px; }
.legend .li { display: flex; align-items: center; gap: 7px; }
.legend .li .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.legend .li .num { color: var(--muted); }
.map-tools { position: absolute; top: 12px; right: 12px; z-index: 500; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.map-tools .btn { box-shadow: var(--shadow); }
.map-note { position: absolute; left: 12px; bottom: 34px; z-index: 500; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 12px; color: var(--muted); max-width: min(360px, calc(100% - 24px)); }
.leaflet-tooltip.lbl { background: var(--surface); color: var(--fg); border: 1px solid var(--line); box-shadow: none; font-weight: 600; }
.tal-lbl { color: #fff; font-weight: 700; font-size: 11px; text-shadow: 0 0 3px #000, 0 0 2px #000; white-space: nowrap; text-align: center; pointer-events: none; transform: translate(-50%, -50%); }

/* Ficha do talhão */
.sheet { position: absolute; top: 12px; right: 12px; bottom: 12px; width: 350px; max-width: calc(100% - 24px); z-index: 900; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 8px 28px rgba(0,0,0,.22); display: flex; flex-direction: column; min-height: 0; }
.sheet header { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); display: grid; gap: 4px; }
.sheet header .row { display: flex; justify-content: space-between; align-items: start; gap: 8px; }
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.sheet .body { overflow: auto; padding: 12px 16px 16px; display: grid; gap: 16px; align-content: start; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
.sec-title { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-family: var(--font-display); font-size: 14px; font-weight: 700; }
.mini { display: grid; gap: 6px; }
.mini .it { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: grid; gap: 2px; font-size: 13px; cursor: pointer; }
.mini .it:hover { border-color: var(--brand-2); }
.mini .it .top { display: flex; justify-content: space-between; gap: 8px; }
.empty { color: var(--muted); font-size: 13px; margin: 0; }
.x { border: 0; background: none; cursor: pointer; color: var(--muted); font-size: 20px; line-height: 1; padding: 2px 6px; }

/* Páginas */
.page { padding-block: 22px 48px; padding-left: max(22px, env(safe-area-inset-left, 0px)); padding-right: max(22px, env(safe-area-inset-right, 0px)); max-width: 1280px; margin: 0 auto; display: grid; gap: 16px; align-content: start; }
.page-head { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; }
.page-head h2 { font-size: 22px; letter-spacing: -0.01em; }
.page-head p { margin: 4px 0 0; color: var(--muted); }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.toolbar input, .toolbar select { width: auto; min-width: 0; flex: 1 1 200px; }
.page-head .toolbar { flex: 0 1 520px; }
.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; background: var(--surface-2); position: sticky; top: 0; }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; }
td.wrap { white-space: normal; min-width: 200px; }
tbody tr[data-row] { cursor: pointer; }
tbody tr[data-row]:hover { background: var(--surface-2); }
tbody tr:last-child td { border-bottom: 0; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 99px; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.pill.ok { color: color-mix(in srgb, var(--ok) 75%, var(--fg)); background: color-mix(in srgb, var(--ok) 14%, transparent); }
.pill.warn { color: color-mix(in srgb, var(--warn) 75%, var(--fg)); background: color-mix(in srgb, var(--warn) 18%, transparent); }
.pill.bad { color: color-mix(in srgb, var(--bad) 80%, var(--fg)); background: color-mix(in srgb, var(--bad) 14%, transparent); }
.pill.info { color: color-mix(in srgb, var(--info) 80%, var(--fg)); background: color-mix(in srgb, var(--info) 14%, transparent); }
.count { color: var(--muted); font-size: 13px; }

/* Cartões do painel */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 4px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
.tile::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--brand-2); }
.tile.alert::after { background: var(--bad); }
.tile .lbl { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
.tile .val { font-family: var(--font-display); font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; line-height: 1.1; }
.tile .sub { font-size: 12px; color: var(--muted); }
.grid2 { columns: 3 340px; column-gap: 12px; }
.grid2 > * { break-inside: avoid; margin-bottom: 12px; }
a { color: var(--accent); }
.card-box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px 16px; display: grid; gap: 12px; min-width: 0; }
.card-box h3 { font-size: 15px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.card-box h3 small { font-family: var(--font-body); font-weight: 500; font-size: 12px; color: var(--muted); }
.bars { display: grid; gap: 9px; }
.bar { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 10px; font-size: 13px; }
.bar .track { grid-column: 1 / -1; grid-row: 2; }
.bar .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; gap: 6px; align-items: center; }
.bar .track { height: 12px; border-radius: 0 4px 4px 0; background: transparent; position: relative; }
.bar .fill { position: absolute; inset: 0 auto 0 0; border-radius: 0 4px 4px 0; background: var(--brand); min-width: 2px; }
.bar .v { font-variant-numeric: tabular-nums; color: var(--muted); text-align: right; min-width: 70px; }
.bar.click { cursor: pointer; border-radius: 6px; }
.bar.click:hover .name { text-decoration: underline; }
.list { display: grid; }
.list .row { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 9px 0; border-bottom: 1px solid var(--line); cursor: pointer; font-size: 13px; }
.list .row:last-child { border-bottom: 0; }
.list .row:hover b { text-decoration: underline; }
.list .row small { color: var(--muted); grid-column: 1; }

/* Ordens: colunas por status */
.board { display: grid; grid-template-columns: repeat(4, minmax(220px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 6px; }
.col { background: var(--surface-2); border-radius: var(--radius); padding: 10px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.col h3 { font-size: 13px; display: flex; justify-content: space-between; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: grid; gap: 4px; cursor: pointer; }
.card:hover { border-color: var(--brand-2); }
.card b { font-size: 14px; }
.card small { color: var(--muted); }
.card.late { border-left: 4px solid var(--bad); }

/* Relatórios */
.rep-controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; align-items: end; }
.rep-checks { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; }
.rep-checks label { display: flex; gap: 6px; align-items: center; }
.rep-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.report { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 26px 28px; display: grid; gap: 18px; box-shadow: var(--shadow); }
.report .rep-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; border-bottom: 3px solid var(--brand); padding-bottom: 12px; flex-wrap: wrap; }
.report .rep-head img { height: 40px; }
.report .rep-head .t { text-align: right; }
.report .rep-head .t b { font-family: var(--font-display); font-size: 18px; display: block; }
.report h3 { font-size: 16px; color: var(--accent); }
.report h4 { font-family: var(--font-display); font-size: 13px; margin: 6px 0 0; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.report table { font-size: 12px; }
.report th, .report td { padding: 6px 8px; }
.report .faz { display: grid; gap: 8px; break-inside: avoid-page; }
.report .rep-sum { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.report .rep-sum div { background: var(--surface-2); border-radius: 8px; padding: 8px 12px; display: grid; }
.report .rep-sum b { font-family: var(--font-display); font-size: 18px; font-variant-numeric: tabular-nums; }
.report .rep-sum span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }

/* Equipe */
.note { background: var(--accent-soft); border-radius: var(--radius); padding: 12px 14px; font-size: 13px; line-height: 1.5; }
.note ol { margin: 6px 0 0; padding-left: 20px; }
.note code { background: var(--surface); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
.team-add { display: grid; grid-template-columns: 2fr 2fr 1.3fr auto; gap: 10px; align-items: end; }
.roles { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.roles div { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 13px; display: grid; gap: 4px; background: var(--surface); }
td select { width: auto; padding: 4px 8px; }

/* Modal */
.modal-bg { position: fixed; inset: 0; background: rgba(10, 14, 8, .5); z-index: 3000; display: grid; place-items: center; padding: 16px; }
.modal { background: var(--surface); border-radius: 12px; width: min(620px, 100%); max-height: calc(100% - 32px); display: flex; flex-direction: column; overflow: auto; box-shadow: 0 20px 50px rgba(0,0,0,.3); }
.modal header { padding: 16px 18px 8px; display: flex; justify-content: space-between; align-items: center; border-top: 4px solid var(--brand); border-radius: 12px 12px 0 0; }
.modal header h2 { font-size: 18px; }
.modal form { padding: 8px 18px 4px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.modal form .full { grid-column: 1 / -1; }
.modal footer { padding: 14px 18px 18px; display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; }
.modal footer .right { display: flex; gap: 8px; margin-left: auto; }
body[data-papel="leitura"] .modal form { pointer-events: none; }
.checks { max-height: 180px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; display: grid; gap: 4px; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
.checks label { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--fg); font-weight: 400; }
.toast { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 8px; z-index: 4000; font-weight: 500; max-width: calc(100% - 32px); }

/* Login e carregamento */
.login-bg { position: fixed; inset: 0; z-index: 2500; background: linear-gradient(160deg, var(--accent-soft), var(--bg) 60%); display: grid; place-items: center; padding: 16px; }
.login-card { width: min(400px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 28px 26px; display: grid; gap: 12px; box-shadow: 0 16px 40px rgba(32,30,30,.12); border-top: 5px solid var(--brand); }
.login-logo { width: 100%; max-width: 280px; height: auto; margin: 0 auto 8px; }
.login-card h2 { font-size: 20px; }
.loading { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 14px; background: var(--bg); z-index: 1500; }
.loading img { width: 220px; height: auto; }

@media (max-width: 1100px) { :root { --nav-w: 208px; } .map-layout { grid-template-columns: 270px 1fr; } }
@media (max-width: 860px) {
  :root { --nav-w: 0px; }
  .nav { width: 264px; transform: translateX(-105%); transition: transform .2s; box-shadow: 0 0 40px rgba(0,0,0,.3); }
  body.nav-open .nav { transform: none; }
  body.nav-open .nav-scrim { display: block; position: fixed; inset: 0; background: rgba(10,14,8,.45); z-index: 1050; }
  .icon-btn.menu-btn { display: inline-grid; margin-left: -6px; }
  .topbar { padding-left: max(12px, env(safe-area-inset-left, 0px)); gap: 8px; }
  .sync span { display: none; }
  .map-layout { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) 36%; }
  .map-wrap { grid-row: 1; }
  .side { grid-row: 2; border-right: 0; border-top: 1px solid var(--line); }
  .map-panel { width: auto; right: auto; max-width: calc(100% - 120px); padding: 8px; gap: 6px; }
  .map-panel .legend { display: none; }
  .map-panel .color-by > span { display: none; }
  .map-tools { top: auto; bottom: 30px; right: 56px; }
  .map-note { bottom: auto; top: 140px; }
  .map-panel.open .legend { display: grid; }
  .sheet { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; max-width: none; max-height: 62%; }
  .modal form { grid-template-columns: 1fr; }
  .board { grid-template-columns: repeat(4, 78vw); }
  .team-add { grid-template-columns: 1fr; }
  .page { padding-left: 16px; padding-right: 16px; }
  .report { padding: 16px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* Impressão: só o relatório */
@media print {
  @page { size: A4 landscape; margin: 12mm; }
  body { overflow: visible; background: #fff; color: #000; }
  .nav, .topbar, .nav-scrim, .no-print, .toast, #loading { display: none !important; }
  main, .view { position: static; overflow: visible; }
  .view:not(#v-relatorios) { display: none !important; }
  .page { padding: 0; max-width: none; }
  .report { border: 0; box-shadow: none; padding: 0; }
  th { position: static; }
}

/* Módulos novos */
.prev { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
.prev .dia { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: grid; gap: 2px; font-size: 12px; }
.prev .dia b { text-transform: capitalize; font-size: 13px; }
.prev .dia .mm { font-family: var(--font-display); font-size: 18px; font-weight: 700; color: var(--info); font-variant-numeric: tabular-nums; }
.hist { display: flex; align-items: flex-end; gap: 2px; height: 90px; border-bottom: 1px solid var(--line); }
.hist span { flex: 1; background: var(--info); border-radius: 3px 3px 0 0; min-width: 3px; }
.fotos { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.fotos figure { margin: 0; display: grid; gap: 4px; font-size: 12px; }
.fotos img, .fotos .semfoto { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 8px; background: var(--surface-2); display: grid; place-items: center; color: var(--muted); }
.modal.wide { width: min(900px, 100%); }
.tg { display: flex; gap: 6px; align-items: center; font-size: 12px; }

  const fmtHa = n => n == null || n === '' ? '—' : Number(n).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  const fmtDate = d => d ? d.slice(0, 10).split('-').reverse().join('/') : '—';

  const diasDesde = d => d ? Math.floor((Date.now() - new Date(d.slice(0, 10) + 'T12:00:00').getTime()) / 864e5) : 1e9;

  const CULT_COLOR = { 'Soja': '#1baf7a', 'Milho': '#eda100', 'Milho safrinha': '#eb6834', 'Sorgo': '#e34948', 'Feijão': '#6250d6', 'Algodão': '#e87ba4', 'Cana-de-açúcar': '#b1d243', 'Café': '#8a5a2b', 'Trigo': '#d9c27a', 'Pastagem': '#008300', 'Pousio': OUTROS, 'Outra': '#2a78d6' };

        if (r._del) m.delete(id); else m.set(id, Object.assign({}, m.get(id) || {}, r));
      }
      S.data[k] = [...m.values()];
      S.idx[k] = m;

    const by = (arr, f) => { const m = new Map(); for (const r of arr) { const v = key(r[f]); if (!m.has(v)) m.set(v, []); m.get(v).push(r); } return m; };

    },
    async upsert(k, list) {

    // variedades da safra
    const vmap = new Map();
    for (const s of safT) { const k = s.variedade || ((s.cultura || 'Plantio') + ' (sem variedade)'); vmap.set(k, (vmap.get(k) || 0) + (num(s.area_ha) || num(get('talhoes', s.talhao_id)?.area_ha))); }
    const vItems = [...vmap.entries()].sort((a, b) => b[1] - a[1]).slice(0, 10).map(([n, v]) => ({ n, v, lbl: fmtHa0(v) + ' ha' }));
    // situação
    const sc = {}; for (const t of tals) { const s = situacao(t); sc[s] = sc[s] || { n: 0, a: 0 }; sc[s].n++; sc[s].a += num(t.area_ha); }
    const sItems = Object.keys(SIT).filter(k => sc[k]).map(k => ({ n: SIT[k].l, c: SIT[k].c, v: sc[k].n, lbl: fmtInt(sc[k].n) + ' · ' + fmtHa0(sc[k].a) + ' ha', go: 'cor:situacao' }));
    // condição
    const cc = {}; for (const t of tals) { const c = condicao(t) || 'Sem monitoramento'; cc[c] = (cc[c] || 0) + num(t.area_ha); }
    const cItems = [...Object.keys(COND), 'Sem monitoramento'].filter(k => cc[k]).map(k => ({ n: k, c: COND[k] || OUTROS, v: cc[k], lbl: fmtHa0(cc[k]) + ' ha', go: 'cor:condicao' }));
    // área por produtor / fazenda
    let aItems;
    if (prod) aItems = fazs.map(f => ({ n: f.nome, v: areaTal(S.talPorFaz.get(key(f.id)) || []), go: 'faz:' + f.id })).sort((a, b) => b.v - a.v).slice(0, 10);
    else aItems = S.data.produtores.map(p => ({ n: p.nome, c: S.colors.get(key(p.id)), v: (S.fazPorProd.get(key(p.id)) || []).reduce((s, f) => s + areaTal(S.talPorFaz.get(key(f.id)) || []), 0), go: 'prod:' + p.id })).sort((a, b) => b.v - a.v);
    aItems.forEach(i => i.lbl = fmtHa0(i.v) + ' ha');
    const pendList = pend.slice().sort((a, b) => (atrasada(b) - atrasada(a)) || (a.data_prevista || '9').localeCompare(b.data_prevista || '9')).slice(0, 8);
    const monList = mons.slice().sort((a, b) => (b.data || '').localeCompare(a.data || '')).slice(0, 8);
    $('#pn-grid').innerHTML = `
      <section class="card-box"><h3>Situação dos talhões <small>clique para ver no mapa</small></h3>${barras(sItems, { colorFill: 1 })}</section>
      <section class="card-box"><h3>Área por variedade <small>safra ${esc(safra || '—')}</small></h3>${barras(vItems)}</section>
      <section class="card-box"><h3>Ordens pendentes <small><a href="#ordens">ver todas</a></small></h3><div class="list">${pendList.map(o => {
        const f = get('fazendas', o.fazenda_id);
        return `<div class="row" data-edit="ordens:${esc(o.id)}"><b>${esc(o.titulo)}</b>${atrasada(o) ? '<span class="pill bad">Atrasada</span>' : `<span class="pill ${STATUS_CLS[o.status] || ''}">${esc(o.status || 'Planejada')}</span>`}<small>${esc(f?.nome || '—')} · prevista ${fmtDate(o.data_prevista)}${o.area_ha ? ' · ' + fmtHa(o.area_ha) + ' ha' : ''}</small></div>`;
      }).join('') || '<p class="empty">Nenhuma ordem pendente.</p>'}</div></section>
      <section class="card-box"><h3>Últimos monitoramentos <small><a href="#monitoramentos">ver todos</a></small></h3><div class="list">${monList.map(m => {
        const t = get('talhoes', m.talhao_id), f = t && get('fazendas', t.fazenda_id);
        return `<div class="row" data-edit="monitoramentos:${esc(m.id)}"><b>${esc(m.alvo || m.tipo || 'Monitoramento')}</b>${m.nivel ? `<span class="pill ${NIVEL_CLS[m.nivel] || ''}">${esc(m.nivel)}</span>` : '<span></span>'}<small>${fmtDate(m.data)} · ${esc(f?.nome || '')} · ${esc(nomeTal(t))}${m.estado_talhao ? ' · ' + esc(m.estado_talhao) : ''}</small></div>`;
      }).join('') || '<p class="empty">Nenhum monitoramento.</p>'}</div></section>
      <section class="card-box"><h3>${prod ? 'Área por fazenda' : 'Área por produtor'} <small>${prod ? 'maiores 10' : ''}</small></h3>${barras(aItems)}</section>
      <section class="card-box"><h3>Condição dos talhões <small>último monitoramento, em hectares</small></h3>${barras(cItems, { colorFill: 1 })}</section>`;
  }

  // ---------- Mapa ----------
  let layerPts, layerPluv;
  let map, layerTal, layerFaz, layerLbl, layersById = new Map(), mapReady = false, baseLayers = {};
  const ESRI = 'https://server.arcgisonline.com/ArcGIS/rest/services/';
  function initMap() {
    if (mapReady || !window.L) return;
    mapReady = true;
    map = L.map('map', { zoomControl: false, preferCanvas: true, attributionControl: true });
    L.control.zoom({ position: 'bottomright' }).addTo(map);
    L.control.scale({ position: 'bottomleft', imperial: false }).addTo(map);
    const img = L.tileLayer(ESRI + 'World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: 'Imagem: Esri, Maxar' });
    const nomes = L.tileLayer(ESRI + 'Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 });
    const ruas = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' });
    baseLayers = { sat: [img], hib: [img, nomes], ruas: [ruas] };
    let tileErrors = 0, tileOk = 0;
    img.on('tileerror', () => { if (++tileErrors > 3 && !tileOk) $('#mapnote').hidden = false; });
    img.on('tileload', () => { tileOk++; $('#mapnote').hidden = true; });
    setBase(S.base_map);
    layerTal = L.featureGroup().addTo(map);
    layerFaz = L.featureGroup().addTo(map);
    layerLbl = L.layerGroup().addTo(map);
    layerPts = L.layerGroup();
    layerPluv = L.layerGroup().addTo(map);
    map.on('zoomend', syncFazMarkers);
    map.on('moveend', syncLabels);
    map.on('click', () => { if (S.sel.talhao) { S.sel.talhao = null; drawSheet(); styleAll(); renderTree(); } });
    $('#color-by').value = S.colorBy;
    $('#tg-pontos').addEventListener('change', e => { if (e.target.checked) layerPts.addTo(map); else map.removeLayer(layerPts); });
  }
  function setBase(b) {
    S.base_map = b;
    for (const ls of Object.values(baseLayers)) for (const l of ls) if (map.hasLayer(l)) map.removeLayer(l);
    for (const l of baseLayers[b]) { l.addTo(map); l.bringToBack && l.bringToBack(); }
    if (b === 'hib') baseLayers.hib[1].bringToFront();
    document.querySelectorAll('[data-base]').forEach(x => x.setAttribute('aria-pressed', x.dataset.base === b));
  }
  function drawLayers() {
    layerTal.clearLayers(); layerFaz.clearLayers(); layersById.clear();
    for (const t of S.data.talhoes) {
      if (!t.geometry) continue;
      const lyr = L.geoJSON(t.geometry, { style: () => styleFor(t) });
      lyr.on('click', e => { L.DomEvent.stopPropagation(e); selectTalhao(t.id, false); });
      lyr.bindTooltip(() => `<b>${esc(nomeTal(t))}</b> · ${fmtHa(t.area_ha)} ha<br><span style="font-weight:400">${esc(grupoTal(t)[0])}</span>`, { sticky: true, className: 'lbl' });
      lyr.addTo(layerTal); layersById.set(key(t.id), lyr);
    }
    for (const f of S.data.fazendas) {
      const c = fazCenter(f); if (!c) continue;
      const ts = S.talPorFaz.get(key(f.id)) || [], g = new Map();
      for (const t of ts) { const [n, cor] = grupoTal(t); g.set(cor, (g.get(cor) || 0) + (num(t.area_ha) || 1)); }
      // fazenda ganha a cor do grupo com mais área (por situação: a pior situação presente)
      let cor = S.colors.get(key(f.produtor_id)) || OUTROS;
      if (S.colorBy === 'situacao') { for (const k of Object.keys(SIT)) if (g.has(SIT[k].c)) { cor = SIT[k].c; break; } }
      else if (S.colorBy !== 'produtor' && g.size) cor = [...g.entries()].sort((a, b) => b[1] - a[1])[0][0];
      L.circleMarker(c, { radius: 7, color: '#fff', weight: 2, fillColor: cor, fillOpacity: 1 })
        .bindTooltip(esc(f.nome) + ' · ' + fmtHa0(areaTal(ts)) + ' ha', { className: 'lbl' })
        .on('click', () => selectFazenda(f.id, true)).addTo(layerFaz);
    }
    syncFazMarkers(); syncLabels();
    drawPontos();
    drawLegend();
  }
  const ICO_FOTO = L => L.divIcon({ className: '', iconSize: [22, 22], iconAnchor: [11, 11], html: '<div class="pin-foto" aria-hidden="true"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.2"/></svg></div>' });
  function drawPontos() {
    if (!layerPts) return;
    layerPts.clearLayers(); layerPluv.clearLayers();
    const ico = ICO_FOTO(L);
    for (const m of S.data.monitoramentos) for (const p of m.pontos || []) {
      if (p.lat == null) continue;
      const t = get('talhoes', m.talhao_id);
      L.marker([p.lat, p.lng], { icon: ico, keyboard: false }).bindPopup(`<div class="pop"><b>${esc(fmtDate(m.data))} · ${esc(nomeTal(t))}</b>${p.foto ? `<a href="${esc(p.foto)}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(p.foto)}" alt=""></a>` : ''}${p.obs ? `<p>${esc(p.obs)}</p>` : ''}<button class="btn small" data-edit="monitoramentos:${esc(m.id)}">Abrir monitoramento</button></div>`, { maxWidth: 260 }).addTo(layerPts);
    }
    for (const pv of S.data.pluviometros) {
      if (pv.lat == null) continue;
      const ch = S.data.chuvas.filter(c => key(c.pluviometro_id) === key(pv.id)).sort((a, b) => (b.data || '').localeCompare(a.data || ''));
      L.circleMarker([pv.lat, pv.lng], { radius: 8, color: '#fff', weight: 2, fillColor: '#2a78d6', fillOpacity: 1 }).bindTooltip(`Pluviômetro ${esc(pv.nome)}${ch[0] ? ` · última chuva ${fmtDate(ch[0].data)}: ${esc(ch[0].mm)} mm` : ''}`, { className: 'lbl' }).addTo(layerPluv);
    }
    const n = layerPts.getLayers().length; const b = $('#tg-pontos'); if (b) b.closest('label').hidden = !n;
  }
  function fazCenter(f) {
    const b = boundsOf(S.talPorFaz.get(key(f.id)) || []);
    if (b) return b.getCenter();
    return f.lat != null && f.lng != null ? L.latLng(f.lat, f.lng) : null;
  }
  function boundsOf(ts) {
    let b = null;
    for (const t of ts) { const l = layersById.get(key(t.id)); if (l) { const lb = l.getBounds(); b = b ? b.extend(lb) : L.latLngBounds(lb.getSouthWest(), lb.getNorthEast()); } }
    return b;
  }
  function syncFazMarkers() { if (!map || !map._loaded) return; const show = map.getZoom() < 12; if (show && !map.hasLayer(layerFaz)) map.addLayer(layerFaz); if (!show && map.hasLayer(layerFaz)) map.removeLayer(layerFaz); }
  function syncLabels() {
    if (!map || !layerLbl || !map._loaded) return;
    layerLbl.clearLayers();
    if (map.getZoom() < 15) return;
    const vb = map.getBounds(); let n = 0;
    for (const t of S.data.talhoes) {
      const l = layersById.get(key(t.id)); if (!l) continue;
      const c = l.getBounds().getCenter(); if (!vb.contains(c)) continue;
      if (++n > 250) break;
      L.marker(c, { interactive: false, keyboard: false, icon: L.divIcon({ className: '', iconSize: null, html: `<div class="tal-lbl">${esc(t.nome)}</div>` }) }).addTo(layerLbl);
    }
  }
  function inSel(t) {
    if (S.sel.fazenda) return key(t.fazenda_id) === key(S.sel.fazenda);
    if (S.sel.produtor) return key(t._prod) === key(S.sel.produtor);
    return true;
  }
  function styleFor(t) {
    const sel = key(t.id) === key(S.sel.talhao), on = inSel(t), c = corTal(t);
    return { color: sel ? '#ffffff' : c, weight: sel ? 3 : 1.5, fillColor: c, fillOpacity: sel ? 0.6 : on ? 0.38 : 0.08, opacity: on ? 1 : 0.35 };
  }
  function styleAll() { for (const t of S.data.talhoes) { const l = layersById.get(key(t.id)); if (l) l.setStyle(styleFor(t)); } }
  function fitSel() {
    let ts = S.data.talhoes.filter(inSel);
    if (S.sel.talhao) ts = [get('talhoes', S.sel.talhao)].filter(Boolean);
    const b = boundsOf(ts);
    if (b) map.fitBounds(b, { padding: [30, 30], maxZoom: 17 });
  }
  function drawLegend() {
    const g = new Map();
    for (const t of S.data.talhoes) { if (!inSel(t)) continue; const [n, c] = grupoTal(t); const x = g.get(n) || { c, n: 0, a: 0 }; x.n++; x.a += num(t.area_ha); g.set(n, x); }
    let items = [...g.entries()];
    if (S.colorBy === 'situacao') items.sort((a, b) => Object.values(SIT).findIndex(s => s.l === a[0]) - Object.values(SIT).findIndex(s => s.l === b[0]));
    else if (S.colorBy === 'condicao') { const ord = [...Object.keys(COND), 'Sem monitoramento']; items.sort((a, b) => ord.indexOf(a[0]) - ord.indexOf(b[0])); }
    else if (S.colorBy === 'produtor') items.sort((a, b) => a[0].localeCompare(b[0], 'pt-BR'));
    else items.sort((a, b) => (a[1].c === OUTROS) - (b[1].c === OUTROS) || b[1].a - a[1].a);
    $('#legend').innerHTML = items.map(([n, x]) => `<div class="li" title="${esc(n)}: ${fmtInt(x.n)} talhões, ${fmtHa(x.a)} ha"><i class="dot" style="background:${x.c}"></i><span class="grow">${esc(n)}</span><span class="num">${fmtHa0(x.a)} ha</span></div>`).join('') || '<span class="muted">Nenhum talhão.</span>';
  }

  function selectProdutor(id) { S.sel = { produtor: id, fazenda: null, talhao: null }; afterSel(true); }
  function selectFazenda(id, fit) { const f = get('fazendas', id); S.sel = { produtor: f ? f.produtor_id : null, fazenda: id, talhao: null }; afterSel(fit); }
  function selectTalhao(id, fit) { const t = get('talhoes', id); if (!t) return; S.sel = { produtor: t._prod, fazenda: t.fazenda_id, talhao: id }; afterSel(fit); }
  function afterSel(fit) {
    if (location.hash !== '#mapa') { location.hash = 'mapa'; setTimeout(() => { styleAll(); drawLegend(); fitSel(); }, 50); }
    styleAll(); drawLegend(); renderTree(); drawSheet(); if (fit) fitSel();
  }

  function renderKpis() {
    const area = S.data.talhoes.reduce((s, t) => s + num(t.area_ha), 0);
    $('#kpis').innerHTML = [[S.data.produtores.length, 'Produtores'], [S.data.fazendas.length, 'Fazendas'], [S.data.talhoes.length, 'Talhões'], [Math.round(area), 'Hectares']]
      .map(([n, l]) => `<div class="kpi"><b>${fmtInt(n)}</b><span>${l}</span></div>`).join('');
  }
  const CHEV = '<svg class="chev" width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M3 1l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>';
  function renderTree() {
    const q = ($('#q-mapa').value || '').trim().toLowerCase();
    const m = s => !q || String(s || '').toLowerCase().includes(q);
    let html = '';
    for (const p of S.data.produtores) {
      const fz = (S.fazPorProd.get(key(p.id)) || []).slice().sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
      const pOpen = q || key(S.sel.produtor) === key(p.id);
      let inner = '', any = m(p.nome);
      for (const f of fz) {
        const ts = (S.talPorFaz.get(key(f.id)) || []).slice().sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR', { numeric: true }));
        const fm = m(f.nome) || m(f.codigo);
        const tsShow = q && !fm && !m(p.nome) ? ts.filter(t => m(t.nome)) : ts;
        if (q && !fm && !m(p.nome) && !tsShow.length) continue;
        any = true;
        const area = ts.reduce((s, t) => s + num(t.area_ha), 0);
        const fOpen = (q && tsShow.length && !fm) || key(S.sel.fazenda) === key(f.id);
        inner += `<details class="f" ${fOpen ? 'open' : ''}><summary data-f="${esc(f.id)}" class="${key(S.sel.fazenda) === key(f.id) && !S.sel.talhao ? 'sel' : ''}">${CHEV}<span class="grow">${esc(f.nome)}</span><span class="muted num">${fmtHa(area)} ha</span></summary>`
          + tsShow.map(t => `<div class="t ${key(S.sel.talhao) === key(t.id) ? 'sel' : ''}" data-t="${esc(t.id)}"><i class="dot" style="background:${corTal(t)}"></i><span class="grow">${esc(nomeTal(t))}</span><span class="num">${fmtHa(t.area_ha)}</span></div>`).join('')
          + '</details>';
      }
      if (!any) continue;
      html += `<details class="p" ${pOpen ? 'open' : ''}><summary data-p="${esc(p.id)}" class="${key(S.sel.produtor) === key(p.id) && !S.sel.fazenda ? 'sel' : ''}">${CHEV}<i class="dot" style="background:${S.colors.get(key(p.id))}"></i><span class="grow">${esc(p.nome)}</span><span class="muted num">${fz.length}</span></summary>${inner}</details>`;
    }
    $('#tree').innerHTML = html || '<p class="empty" style="padding:12px 16px">Nada encontrado.</p>';
  }
  function drawSheet() {
    const el = $('#sheet');
    const t = get('talhoes', S.sel.talhao);
    if (!t) { el.hidden = true; return; }
    const f = get('fazendas', t.fazenda_id), p = get('produtores', t._prod);
    const saf = (S.safPorTal.get(key(t.id)) || []).slice().sort((a, b) => (b.safra || '').localeCompare(a.safra || ''));
    const mon = (S.monPorTal.get(key(t.id)) || []).slice().sort((a, b) => (b.data || '').localeCompare(a.data || '')).slice(0, 6);
    const ords = (S.ordPorTal.get(key(t.id)) || []).slice().sort((a, b) => (b.data_prevista || '').localeCompare(a.data_prevista || '')).slice(0, 6);
    const sit = SIT[situacao(t)], cond = condicao(t);
    el.hidden = false;
    el.innerHTML = `<header><div class="row"><div><div class="eyebrow">${esc(f ? f.nome : '')}</div><h2>${esc(nomeTal(t))}</h2></div><button class="x" data-act="close" aria-label="Fechar">×</button></div>
        <div><span class="pill ${sit.cls}"><i class="dot" style="background:${sit.c}"></i>${esc(sit.l)}</span></div></header>
      <div class="body">
        <dl class="facts"><dt>Área</dt><dd class="num">${fmtHa(t.area_ha)} ha</dd><dt>Produtor</dt><dd>${esc(p ? p.nome : '—')}</dd>
        <dt>Cultura atual</dt><dd>${saf[0] ? esc(saf[0].cultura + (saf[0].variedade ? ' · ' + saf[0].variedade : '') + ' · ' + saf[0].safra) : '<span class="muted">Sem plantio cadastrado</span>'}</dd>
        <dt>Condição</dt><dd>${cond ? `<i class="dot" style="background:${COND[cond] || OUTROS}"></i> ${esc(cond)}` : '<span class="muted">Sem monitoramento</span>'}</dd>
        ${t.obs ? `<dt>Obs.</dt><dd>${esc(t.obs)}</dd>` : ''}<dt>Código SIMA</dt><dd class="num muted">${/^\d+$/.test(key(t.id)) ? esc(t.id) : '—'}</dd></dl>
        <div class="so-edita" style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn small" data-act="edit-tal">Editar talhão</button></div>
        <section class="mini"><div class="sec-title">Safras <button class="btn small so-edita" data-act="new-saf">+ Plantio</button></div>
          ${saf.length ? saf.map(s => `<div class="it" data-edit="safras:${esc(s.id)}"><div class="top"><b>${esc(s.cultura)}</b><span class="muted">${esc(s.safra)}</span></div><span class="muted">${esc(s.variedade || '')}${s.data_plantio ? ' · plantio ' + fmtDate(s.data_plantio) : ''}${s.produtividade ? ' · ' + esc(s.produtividade) : ''}</span></div>`).join('') : '<p class="empty">Nenhum plantio cadastrado.</p>'}</section>
        <section class="mini"><div class="sec-title">Monitoramentos <button class="btn small so-edita" data-act="new-mon">+ Registrar</button></div>
          ${mon.length ? mon.map(m => `<div class="it" data-edit="monitoramentos:${esc(m.id)}"><div class="top"><b>${esc(m.alvo || m.tipo)}</b><span class="muted">${fmtDate(m.data)}</span></div><span>${m.nivel ? `<span class="pill ${NIVEL_CLS[m.nivel] || ''}">${esc(m.nivel)}</span> ` : ''}<span class="muted">${esc(m.tipo || '')}${m.estadio ? ' · ' + esc(m.estadio) : ''}</span></span></div>`).join('') : '<p class="empty">Nenhum monitoramento.</p>'}</section>
        <section class="mini"><div class="sec-title">Ordens de trabalho <button class="btn small so-edita" data-act="new-ord">+ Nova</button></div>
          ${ords.length ? ords.map(o => `<div class="it" data-edit="ordens:${esc(o.id)}"><div class="top"><b>${esc(o.titulo)}</b>${atrasada(o) ? '<span class="pill bad">Atrasada</span>' : `<span class="pill ${STATUS_CLS[o.status] || ''}">${esc(o.status)}</span>`}</div><span class="muted">${esc(o.tipo || '')} · ${fmtDate(o.data_prevista)}</span></div>`).join('') : '<p class="empty">Nenhuma ordem.</p>'}</section>
      </div>`;
  }

  function viewMapa(entering) {
    initMap();
    renderKpis(); renderTree(); drawSheet();
    if (!map) return;
    if (entering || !S._drawn || S._drawnVersion !== S.version) {
      setTimeout(() => {
        map.invalidateSize();

  // ---------- Clima: chuvas registradas + previsão e histórico (Open-Meteo, sem chave) ----------
  const CL = { faz: '', cache: {} };
  function centroFaz(f) {
    let n = 0, la = 0, lo = 0;
    for (const t of S.talPorFaz.get(key(f.id)) || []) {
      const g = t.geometry; if (!g) continue;
      const ring = g.type === 'Polygon' ? g.coordinates[0] : g.type === 'MultiPolygon' ? g.coordinates[0][0] : null; if (!ring) continue;
      for (const c of ring) { lo += c[0]; la += c[1]; n++; }
    }
    if (n) return [la / n, lo / n];
    return f.lat != null && f.lng != null ? [num(f.lat), num(f.lng)] : null;
  }
  async function previsao(f) {
    const c = centroFaz(f); if (!c) return null;
    const k = c.map(x => x.toFixed(3)).join(',');
    if (CL.cache[k]) return CL.cache[k];
    const u = `https://api.open-meteo.com/v1/forecast?latitude=${c[0].toFixed(4)}&longitude=${c[1].toFixed(4)}&daily=precipitation_sum,temperature_2m_max,temperature_2m_min,wind_speed_10m_max,precipitation_probability_max&past_days=30&forecast_days=7&timezone=America%2FSao_Paulo`;
    const r = await fetch(u); if (!r.ok) throw new Error('clima ' + r.status);
    return CL.cache[k] = await r.json();
  }

      $('#cl-faz').addEventListener('change', e => { CL.faz = e.target.value; desenharPrev(); });
      $('#cl-tb').addEventListener('click', e => { const tr = e.target.closest('tr[data-row]'); if (tr) openForm('chuvas', get('chuvas', tr.dataset.row)); });
    }

    const fz = S.data.fazendas.slice().sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));

  const SQL_EQUIPE = "-- INOVAAGRO: atualização do banco (rodar no editor SQL do Supabase; pode rodar de novo sem problema)\n-- 1) equipe e permissões  2) tabelas dos módulos novos (insumos, máquinas, chuvas, silobolsas etc.)\n-- Papéis: admin (tudo + equipe), editor (cadastra e edita), leitura (só consulta).\n\nalter table membros add column if not exists nome text;\nalter table membros add column if not exists ativo boolean not null default true;\nupdate membros set papel = 'editor' where papel is null or papel not in ('admin', 'editor', 'leitura');\nalter table membros alter column papel set default 'editor';\nalter table membros drop constraint if exists membros_papel_ok;\nalter table membros add constraint membros_papel_ok check (papel in ('admin', 'editor', 'leitura'));\n-- o primeiro cadastrado vira administrador se ainda não houver nenhum\nupdate membros set papel = 'admin'\n where email = (select email from membros order by criado_em nulls last, email limit 1)\n   and not exists (select 1 from membros where papel = 'admin');\n\ncreate or replace function meu_papel() returns text language sql stable security definer set search_path = public as $$\n  select papel from membros where lower(email) = lower(auth.jwt() ->> 'email') and ativo limit 1;\n$$;\ncreate or replace function sou_membro() returns boolean language sql stable security definer set search_path = public as $$\n  select exists (select 1 from membros where lower(email) = lower(auth.jwt() ->> 'email') and ativo);\n$$;\ncreate or replace function posso_editar() returns boolean language sql stable security definer set search_path = public as $$\n  select coalesce(meu_papel() in ('admin', 'editor'), false);\n$$;\ncreate or replace function sou_admin() returns boolean language sql stable security definer set search_path = public as $$\n  select coalesce(meu_papel() = 'admin', false);\n$$;\ngrant execute on function meu_papel(), sou_membro(), posso_editar(), sou_admin() to authenticated;\n\n-- Dados: todos da equipe leem; só admin e técnico gravam.\ndo $$\ndeclare t text;\nbegin\n  foreach t in array array['produtores','fazendas','talhoes','safras','monitoramentos','ordens',\n                           'insumos','maquinas','aplicadores','depositos','silobolsas','avancos','controles','armadilhas','pluviometros','chuvas'] loop\n    execute format('create table if not exists %I (id text primary key, dados jsonb not null, atualizado_em timestamptz not null default now(), atualizado_por uuid default auth.uid())', t);\n    execute format('alter table %I enable row level security', t);\n    execute format('grant select, insert, update, delete on %I to authenticated', t);\n    execute format('drop policy if exists membros_tudo on %I', t);\n    execute format('drop policy if exists equipe_ler on %I', t);\n    execute format('drop policy if exists equipe_incluir on %I', t);\n    execute format('drop policy if exists equipe_alterar on %I', t);\n    execute format('drop policy if exists equipe_excluir on %I', t);\n    execute format('create policy equipe_ler on %I for select to authenticated using (sou_membro())', t);\n    execute format('create policy equipe_incluir on %I for insert to authenticated with check (posso_editar())', t);\n    execute format('create policy equipe_alterar on %I for update to authenticated using (posso_editar()) with check (posso_editar())', t);\n    execute format('create policy equipe_excluir on %I for delete to authenticated using (posso_editar())', t);\n  end loop;\nend $$;\n\n-- Membros: a equipe vê a lista; só administrador inclui, altera e remove.\nalter table membros enable row level security;\ndrop policy if exists membros_ler on membros;\ndrop policy if exists membros_admin_incluir on membros;\ndrop policy if exists membros_admin_alterar on membros;\ndrop policy if exists membros_admin_excluir on membros;\ncreate policy membros_ler on membros for select to authenticated using (sou_membro());\ncreate policy membros_admin_incluir on membros for insert to authenticated with check (sou_admin());\ncreate policy membros_admin_alterar on membros for update to authenticated using (sou_admin()) with check (sou_admin());\ncreate policy membros_admin_excluir on membros for delete to authenticated using (sou_admin());\ngrant select, insert, update, delete on membros to authenticated;\n\n-- Segurança: nunca deixar o sistema sem um administrador ativo.\ncreate or replace function membros_manter_admin() returns trigger language plpgsql security definer set search_path = public as $$\nbegin\n  if not exists (select 1 from membros where papel = 'admin' and ativo) then\n    raise exception 'Precisa existir pelo menos um administrador ativo (ultimo admin)';\n  end if;\n  return null;\nend $$;\ndrop trigger if exists membros_manter_admin on membros;\ncreate constraint trigger membros_manter_admin after update or delete on membros\n  deferrable initially deferred for each row execute function membros_manter_admin();\n";
  const E = { lista: null, erro: null, carregando: false };
  async function carregarEquipe() {
    E.carregando = true;
    try { E.lista = await SB.membros(); E.erro = null; } catch (e) { E.erro = e; E.lista = null; }
    E.carregando = false; if (current === 'equipe') viewEquipe();
  }

          <button class="btn primary" type="submit">Adicionar</button></form>
        <p class="muted" style="margin:0;font-size:13px">Depois de adicionar, envie o endereço do sistema para a pessoa. No primeiro acesso ela digita este e-mail, escolhe uma senha e clica em <b>Primeiro acesso: criar minha senha</b>.</p></section>
      <div class="table-wrap"><table><thead><tr><th>E-mail</th><th>Nome</th><th>Permissão</th><th>Acesso</th><th></th></tr></thead><tbody>
        ${E.lista.map(m => { const self = m.email.toLowerCase() === eu; return `<tr data-email="${esc(m.email)}"><td>${esc(m.email)}${self ? ' <span class="pill info">você</span>' : ''}</td><td>${esc(m.nome || '—')}</td>
          <td><select data-m="papel" ${self ? 'disabled title="Você não pode mudar a própria permissão"' : ''}>${Object.entries(PAPEIS).map(([k, p]) => `<option value="${k}" ${m.papel === k ? 'selected' : ''}>${p.l}</option>`).join('')}${PAPEIS[m.papel] ? '' : `<option selected>${esc(m.papel)}</option>`}</select></td>
          <td>${m.ativo === false ? '<span class="pill">Bloqueado</span>' : '<span class="pill ok">Ativo</span>'}</td>
          <td>${self ? '' : `<button class="btn small" data-m="ativo">${m.ativo === false ? 'Liberar' : 'Bloquear'}</button> <button class="btn small danger" data-m="del">Remover</button>`}</td></tr>`; }).join('')}
      </tbody></table></div></div>`;
    $('#team-add').addEventListener('submit', async e => {
      e.preventDefault(); const fd = new FormData(e.target);
      const email = String(fd.get('email') || '').trim().toLowerCase();
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { toast('Digite um e-mail válido.'); return; }
      if (E.lista.some(m => m.email.toLowerCase() === email)) { toast('Este e-mail já está na equipe.'); return; }
      try { await SB.addMembro({ email, nome: String(fd.get('nome') || '').trim() || null, papel: fd.get('papel') }); toast('Pessoa adicionada.'); carregarEquipe(); }
      catch (err) { toast('Não foi possível adicionar: ' + (err.message || err)); }

  }
  async function acaoEquipe(e) {
    const tr = e.target.closest('tr[data-email]'); if (!tr) return;
    const email = tr.dataset.email, m = E.lista.find(x => x.email === email), el = e.target.closest('[data-m]'); if (!el || !m) return;

      else if (el.dataset.m === 'ativo' && e.type === 'click') { await SB.updMembro(email, { ativo: m.ativo === false }); toast(m.ativo === false ? 'Acesso liberado.' : 'Acesso bloqueado.'); }
      else if (el.dataset.m === 'del' && e.type === 'click') { if (!el.dataset.sure) { el.dataset.sure = 1; el.textContent = 'Confirmar'; return; } await SB.delMembro(email); toast('Removido da equipe.'); }

  // ---------- Formulários ----------
  function fazOptions(sel) {
    return '<option value="">Selecione…</option>' + S.data.produtores.map(p => `<optgroup label="${esc(p.nome)}">${(S.fazPorProd.get(key(p.id)) || []).slice().sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR')).map(f => `<option value="${esc(f.id)}" ${key(f.id) === key(sel) ? 'selected' : ''}>${esc(f.nome)}</option>`).join('')}</optgroup>`).join('');
  }
  function talOptions(sel) {
    return '<option value="">Selecione…</option>' + S.data.fazendas.slice().sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR')).map(f => {
      const ts = (S.talPorFaz.get(key(f.id)) || []).slice().sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR', { numeric: true }));
      return ts.length ? `<optgroup label="${esc(f.nome)}">${ts.map(t => `<option value="${esc(t.id)}" ${key(t.id) === key(sel) ? 'selected' : ''}>${esc(nomeTal(t))} · ${fmtHa(t.area_ha)} ha</option>`).join('')}</optgroup>` : '';
    }).join('');
  }
  function talChecks(fazId, sel) {
    const ts = (S.talPorFaz.get(key(fazId)) || []).slice().sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR', { numeric: true }));
    const set = new Set((sel || []).map(key));
    for (const id of set) { const t = get('talhoes', id); if (t && key(t.fazenda_id) !== key(fazId)) ts.push(Object.assign({}, t, { nome: nomeTal(t) + ' (' + (get('fazendas', t.fazenda_id)?.nome || '') + ')' })); }
    return ts.length ? ts.map(t => `<label><input type="checkbox" name="talhao_ids" value="${esc(t.id)}" ${set.has(key(t.id)) ? 'checked' : ''}>${esc(nomeTal(t))}</label>`).join('') : '<span class="muted">Escolha a fazenda primeiro.</span>';
  }
  function fieldHtml(f, v) {
    const id = 'fld-' + f.k, req = f.req ? ' required' : '', ph = f.ph ? ` placeholder="${esc(f.ph)}"` : '';
    let input;
    switch (f.t) {
      case 'textarea': input = `<textarea id="${id}" name="${f.k}"${ph}${req}>${esc(v)}</textarea>`; break;
      case 'number': input = `<input type="number" step="any" id="${id}" name="${f.k}" value="${esc(v)}"${req}>`; break;
      case 'date': input = `<input type="date" id="${id}" name="${f.k}" value="${esc(v)}"${req}>`; break;
      case 'select': input = `<select id="${id}" name="${f.k}"${req}><option value="">Selecione…</option>${f.opts.map(o => `<option ${o === v ? 'selected' : ''}>${esc(o)}</option>`).join('')}${v && !f.opts.includes(v) ? `<option selected>${esc(v)}</option>` : ''}</select>`; break;
      case 'produtor': input = `<select id="${id}" name="${f.k}"${req}><option value="">Selecione…</option>${S.data.produtores.map(p => `<option value="${esc(p.id)}" ${key(p.id) === key(v) ? 'selected' : ''}>${esc(p.nome)}</option>`).join('')}</select>`; break;
      case 'fazenda': input = `<select id="${id}" name="${f.k}"${req}>${fazOptions(v)}</select>`; break;
      case 'talhao': input = `<select id="${id}" name="${f.k}"${req}>${talOptions(v)}</select>`; break;
      case 'ref': input = `<select id="${id}" name="${f.k}"${req}><option value="">Selecione…</option>${(S.data[f.kind] || []).slice().sort((a, b) => String(a.nome || '').localeCompare(String(b.nome || ''), 'pt-BR')).map(r => `<option value="${esc(r.id)}" ${key(r.id) === key(v) ? 'selected' : ''}>${esc(r.nome || r.codigo || r.id)}</option>`).join('')}</select>`; break;
      case 'talhoes': return `<div class="field full" style="display:grid;gap:4px"><span style="font-size:13px;font-weight:500;color:var(--muted)">${f.l}</span><div class="checks" id="${id}">${v}</div></div>`;
      default: input = `<input type="text" id="${id}" name="${f.k}" value="${esc(v)}"${ph}${req}>`;
    }
    return `<label class="field ${f.full ? 'full' : ''}"><span>${f.l}${f.req ? ' <b>*</b>' : ''}</span>${input}</label>`;
  }
  function detalhes(kind, r) {
    const rows = [];
    if (kind === 'monitoramentos') {
      if (r.estado_hidrico) rows.push(['Estado hídrico', esc(r.estado_hidrico)]);
      if (r.produtividade_estimada) rows.push(['Produtividade estimada', esc(r.produtividade_estimada.toLocaleString('pt-BR'))]);
      if (r.amostras) rows.push(['Amostras', esc(r.amostras)]);
      if (r.pontos_gps) rows.push(['Pontos GPS / fotos', esc(r.pontos_gps) + ' / ' + esc(r.fotos || 0)]);
      if (r.resultados) rows.push(['Resultados', r.resultados.map(x => `${esc(x.alvo)}${x.cientifico ? ` <i class="muted">(${esc(x.cientifico)})</i>` : ''}: <b class="num">${esc(String(x.valor ?? '—').replace('.', ','))}</b> <span class="muted">${esc(x.medida || '')}</span>${x.nivel ? ` <span class="pill ${NIVEL_CLS[x.nivel] || ''}">${esc(x.nivel)}</span>` : ''}`).join('<br>')]);
    }
    if (kind === 'ordens' && r.produtos) {
      if (r.area_ha) rows.push(['Área da ordem', fmtHa(r.area_ha) + ' ha']);
      rows.push(['Produtos', '<div style="overflow-x:auto"><table style="font-size:12px"><thead><tr><th>Produto</th><th>Classe</th><th class="r">Dose</th><th class="r">Total</th><th class="r">Aplicado</th></tr></thead><tbody>' + r.produtos.map(p => `<tr><td>${esc(p.produto)}</td><td>${esc(p.classe || '')}</td><td class="r">${esc(String(p.dose ?? '—').replace('.', ','))} ${esc(p.unidade || '')}</td><td class="r">${esc(String(p.total ?? '—').replace('.', ','))} ${esc(p.unidade_total || '')}</td><td class="r">${p.aplicado_total != null ? esc(String(p.aplicado_total).replace('.', ',')) + ' ' + esc(p.unidade_total || '') : '—'}</td></tr>`).join('') + '</tbody></table></div>']);
    }
    if (kind === 'monitoramentos' && r.amostras_detalhe) rows.push(['Amostras', tabela(['Amostra', 'Alvo', 'Medida', 'Valor', 'Nível'], r.amostras_detalhe.map(a => [a.amostra, esc(a.alvo || ''), esc(a.medida || ''), esc(String(a.valor ?? '—').replace('.', ',')), a.nivel ? `<span class="pill ${NIVEL_CLS[a.nivel] || ''}">${esc(a.nivel)}</span>` : '']))]);
    if (kind === 'ordens') {
      const cond = [['Vazão', r.vazao_l_ha, ' L/ha'], ['Temperatura', r.temperatura_c, ' °C'], ['Umidade', r.umidade_pct, '%'], ['Vento', r.vento_kmh, ' km/h']].filter(x => x[1] != null);
      if (r.data_confirmacao) rows.push(['Confirmada em', fmtDate(r.data_confirmacao)]);
      if (r.talhoes_detalhe) rows.push(['Área por talhão', tabela(['Talhão', 'Planejada (ha)', 'Aplicada (ha)'], r.talhoes_detalhe.map(x => [esc(nomeTal(get('talhoes', x.talhao_id))), fmtHa(x.area_planejada), x.area_aplicada != null ? fmtHa(x.area_aplicada) : '—']))]);
      if (r.aplicacoes) rows.push(['Aplicado no campo', tabela(['Data', 'Talhão', 'Produto', 'Dose', 'Área (ha)', 'Total'], r.aplicacoes.map(a => [fmtDate(a.data), esc(nomeTal(get('talhoes', a.talhao_id))), esc(a.produto || ''), esc(String(a.dose ?? '—').replace('.', ',')) + ' ' + esc(a.unidade || ''), fmtHa(a.area), esc(String(a.total ?? '—').replace('.', ',')) + ' ' + esc(a.unidade_total || '')]))]);
    }
    let fotos = '';
    if (kind === 'monitoramentos' && r.pontos) fotos = `<div style="padding:12px 18px 0;display:grid;gap:8px"><div class="sec-title">Pontos e fotos do campo (${r.pontos.length})${r.pontos.some(p => p.lat) ? `<button class="btn small" data-mapa-mon="${esc(r.id)}">Ver no mapa</button>` : ''}</div><div class="fotos">${r.pontos.map(p => `<figure>${p.foto ? `<a href="${esc(p.foto)}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(p.foto)}" alt="Foto do monitoramento ${esc(fmtDate(p.data))}"></a>` : '<div class="semfoto">Ponto GPS sem foto</div>'}<figcaption>${p.obs ? esc(p.obs) + '<br>' : ''}<span class="muted">${p.data ? esc(fmtDate(p.data) + ' ' + p.data.slice(11, 16)) : ''}${p.lat ? ` · ${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}` : ''}</span></figcaption></figure>`).join('')}</div></div>`;
    if (!rows.length) return fotos;
    return fotos + `<div style="padding:12px 18px 0;display:grid;gap:8px"><div class="sec-title">Detalhes importados do SIMA</div><dl class="facts" style="font-size:13px">${rows.map(([a, b]) => `<dt>${a}</dt><dd>${b}</dd>`).join('')}</dl></div>`;
  }
  const tabela = (h, rows) => `<div style="overflow-x:auto"><table style="font-size:12px"><thead><tr>${h.map(x => `<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c ?? ''}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  function openForm(kind, rec, defaults) {
    const isNew = !rec;
    if (isNew && !podeEditar()) { toast('Seu acesso é só de consulta.'); return; }
    rec = Object.assign({}, defaults || {}, rec || {});
    const fields = FIELDS[kind];
    const bg = document.createElement('div');
    bg.className = 'modal-bg';
    bg.innerHTML = `<div class="modal ${kind === 'monitoramentos' && rec.pontos ? 'wide' : ''}" role="dialog" aria-modal="true" aria-labelledby="mtitle"><header><h2 id="mtitle">${isNew ? 'Novo ' : podeEditar() ? 'Editar ' : ''}${esc(NOME[kind])}</h2><button class="x" data-close aria-label="Fechar">×</button></header>
      <form novalidate>${fields.map(f => fieldHtml(f, f.t === 'talhoes' ? talChecks(rec.fazenda_id, rec.talhao_ids) : rec[f.k])).join('')}</form>
      ${detalhes(kind, rec)}
      <footer>${isNew ? '' : '<button class="btn danger" data-del>Excluir</button>'}<div class="right"><button class="btn" data-close>${podeEditar() ? 'Cancelar' : 'Fechar'}</button><button class="btn primary" data-save>Salvar</button></div></footer></div>`;
    document.body.appendChild(bg);
    const form = $('form', bg);
    const fz = $('#fld-fazenda_id', bg), chk = $('#fld-talhao_ids', bg);
    if (fz && chk) fz.addEventListener('change', () => { chk.innerHTML = talChecks(fz.value, []); });
    const close = () => bg.remove();
    bg.addEventListener('click', async e => {
      if (e.target === bg || e.target.closest('[data-close]')) return close();
      if (e.target.closest('[data-del]')) {
        const b = e.target.closest('[data-del]');
        if (!b.dataset.sure) { b.dataset.sure = 1; b.textContent = 'Confirmar exclusão'; return; }
        try { await Store.remove(kind, rec.id); toast('Excluído.'); close(); if (kind === 'talhoes' && key(S.sel.talhao) === key(rec.id)) { S.sel.talhao = null; drawSheet(); } } catch (e) { }
        return;
      }
      if (e.target.closest('[data-save]')) {
        e.preventDefault();
        const out = { id: isNew ? newId() : rec.id };
        if (!isNew) { Object.assign(out, get(kind, rec.id) || {}); delete out._prod; }
        let missing = null;
        for (const f of fields) {
          if (f.t === 'talhoes') { out[f.k] = [...form.querySelectorAll('input[name="talhao_ids"]:checked')].map(i => { const t = get('talhoes', i.value); return t ? t.id : i.value; }); continue; }
          let v = form.elements[f.k].value.trim();
          if (f.req && !v) { missing = missing || f; continue; }
          if (f.t === 'number') v = v === '' ? null : Number(v);
          else if (['produtor', 'fazenda', 'talhao', 'ref'].includes(f.t)) { const k2 = f.t === 'ref' ? f.kind : { produtor: 'produtores', fazenda: 'fazendas', talhao: 'talhoes' }[f.t]; const r = get(k2, v); v = r ? r.id : (v || null); }
          else v = v || null;
          out[f.k] = v;
        }
        if (missing) { toast('Preencha: ' + missing.l); form.elements[missing.k].focus(); return; }
        try { await Store.save(kind, out); toast(isNew ? 'Cadastrado.' : 'Alterações salvas.'); close(); } catch (e) { }
      }
    });
    setTimeout(() => { const first = form.querySelector('input,select,textarea'); if (first && podeEditar()) first.focus(); }, 20);
  }

  // ---------- Exportar ----------
  async function exportar() {
    const all = { gerado_em: new Date().toISOString() };
    for (const k of KINDS) all[k] = S.data[k].map(r => { const c = Object.assign({}, r); delete c._prod; return c; });
    const json = JSON.stringify(all);
    const name = 'inovaagro-dados-' + today() + '.json';
    try {
      const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
      if (dl) { await dl.save({ filename: name, data: json }); return; }
    } catch (e) { if (e && e.code) { toast('Download cancelado.'); return; } }
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' })); a.download = name; a.click();
  }

  // ---------- Diversos ----------
  let toastT;
  function toast(msg) { let el = $('.toast'); if (!el) { el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); } el.textContent = msg; clearTimeout(toastT); toastT = setTimeout(() => el.remove(), 2800); }

  document.addEventListener('click', e => {
    const n = e.target.closest('[data-new]'); if (n) { openForm(n.dataset.new, null, n.dataset.new === 'monitoramentos' ? { data: today() } : n.dataset.new === 'ordens' ? { status: 'Planejada' } : {}); return; }
    const ed = e.target.closest('[data-edit]'); if (ed) { const [k, id] = ed.dataset.edit.split(':'); openForm(k, get(k, id)); return; }
    const mf = e.target.closest('[data-map-faz]'); if (mf) { e.stopPropagation(); location.hash = 'mapa'; setTimeout(() => selectFazenda(mf.dataset.mapFaz, true), 60); return; }
    const rf = e.target.closest('[data-rep-faz]'); if (rf) { const f = get('fazendas', rf.dataset.repFaz); R.prod = key(f?.produtor_id || ''); R.faz = rf.dataset.repFaz; location.hash = 'relatorios'; return; }
    const bs = e.target.closest('[data-base]'); if (bs) { setBase(bs.dataset.base); return; }
    const mm = e.target.closest('[data-mapa-mon]'); if (mm) { const m = get('monitoramentos', mm.dataset.mapaMon); document.querySelectorAll('.modal-bg').forEach(x => x.remove()); location.hash = 'mapa'; setTimeout(() => { $('#tg-pontos').checked = true; layerPts.addTo(map); const pts = (m.pontos || []).filter(p => p.lat != null); if (pts.length) map.fitBounds(L.latLngBounds(pts.map(p => [p.lat, p.lng])).pad(0.6), { maxZoom: 17 }); if (m.talhao_id) { S.sel = { produtor: get('talhoes', m.talhao_id)?._prod, fazenda: get('talhoes', m.talhao_id)?.fazenda_id, talhao: m.talhao_id }; styleAll(); drawSheet(); renderTree(); } }, 150); return; }
    if (e.target.closest('#v-equipe')) acaoEquipe(e);
    if (e.target.closest('#nav-links a')) document.body.classList.remove('nav-open');
    const act = e.target.closest('[data-act]');
    if (act) {
      const t = get('talhoes', S.sel.talhao);
      switch (act.dataset.act) {
        case 'close': S.sel.talhao = null; drawSheet(); styleAll(); renderTree(); break;
        case 'edit-tal': openForm('talhoes', t); break;
        case 'new-saf': openForm('safras', null, { talhao_id: t.id }); break;
        case 'new-mon': openForm('monitoramentos', null, { talhao_id: t.id, data: today() }); break;
        case 'new-ord': openForm('ordens', null, { fazenda_id: t.fazenda_id, talhao_ids: [t.id], status: 'Planejada', data_prevista: today() }); break;
        case 'fit-all': S.sel = { produtor: null, fazenda: null, talhao: null }; afterSel(false); { const b = boundsOf(S.data.talhoes); if (b) map.fitBounds(b, { padding: [20, 20] }); } break;
        case 'export': exportar(); break;
        case 'import': $('#imp-file').click(); break;
        case 'logout': SB.cli.auth.signOut().then(() => location.reload()); break;
        case 'nav-open': document.body.classList.add('nav-open'); break;
        case 'nav-close': document.body.classList.remove('nav-open'); break;
        case 'copiar-sql': (navigator.clipboard ? navigator.clipboard.writeText(SQL_EQUIPE) : Promise.reject()).then(() => toast('Comando copiado. Agora cole no editor SQL do Supabase.'), () => { const ta = document.createElement('textarea'); ta.value = SQL_EQUIPE; ta.style.cssText = 'width:100%;height:240px'; act.after(ta); ta.select(); toast('Selecione o texto abaixo e copie com Ctrl+C.'); }); break;
      }
      return;
    }
    const tr = e.target.closest('#tree');
    if (tr) {
      const t = e.target.closest('[data-t]'); if (t) { selectTalhao(t.dataset.t, true); return; }
      const f = e.target.closest('summary[data-f]'); if (f) { setTimeout(() => selectFazenda(f.dataset.f, true), 0); return; }
      const p = e.target.closest('summary[data-p]'); if (p) { setTimeout(() => selectProdutor(p.dataset.p), 0); return; }
    }
  });
  document.addEventListener('change', e => { if (e.target.closest('#v-equipe')) acaoEquipe(e); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { const m = $('.modal-bg'); if (m) m.remove(); document.body.classList.remove('nav-open'); } });
  $('#q-mapa').addEventListener('input', renderTree);
  $('#color-by').addEventListener('change', e => { S.colorBy = e.target.value; styleAll(); drawLegend(); renderTree(); if (map) drawLayers(); });
  window.addEventListener('hashchange', route);

  $('#login-form').addEventListener('submit', doLogin);
  $('#imp-file').addEventListener('change', e => { const f = e.target.files[0]; if (f) importarArquivo(f); e.target.value = ''; });
  (async function start() {
    document.body.dataset.papel = S.papel;
    if (SB.on) {
      SB.init();
      if (!(await SB.session())) { showLogin(); return; }
      try { await SB.loadAll(); }
      catch (e) { showLogin('Não foi possível carregar os dados: ' + (e.message || e)); return; }
      const ok = await SB.cli.rpc('sou_membro');
      if (ok.error || !ok.data) { showLogin('O e-mail ' + SB.user.email + ' ainda não tem acesso ou está bloqueado. Peça ao administrador para liberar.'); $('#login-out').hidden = false; return; }
      try { setPapel(await SB.meuPapel() || 'leitura'); }
      catch (e) { S.equipePendente = true; setPapel('editor'); } // banco ainda sem a atualização de permissões
      if (!S.base.produtores.length) setTimeout(() => toast('Banco vazio. Use "Importar dados" para carregar o arquivo exportado.'), 800);
    }
    await loadBase();
    for (const k of Object.keys(VIEWS)) if (!document.getElementById('v-' + k)) { const sec = document.createElement('section'); sec.className = 'view'; sec.id = 'v-' + k; sec.hidden = true; $('main').appendChild(sec); }
    S.version = 0;
    rebuild();
    renderNav();
    route();
    $('#loading').hidden = true;
    await Store.init();
    rebuild(); refresh();
  })();
})();

</script>

</body>

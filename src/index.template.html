<title>INOVAAGRO</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" type="image/png" href="{{FAVICON}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<script>try{var t=localStorage.getItem('inovaagro.tema');if(t==='claro'||t==='escuro')document.documentElement.dataset.theme=t==='claro'?'light':'dark';}catch(e){}</script>
<style>
/*LEAFLET_CSS*/
/*APP_CSS*/
</style>
<aside class="nav" id="nav" aria-label="Menu principal">
  <div class="nav-brand">
    <img class="ws-ic" src="{{ICONE}}" alt="">
    <div class="ws-t"><b>InovaAgro</b><span>Consultoria Agrícola</span></div>
  </div>
  <label class="nav-search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input type="search" id="nav-q" placeholder="Filtrar o menu" aria-label="Filtrar o menu" autocomplete="off"></label>
  <nav class="nav-links" id="nav-links"></nav>
  <div class="nav-foot" id="acct" hidden>
    <div class="nav-me"><span class="avatar sm" id="who-av"></span><div class="who"><b id="who-email"></b><span id="who-papel"></span></div></div>
    <div class="nav-foot-btns"><button class="btn small ghost" data-act="import" data-papel-min="admin">Importar dados</button><button class="btn small ghost" data-act="logout">Sair</button></div>
  </div>
</aside>
<div class="nav-scrim" data-act="nav-close"></div>
<header class="topbar">
  <button class="icon-btn menu-btn" data-act="nav-open" aria-label="Abrir menu"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg></button>
  <div class="crumb"><span id="page-grp"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg><h1 id="page-title">Painel</h1></div>
  <button class="tb-busca" data-acab="buscar" aria-label="Buscar fazenda, talhão ou visita"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Buscar fazenda, talhão ou visita</span><kbd>Ctrl K</kbd></button>
  <button class="icon-btn tb-tema" data-acab="tema" aria-label="Tema claro ou escuro" title="Tema: automático"></button>
  <a class="btn small btn-campo" href="#campo" aria-label="Voltar ao modo campo"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg><span>Modo campo</span></a>
  <a class="icon-btn bell" href="#notificacoes" aria-label="Notificações"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><span class="badge" id="badge-bell" hidden></span></a>
  <div class="sync" id="sync" data-mode="local"><i></i><span>Carregando…</span></div>
  <button class="btn small" id="btn-instalar" data-act="instalar" hidden>Instalar app</button>
  <input type="file" id="imp-file" accept=".json,application/json" hidden>
</header>
<main>
  <section class="view" id="v-painel" hidden></section>
  <section class="view" id="v-mapa" hidden>
    <div class="map-layout">
      <aside class="side">
        <div class="side-head">
          <div class="kpis" id="kpis"></div>
          <input type="search" id="q-mapa" placeholder="Buscar produtor, fazenda ou talhão" aria-label="Buscar no mapa">
        </div>
        <div class="tree" id="tree"></div>
      </aside>
      <div class="map-wrap">
        <div id="map" role="application" aria-label="Mapa dos talhões"></div>
        <div class="map-panel" id="map-panel">
          <div class="seg" role="group" aria-label="Fundo do mapa">
            <button data-base="sat" aria-pressed="true">Satélite</button><button data-base="hib" aria-pressed="false">Satélite + nomes</button><button data-base="ruas" aria-pressed="false">Mapa</button>
          </div>
          <label class="color-by"><span>Colorir por</span><select id="color-by" aria-label="Colorir talhões por">
            <option value="atividade">Atividade (últimos 15 dias)</option><option value="produtor">Produtor</option><option value="situacao">Situação</option><option value="condicao">Condição (último monitoramento)</option><option value="variedade">Variedade</option><option value="cultura">Cultura</option><option value="vigor">Vigor por satélite (NDVI)</option>
          </select></label>
          <label class="tg"><input type="checkbox" id="tg-nomes" checked> Nomes dos talhões e fazendas</label>
          <label class="tg" hidden><input type="checkbox" id="tg-pontos"> Pontos e fotos dos monitoramentos</label>
          <div class="legend" id="legend"></div>
          <div class="vg-mapa" id="vg-mapa" hidden></div>
        </div>
        <div class="map-tools"><button class="btn small" data-act="fit-all">Ver tudo</button><button class="btn small" data-act="export">Exportar dados</button><button class="btn small" data-act="gps">Onde estou</button><button class="btn small" data-act="baixar-mapa" title="Guarda a imagem de satélite da área que está na tela para usar sem internet">Salvar mapa offline</button></div>
        <div class="map-note" id="mapnote" hidden>A imagem de satélite não carregou. Os contornos dos talhões estão corretos; verifique a internet.</div>
        <div class="sheet" id="sheet" hidden></div>
      </div>
    </div>
  </section>
  <section class="view" id="v-produtores" hidden></section>
  <section class="view" id="v-fazendas" hidden></section>
  <section class="view" id="v-talhoes" hidden></section>
  <section class="view" id="v-safras" hidden></section>
  <section class="view" id="v-monitoramentos" hidden></section>
  <section class="view" id="v-ordens" hidden></section>
  <section class="view" id="v-relatorios" hidden></section>
  <section class="view" id="v-equipe" hidden></section>
</main>
<div id="login" hidden class="login-bg"><form id="login-form" class="login-card">
  <img class="login-logo logo-claro" src="{{LOGO}}" alt="InovaAgro Consultoria Agrícola">
  <img class="login-logo logo-escuro" src="{{LOGO_ESCURO}}" alt="InovaAgro Consultoria Agrícola">
  <h2>Entrar no sistema</h2>
  <p class="muted" style="margin:0">Use o e-mail cadastrado pela sua equipe.</p>
  <label class="field"><span>E-mail</span><input type="text" inputmode="email" autocomplete="username" id="lg-email" required></label>
  <label class="field"><span>Senha</span><input type="password" autocomplete="current-password" id="lg-senha" required></label>
  <button class="btn primary big" type="submit">Entrar</button>
  <button class="btn big" type="submit" data-criar="1">Primeiro acesso: criar minha senha</button>
  <button class="btn big" type="button" id="login-offline" hidden data-act="offline">Usar sem internet (dados salvos no aparelho)</button>
  <button class="btn big" type="button" id="login-out" hidden data-act="logout">Sair</button>
  <p id="login-msg" class="muted" role="status" style="margin:0;min-height:1.2em"></p>
</form></div>
<div id="loading" class="loading"><img class="logo-claro" src="{{LOGO}}" alt=""><img class="logo-escuro" src="{{LOGO_ESCURO}}" alt=""><p class="muted">Carregando fazendas e talhões…</p></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
